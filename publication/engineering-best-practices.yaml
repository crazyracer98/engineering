glossary:
  error:
    meaning: a human action or omission that differs from the intended action
    not_same_as: defect, failure
  defect:
    meaning: a flaw in the product, caused by an error
    not_same_as: error, failure
  failure:
    meaning: the product does not perform its required function
    not_same_as: defect (a defect can exist without causing a failure)
  anomaly:
    meaning: behavior that differs from what was expected, with or without harm
    not_same_as: failure (an anomaly can happen without a failure)
  requirement:
    meaning: a measurable statement of what the product must do
    not_same_as: a wish or goal without a measure
  verification:
    meaning: checking that the product was built as the requirements specify ("built right")
    not_same_as: validation
  validation:
    meaning: checking that the product fulfills its intended purpose ("right thing built")
    not_same_as: verification
  domain of applicability:
    meaning: the range of conditions for which a model has been validated
    not_same_as: the range in which a model produces an answer
  consequence:
    meaning: the harm caused if a failure happens
    not_same_as: likelihood
  uncertainty:
    meaning: how poorly the loads, inputs or conditions are known
    not_same_as: consequence
  margin:
    meaning: capacity above the expected load
    not_same_as: redundancy, robustness
  robustness:
    meaning: the result changes little when inputs vary within the specification
    not_same_as: margin; strictness (rejecting input outside the specification, C5)
  fatigue:
    meaning: damage from repeated loads that builds up over time
    not_same_as: overload (one load above the limit)
  oscillation:
    meaning: a control loop switching back and forth around its target
    not_same_as: 'opposite: stable control'
  constraint (bottleneck):
    meaning: the part of a system that limits its total output
    not_same_as: any slow part
  critical path:
    meaning: the longest chain of dependent tasks
    not_same_as: the most important tasks
  hold point:
    meaning: a check that work cannot pass until it is approved
    not_same_as: witness point (work continues while the check is observed)
  drift:
    meaning: a change in real-world data that makes a model less accurate
    not_same_as: a defect in the model
  measurement uncertainty:
    meaning: the spread of values that could reasonably be attributed to a measured quantity
    not_same_as: error (the difference from the true value)
  chain of custody:
    meaning: a record of who held a piece of evidence, and when
    not_same_as: ownership
  actionable alert:
    meaning: an alert that requires a defined human action now
    not_same_as: an informational message
  commissioning:
    meaning: testing that all parts work together against the owner's requirements before handover
    not_same_as: testing each part alone
  provenance:
    meaning: the documented origin, batch and certificate of a part
    not_same_as: a part's current location
  exact constraint:
    meaning: each property is set by exactly one mechanism
    not_same_as: 'opposite: over-constraint (several mechanisms set the same property)'
  weakest link:
    meaning: the single part whose failure makes the whole system fail
    not_same_as: the average part
  set-based design:
    meaning: keeping several alternatives open and eliminating weak ones as evidence arrives
    not_same_as: 'opposite: point-based design (choosing one option early)'
  cliff effect:
    meaning: output stays perfect until it collapses suddenly
    not_same_as: gradual degradation
  redundancy:
    meaning: a second copy of a part that takes over when the first copy fails
    not_same_as: diversity
  diversity:
    meaning: copies that are built differently, so one cause cannot fail all of them
    not_same_as: redundancy
  compartment:
    meaning: an isolated part of the system that contains a failure
    not_same_as: 'opposite: shared failure domain'
  graceful degradation:
    meaning: losing lower-priority functions while critical functions keep running
    not_same_as: 'opposite: cascading failure'
  safe state:
    meaning: a predefined state that causes no harm
    not_same_as: normal operating state
  isolation:
    meaning: disconnecting a part from all inputs and energy, and locking that state
    not_same_as: switching off (anyone can switch it on again)
  control:
    meaning: a measure that reduces risk
    not_same_as: a check (a check detects; a control reduces)
  critical control point:
    meaning: a process step where control is essential to prevent a hazard
    not_same_as: every process step
  critical limit:
    meaning: a minimum or maximum value that must be kept at a critical control point
    not_same_as: a target value
  checker:
    meaning: a person, other than the author, who reviews work
    not_same_as: the author
  universal rule (U):
    meaning: a rule whose condition is true, or whose trigger occurs, in every engineered system; its intensity scales with the master rule
    not_same_as: a rule that applies everywhere at full strength
  risk-scaled rule (R):
    meaning: a rule that applies only above a consequence or uncertainty threshold set by the rigor matrix
    not_same_as: conditional rule
  conditional rule (C):
    meaning: a rule that applies only when the system has a property that a common class of systems lacks
    not_same_as: risk-scaled rule
  trigger:
    meaning: an event that happens in the life of every system, such as a failure, a change or a decision
    not_same_as: scope condition (a property only some systems have)
  psychological safety:
    meaning: a shared belief that the team is safe for interpersonal risk taking
    not_same_as: comfort or low standards (a team can be safe and demanding)
  conflict of interest:
    meaning: a personal interest that could influence, or appear to influence, a person's judgment
    not_same_as: a disagreement about a decision
  commander's intent:
    meaning: the purpose, the desired end state and the constraints of a task
    not_same_as: a plan or a step list (the method)
  reversible decision (two-way door):
    meaning: a decision whose effects can be undone at low cost
    not_same_as: '**opposite:** irreversible decision (one-way door)'
  indicator:
    meaning: a measure that shows how a process or system behaves
    not_same_as: target (a value someone is rewarded for reaching)
  stop criterion:
    meaning: evidence, written before a project starts, that ends the project when it occurs
    not_same_as: a milestone (marks progress, does not decide continuation)
  escalation of commitment:
    meaning: adding resources to a failing course of action because of earlier investment
    not_same_as: persistence based on new evidence
  segregation of duties:
    meaning: splitting a process so that no single person controls all its steps
    not_same_as: two-person rule (two people at one moment of action, R6)
  work in progress (WIP):
    meaning: work items that have started and are not finished
    not_same_as: backlog (work not started)
  lead time:
    meaning: time from the start of a work item to its finish
    not_same_as: effort (working hours spent on it)
  span of control:
    meaning: the number of people one person directly directs
    not_same_as: the size of the whole unit
  unity of command:
    meaning: each person reports to exactly one person for a given task
    not_same_as: '**opposite:** dual reporting for the same task'
  engineering organization:
    meaning: two or more people who design, build or operate a system together
    not_same_as: a one-person business (rules on delegation, segregation and teams cannot apply to it)
  manager:
    meaning: a person who is accountable for the work of other people
    not_same_as: the governing body (which oversees managers)
  governing body:
    meaning: the group that holds management accountable (board, supervisory board, steering committee)
    not_same_as: management
  accountable:
    meaning: answers for the result and makes the final decision; exactly one person per objective
    not_same_as: responsible (does the work; can be several people)
  objective:
    meaning: a measurable statement of what must be achieved, by when
    not_same_as: a goal without a measure ("be the best")
  tolerance:
    meaning: the permitted deviation from a plan (time, cost, scope, quality, risk) before a decision moves up one level
    not_same_as: a target value
  exception:
    meaning: a forecast or actual breach of a tolerance
    not_same_as: a routine status report
  risk appetite:
    meaning: the amount and type of risk the governing body accepts to achieve its objectives
    not_same_as: risk capacity (the maximum risk the organization can survive)
  fair process:
    meaning: engaging people, explaining the decision, and stating new expectations
    not_same_as: consensus (fair process is "not decision by consensus")
  reference class:
    meaning: a set of past, similar projects with known outcomes
    not_same_as: the current project's own plan (inside view)
  stage gate:
    meaning: a decision point at which an initiative is continued, changed or stopped
    not_same_as: a status meeting (no stop decision)
  business case:
    meaning: the documented reason to start and continue an initiative
    not_same_as: the project plan
  verification (management):
    meaning: checking that the deliverable meets the agreed specification ("doing things right")
    not_same_as: validation
  validation (management):
    meaning: checking that the deliverable creates the intended benefit ("doing the right things")
    not_same_as: verification
  after-action review:
    meaning: a non-punitive discussion of what happened, why, and how to improve
    not_same_as: '**opposite:** a critique that looks for a person to blame'
  maximum tolerable period of disruption (MTPD):
    meaning: the time after which the impact of not resuming an activity becomes unacceptable
    not_same_as: recovery time objective
  recovery time objective (RTO):
    meaning: the time within which an activity must resume at a minimum acceptable capacity; set inside the MTPD
    not_same_as: MTPD
  legal hold:
    meaning: an instruction to preserve documents and data because litigation or an investigation is reasonably anticipated
    not_same_as: normal retention (documents may be deleted on schedule)
  key person:
    meaning: a person whose sudden absence would stop a critical function
    not_same_as: a senior person (seniority is not the test)
  red team:
    meaning: an independent group that applies structured critical thinking to a plan before the decision
    not_same_as: internal audit (checks after the fact)
rigor_matrix:
- consequence: low
  uncertainty: low
  apply:
  - all U-rules
  - C-rules whose condition is true
  checker_level: peer
- consequence: low
  uncertainty: high
  apply:
  - all U-rules
  - C-rules whose condition is true
  - R4
  - R7
  - R8
  checker_level: peer
- consequence: high
  uncertainty: low
  apply:
  - all U-rules
  - C-rules whose condition is true
  - R1
  - R2
  - R3
  - R6
  - R9
  checker_level: external
- consequence: high
  uncertainty: high
  apply:
  - all U-rules
  - C-rules whose condition is true
  - all R-rules
  checker_level: external
rules:
- id: U1
  name: Public safety first
  class: universal
  class_note: true for every system
  strength: MUST
  category: A
  if: always
  then: put public safety above cost, schedule and convenience
  because: failures harm people outside the project
  example: block a release that leaks user data
  check: every release gate contains a safety and security sign-off item
  violation: shipping a known safety defect to meet a deadline
  related:
    strengthens:
    - U26
    - U27
  evidence: strong
  evidence_note:
  source_domain: all (professional ethics)
  notes:
  sources:
  - title: NSPE Ethics Reference Guide
    url: https://www.nspe.org/sites/default/files/resources/pdfs/Ethics/EthicsReferenceGuide.pdf
  management:
    name: Public safety first
    form_name: Duty of care and ethics first
    form: put the safety, health and legal rights of people (customers, the public, the own people) above cost, schedule and convenience
    example: the manager stops a launch that would process personal data without a legal basis
    evidence: strong
    evidence_note:
    sources:
    - title: 'ISO 9001:2026 launch: "ethical behaviour"'
      url: https://www.iso.org/news/2026/09/ISO9001-2026
    - title: ISO 45001:2018
      url: https://www.iso.org/standard/63787.html
- id: U2
  name: Work within competence
  class: universal
  class_note: true for every system
  strength: MUST
  category: A
  if: always
  then: work only within your competence, and involve an expert outside it
  because: error rates rise outside known areas
  example: a security engineer reviews an IAM design
  check: each design has a named checker with expertise in its domain
  violation: approving work in a domain you do not know
  related:
    strengthens:
    - U8
  evidence: strong
  evidence_note:
  source_domain: all (professional ethics)
  notes:
  sources:
  - title: NSPE Ethics Reference Guide
    url: https://www.nspe.org/sites/default/files/resources/pdfs/Ethics/EthicsReferenceGuide.pdf
  management:
    name: Work within competence
    form_name: Competence management
    form: give work only to people competent for it, and train them or add an expert otherwise
    example: a team lead without labour-law knowledge asks HR before changing on-call rules
    evidence: strong
    evidence_note:
    sources:
    - title: COSO ERM principle 5
      url: https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf
    - title: 'ADP 6-0: principle "Competence"'
      url: https://irp.fas.org/doddir/army/adp6_0.pdf
- id: U3
  name: Measurable requirements
  class: universal
  class_note: true for every system
  strength: MUST
  category: B
  if: always
  then: write each requirement as measurable, and link it to a user need
  because: an unmeasurable requirement cannot be verified
  example: '"p95 latency \< 200 ms", linked to a ticket'
  check: every requirement has an acceptance criterion and a link to a user need
  violation: '"the system shall be fast"'
  related:
    strengthens:
    - U4
    - R3
  evidence: moderate
  evidence_note:
  source_domain: systems engineering
  notes:
  sources:
  - title: FDOT Systems Engineering 100
    url: https://wbt.dot.state.fl.us/ois/ITS-SystemsEngineering100/SystemsEngineeringPt2-m2-TRANSCRIPT.pdf
  management:
    name: Measurable requirements
    form_name: Measurable objectives
    form: write each objective with a measure, a target, a deadline and one owner, and link it to a customer or stakeholder need
    example: '"reduce median time to provision a namespace from 3 days to 1 hour by Q2", owner named'
    evidence: strong
    evidence_note:
    sources:
    - title: 'NIMS: management by objectives'
      url: https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf
    - title: Locke & Latham 2002
      url: https://goal-lab.psych.umn.edu/orgpsych/2020/readings/5.%20Motivation/Locke%20&%20Latham%20(2002).pdf
- id: U4
  name: Verification and validation
  class: universal
  class_note: true for every system
  strength: MUST
  category: F
  if: always
  then: do verification AND validation, and before handover test that all parts work together against the owner's requirements (commissioning)
  because: passing one does not mean passing the other, and parts that pass alone can fail together
  example: CI tests pass = verification; user acceptance = validation; end-to-end test of a new platform with DNS, certificates, monitoring and backup
  check: both a test result and a stakeholder acceptance exist
  violation: declaring the work done because tests pass
  related:
    depends_on:
    - U3
  evidence: strong
  evidence_note:
  source_domain: systems engineering, building services (commissioning)
  notes:
  sources:
  - title: 'arXiv: V&V in Systems of Systems'
    url: https://arxiv.org/pdf/1311.3626
  - title: 'Wikipedia: Building commissioning'
    url: https://en.wikipedia.org/wiki/Building_commissioning
  management:
    name: Verification and validation
    form_name: Acceptance and benefits review
    form: check that deliverables meet the specification (verification) and that the intended benefit is reached (validation); keep the business case valid during the whole initiative
    example: the developer portal is accepted against its spec, and six months later adoption is measured
    evidence: moderate
    evidence_note:
    sources:
    - title: PRINCE2 principle 1 "Ensure continued business justification"
      url: https://purplegriffon.com/blog/prince2-7th-edition-principles
- id: U5
  name: Find defects early
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: F
  if: always
  then: find and fix defects at the earliest possible stage
  because: the cost of a fix rises at each later stage
  example: lint and tests run in CI before merge
  check: each check runs at the first stage where it can run
  violation: finding defects only in production
  related:
    strengthens:
    - U6
    - U28
  evidence: moderate
  evidence_note: direction strong; the '10x per stage' factor is weak
  source_domain: software engineering
  notes:
  sources:
  - title: 'arXiv: Revisiting cost-to-fix'
    url: https://arxiv.org/pdf/1609.04886
  management:
    name: Find defects early
    form_name: Early review of plans
    form: review plans and business cases before money and people are committed
    example: a one-page proposal is reviewed before a quarter of work is planned
    evidence: moderate
    evidence_note:
    sources:
    - title: Deming point 3
      url: https://deming.org/explore/fourteen-points/
- id: U6
  name: Failure and interaction analysis
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: before you build, list how each part can fail, how parts that have not failed can interact unsafely, and how the system can cause harm while working as designed (insufficient design or foreseeable misuse)
  because: a known failure or interaction can be designed against
  example: '"what happens if the registry is down?" and "what if two controllers fight over the same resource?"'
  check: a list of failure modes and unsafe interactions exists per component and is reviewed
  violation: the first failure analysis happens after an incident
  related:
    strengthens:
    - U25
    - R1
    - R2
    - U26
    - U27
    - U34
  evidence: moderate
  evidence_note: method widely used; RPN scoring criticized
  source_domain: reliability and safety (FMEA, STPA), automotive (SOTIF)
  notes:
  sources:
  - title: 'EBSCO: FMEA'
    url: https://www.ebsco.com/research-starters/social-sciences-and-humanities/failure-mode-and-effects-analysis-fmea
  - title: 'BMJ Qual Saf / PMC: FMEA outputs - are they valid?'
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3405478/
  - title: 'Leveson & Thomas: STPA Handbook'
    url: https://www.flighttestsafety.org/images/STPA_Handbook.pdf
  - title: 'Swift Navigation: What is SOTIF (ISO 21448)?'
    url: https://www.swiftnav.com/glossary/what-is-safety-of-the-intended-functionality-sotif
  management:
    name: Failure and interaction analysis
    form_name: Pre-mortem and portfolio risk view
    form: before starting, assume the initiative has failed and list the reasons; also list how parallel initiatives can interfere with each other
    example: a pre-mortem before a cluster migration finds that two teams plan the same freeze window
    evidence: moderate
    evidence_note:
    sources:
    - title: Klein 2007 (HBR)
      url: https://hbr.org/2007/09/performing-a-project-premortem
    - title: COSO ERM principles 10 and 14
      url: https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf
- id: U7
  name: Simplicity and modularity
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: choose the simplest design that meets the requirements, and split it into modules
  because: every added part adds a way to fail
  example: one Helm chart per app, not one chart for all
  check: each component has one stated purpose, and no part is unused
  violation: adding features for imagined future needs
  related:
    conflicts_with:
    - U25
    - R1
    - R2
    - U29
    - U34
    - C3
  evidence: moderate
  evidence_note:
  source_domain: aerospace (Lockheed Skunk Works), software
  notes:
  sources:
  - title: "Hoare: The Emperor's Old Clothes, Turing Award lecture (CACM 1981)"
    url: https://worrydream.com/refs/Hoare_1981_-_The_Emperors_Old_Clothes.pdf
  - title: 'Grokipedia: KISS principle'
    url: https://grokipedia.com/page/KISS_principle
  management:
    name: Simplicity and modularity
    form_name: Simple structures, few priorities
    form: use the fewest layers, rules, meetings and priorities that meet the objective; stop work that is not needed
    example: one team backlog with one ranked list, not three parallel priority lists
    evidence: moderate
    evidence_note:
    sources:
    - title: Agile principle 10
      url: https://agilemanifesto.org/principles
- id: U8
  name: Independent checker
  class: universal
  class_note: true for every system
  strength: MUST
  category: F
  if: always
  then: "have a checker review the work, and raise the checker's independence with the consequence of failure: self → peer → external organization"
  because: authors do not see their own errors, and shared assumptions hide shared errors
  example: required PR approval; external penetration test for high-consequence systems
  check: every change has a checker who is not the author, and the checker's independence matches the rigor matrix
  violation: the author merges their own change
  related:
    depends_on:
    - U2
  evidence: strong
  evidence_note:
  source_domain: technical drawing (checker in the title block), civil and structural (independent checking)
  notes:
  sources:
  - title: 'Singapore: Building Control (Accredited Checkers and Accredited Checking Organisations) Regulations'
    url: https://sso.agc.gov.sg/SL/BCA1989-RG2?DocDate=20121130
  - title: 'LibreTexts: Peer review in design'
    url: https://eng.libretexts.org/Courses/Western_Technical_College/Inventor_Parametric_Design:_Level_1_%28Bahl%29/01:_Technical_Drawings/1.02:_Peer_Review_Process_and_Markup_Drawings/1.2.01:_The_Role_of_Peer_Review_in_Engineering_Design
  - title: 'EPCLand: Checking of design'
    url: https://epcland.com/checking-of-design-engineering-checklist/
  - title: 'IIA: The Three Lines Model (2020)'
    url: https://www.theiia.org/globalassets/documents/resources/the-iias-three-lines-model-an-update-of-the-three-lines-of-defense-july-2020/three-lines-model-updated-english.pdf
  - title: Regulation (EU) No 537/2014, Article 17 (text copy)
    url: https://www.charteredaccountants.ie/chariotindex/text/ec_2014_537/17.html
  - title: 'UK MoD: Red Teaming Handbook, 3rd ed. (2021)'
    url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1027158/20210625-Red_Teaming_Handbook.pdf
  management:
    name: Independent checker
    form_name: Independent assurance, scaled to consequence
    form: "raise the checker's independence with consequence: peer review → independent second or third line → external audit; rotate long-serving external auditors"
    example: a team lead's budget is checked by finance; the company's accounts by an external auditor
    evidence: strong
    evidence_note: EU law for public-interest entities
    sources:
    - title: IIA principle 5
      url: https://www.theiia.org/globalassets/documents/resources/the-iias-three-lines-model-an-update-of-the-three-lines-of-defense-july-2020/three-lines-model-updated-english.pdf
    - title: EU 537/2014 Art. 17
      url: https://www.charteredaccountants.ie/chariotindex/text/ec_2014_537/17.html
    - title: UK MoD Red Teaming Handbook
      url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1027158/20210625-Red_Teaming_Handbook.pdf
- id: U9
  name: Versioning and change review
  class: universal
  class_note: true for every system
  strength: MUST
  category: G
  if: always
  then: version every artifact; before each change, review its technical basis, its safety impact and the procedures it affects, approve it, and inform the affected people before go-live
  because: an unknown version makes failures unreproducible, and an unreviewed change brings in unknown hazards
  example: 'GitOps: every change is a reviewed pull request; the runbook is updated in the same pull request'
  check: every change record shows basis, impact review and approval, and the deployed state matches an approved commit
  violation: a manual change in production (drift)
  related:
    strengthens:
    - U10
  evidence: strong
  evidence_note:
  source_domain: all (configuration management), chemical process safety (management of change)
  notes:
  sources:
  - title: 'arXiv: Controls and machine protection'
    url: https://arxiv.org/pdf/1608.02836
  - title: 'arXiv: Agentic Configuration Management'
    url: https://arxiv.org/pdf/2608.11166
  - title: OSHA 29 CFR 1910.119 (management of change)
    url: https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.119
  management:
    name: Versioning and change review
    form_name: Document control and management of change
    form: version policies, processes and organization charts; review each change for its effects before it takes effect, and inform the people affected
    example: the on-call policy is versioned in git and changed only by reviewed pull request
    evidence: strong
    evidence_note:
    sources:
    - title: ISO/IEC 20000-1:2018
      url: https://www.iso.org/standard/70636.html
    - title: COSO ERM principle 15 "Assesses Substantial Change"
      url: https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf
- id: U10
  name: Blameless root cause analysis
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: I
  if: a failure has happened
  then: find the root cause in the system, not a person to blame
  because: blame makes people hide information
  example: blameless postmortem with 5 Whys
  check: each failure above a set severity has a postmortem with system-level actions
  violation: '"operator error" as the final root cause'
  related:
    depends_on:
    - U9
    strengthens:
    - U11
  evidence: moderate
  evidence_note:
  source_domain: site reliability engineering
  notes:
  sources:
  - title: 'Google SRE: Postmortem culture'
    url: https://sre.google/workbook/postmortem-culture/
  management:
    name: Blameless root cause analysis
    form_name: After-action review
    form: after an event, discuss without blame what happened, why, and how to improve
    example: 'after a failed reorganization: an AAR with all affected teams'
    evidence: strong
    evidence_note: doctrine
    sources:
    - title: 'US Army: Foundations of the After Action Review Process (DTIC)'
      url: https://apps.dtic.mil/sti/pdfs/ADA368651.pdf
    - title: Deming point 8
      url: https://deming.org/explore/fourteen-points/
- id: U11
  name: Plan-Do-Check-Act
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: I
  if: always
  then: repeat the cycle Plan → Do → Check → Act
  because: improvement is a cycle, not a single event
  example: retrospective after each sprint
  check: actions from earlier cycles are tracked until they are completed
  violation: the same failure happens again with no process change
  related:
    depends_on:
    - U10
    - U13
  evidence: strong
  evidence_note:
  source_domain: quality management (ISO 9001)
  notes:
  sources:
  - title: 'ASQ: PDCA Cycle'
    url: https://asq.org/quality-resources/pdca-cycle
  - title: 'ISO Central: PDCA'
    url: https://isocentral.org/resources/what-is-plan-do-check-act
  management:
    name: Plan-Do-Check-Act
    form_name: Regular reflection and adjustment
    form: run the improvement cycle at fixed intervals and track actions to completion
    example: a retrospective at the end of every sprint and quarter
    evidence: strong
    evidence_note:
    sources:
    - title: Agile principle 12
      url: https://agilemanifesto.org/principles
    - title: ISO 9001:2026
      url: https://www.iso.org/news/2026/09/ISO9001-2026
- id: U12
  name: Least privilege
  class: universal
  class_note: true for every system
  strength: MUST
  category: D
  if: always
  then: give each person, service and process only the minimum access its function needs
  because: minimum access limits the damage when one part is compromised
  example: Kubernetes RBAC scoped to one namespace
  check: no role holds a permission that was unused for a set period
  violation: a CI pipeline with cluster-admin rights
  related:
    strengthens:
    - U27
    - U29
  evidence: strong
  evidence_note:
  source_domain: security engineering (NIST)
  notes:
  sources:
  - title: 'NIST CSRC Glossary: least privilege (CNSSI 4009, SP 800-53 Rev. 5)'
    url: https://csrc.nist.gov/glossary/term/least_privilege
  - title: 'Jamf: NIST definition of least privilege'
    url: https://www.jamf.com/blog/zero-trust-vs-least-privilege/
  management:
    name: Least privilege
    form_name: Need-to-know and limits of authority
    form: give each person only the information, data and decision authority their role needs; set written limits of authority
    example: spending authority of team leads limited to an amount; personal data visible only to HR
    evidence: strong
    evidence_note: law for personal data
    sources:
    - title: GDPR Art. 5(1)(c) data minimisation
      url: https://gdpr-info.eu/art-5-gdpr/
- id: U13
  name: Monitoring in operation
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: H
  if: the system is in operation
  then: measure its behavior in real use, and alert on symptoms that users feel; where the output stays perfect until a sudden collapse (cliff effect), also monitor the remaining margin
  because: tests before release cannot cover all real conditions, and some systems show no symptom until they fail completely
  example: alerts on latency, traffic, errors and saturation; certificate days left, disk headroom, error budget
  check: each service has dashboards and alerts for user-facing symptoms
  violation: learning about an outage from users
  related:
    strengthens:
    - U10
    - U11
    - U18
    checks:
    - U25
    - U35
  evidence: moderate
  evidence_note:
  source_domain: site reliability engineering, broadcast (confidence monitoring)
  notes:
  sources:
  - title: 'Google SRE: Monitoring distributed systems'
    url: https://sre.google/sre-book/monitoring-distributed-systems/
  - title: 'TV Technology: Confidence monitors'
    url: https://www.tvtechnology.com/opinions/confidence-monitors
  management:
    name: Monitoring in operation
    form_name: Performance monitoring and going to see
    form: track leading and lagging indicators, and regularly go to the place where the work happens
    example: the manager joins an on-call shift each quarter, besides reading the dashboard
    evidence: moderate
    evidence_note:
    sources:
    - title: COSO ERM principle 16 "Reviews Risk and Performance"
      url: https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf
    - title: 'Wikipedia: Genchi Genbutsu'
      url: https://en.wikipedia.org/wiki/Genchi_Genbutsu
- id: U14
  name: Lifecycle and decommissioning
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: plan operation, maintenance and decommissioning at design time
  because: early design decisions fix most end-of-life costs
  example: define how to delete a cluster and its data before creating it
  check: each design document has a maintenance and a decommissioning section
  violation: orphaned resources that nobody can safely remove
  related:
    strengthens:
    - U7
    - U16
  evidence: moderate
  evidence_note:
  source_domain: nuclear, offshore, aerospace
  notes:
  sources:
  - title: 'IAEA: Decommissioning by design'
    url: https://www.iaea.org/bulletin/decommissioning-by-design-how-advanced-reactors-are-designed-with-disposal-in-mind
  - title: 'NASA: Design for maintenance'
    url: https://ntrs.nasa.gov/api/citations/20240004739/downloads/Design%20for%20Maintenance%20DoD%20HFE%20TAG%2076%20041724.pdf
  - title: 'JPT: Engineering for decommissioning'
    url: https://jpt.spe.org/engineering-decommissioning-during-project-design-reduces-costs
  management:
    name: Lifecycle and decommissioning
    form_name: Plan the exit at the start
    form: 'when starting a contract, project, product, data collection or role, plan how it ends: exit clause, closure, sunset, deletion, handover'
    example: every vendor contract has an exit and data-return clause; personal data has a deletion date
    evidence: strong
    evidence_note: law for personal data
    sources:
    - title: GDPR Art. 5(1)(e) storage limitation
      url: https://gdpr-info.eu/art-5-gdpr/
- id: U15
  name: Human factors
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: C
  if: a person uses or operates the system
  then: design the interface for the real user in the real environment, including stress, and for the full range of users, not an average user
  because: a poor interface causes errors
  example: a runbook that works at 3 a.m.; unambiguous CLI output
  check: critical tasks are tested with real users or operators
  violation: blaming users for errors that the interface invites
  related:
    depends_on:
    - U10
    strengthens:
    - U28
  evidence: moderate
  evidence_note: strong in medical devices
  source_domain: human factors, medical devices, biomechanics (anthropometry)
  notes:
  sources:
  - title: 'FDA: Applying Human Factors and Usability Engineering to Medical Devices (guidance)'
    url: https://www.fda.gov/regulatory-information/search-fda-guidance-documents/applying-human-factors-and-usability-engineering-medical-devices
  - title: 'MD+DI: Human factors engineering'
    url: https://www.mddionline.com/design-engineering/making-the-most-of-human-factors-usability-engineering
  - title: 'egtechnology: Usability example'
    url: https://www.egtechnology.co.uk/human-factors-and-usability-engineering-a-must-or-a-good-to-have-part-1/
  - title: 'Wikipedia: Anthropometry'
    url: https://en.wikipedia.org/wiki/Anthropometry
  management:
    name: Human factors
    form_name: Work designed for real people
    form: 'design roles, processes and tools for real people under real conditions: clear roles, plans and goals, and a workload people can carry'
    example: each team member can name their role and the team's current goal
    evidence: moderate
    evidence_note:
    sources:
    - title: 'Google re:Work: "Structure and clarity"'
      url: https://rework.withgoogle.com/intl/en/guides/understand-team-effectiveness
- id: U16
  name: Sustainability
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: A
  if: always
  then: reduce environmental impact and resource use across the whole lifecycle
  because: NSPE canon 1 includes sustainable development
  example: scale idle environments to zero
  check: resource use is measured and reviewed
  violation: unused resources running all the time
  related:
    depends_on:
    - U14
  evidence: moderate
  evidence_note:
  source_domain: all (professional ethics)
  notes:
  sources:
  - title: "NSPE: Sustainability and the PE's obligations"
    url: https://www.nspe.org/career-growth/pe-magazine/winter-2023/sustainability-the-pe-s-obligations
  management:
    name: Sustainability
    form_name: Environmental and social sustainability
    form: include environmental and social impact in decisions across the whole life cycle, including procurement
    example: cloud cost and energy reports reviewed with the budget
    evidence: strong
    evidence_note:
    sources:
    - title: ISO 14001:2026 (via 2015 page)
      url: https://www.iso.org/standard/60857.html
    - title: ISO 20400:2017
      url: https://www.iso.org/standard/63026.html
    - title: 'PMBOK 8: "integrate sustainability"'
      url: https://www.pmi.org/standards/pmbok/about
- id: U17
  name: Test as you operate
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: F
  if: a test must show that the system is ready
  then: run the test in the same configuration and conditions as real operation, and test again after every repair
  because: systems that passed every test have failed in operation because operation differed from the test
  example: staging uses the same image digest and Helm values as production
  check: the differences between the test setup and real operation are listed, and each one is justified
  violation: testing a different build than the one that is deployed
  related:
    depends_on:
    - U4
    strengthens:
    - U5
  evidence: moderate
  evidence_note:
  source_domain: aerospace (Test Like You Fly)
  notes:
  sources:
  - title: 'Aerospace Corp: Test Like You Fly Process Guide'
    url: https://aerospace.org/sites/default/files/2024-06/TOR-2014-02537-REV%20A%20-%20The%20Test%20Like%20You%20Fly%20Process%20Guide%20for%20Space,%20Launch,%20and%20Ground%20Systems.pdf
  management:
    name: Test as you operate
    form_name: Pilots and exercises under real conditions
    form: test new processes, plans and organizations in real conditions before full rollout, and exercise continuity plans
    example: a new on-call model is piloted with one team for one month; the continuity plan is exercised once a year
    sources_text: '[ISO 22301:2019 (catalogue page)](https://www.iso.org/standard/75106.html) (supports)'
    evidence: moderate
    evidence_note:
    sources:
    - title: ISO 22301:2019
      url: https://www.iso.org/standard/75106.html
- id: U18
  name: Investigate anomalies
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: I
  if: the system behaves differently from what was expected, even if nobody was harmed
  then: record the anomaly and investigate it before you accept it as normal
  because: ignored warning signs come before major accidents
  example: a flaky test, or an alert that everyone silences
  check: 'each anomaly has a ticket with a decision: fix it, or accept it with a written reason'
  violation: silencing an alert permanently without an investigation
  related:
    depends_on:
    - U13
    - U20
    strengthens:
    - U10
  evidence: moderate
  evidence_note:
  source_domain: aerospace, accident research (normalization of deviance)
  notes:
  sources:
  - title: 'Wikipedia: Normalization of deviance'
    url: https://en.wikipedia.org/wiki/Normalization_of_deviance
  - title: 'National Academies: Accident precursor analysis'
    url: https://www.nationalacademies.org/read/11061/chapter/8
  management:
    name: Investigate anomalies
    form_name: Weak signals and near misses
    form: record and investigate deviations even when nothing went wrong, before they become normal
    example: three projects in a row miss their deadline by two weeks → investigated as a pattern
    evidence: strong
    evidence_note:
    sources:
    - title: CAIB report summary
      url: https://www.globalsecurity.org/space/library/report/2003/caib-report_vol-1_august2003.htm
- id: U19
  name: Small verified steps
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: G
  if: a change carries risk
  then: make the change in small steps, check the result of each step before the next one, and define each check as a hold point (work stops until the check is approved) or a witness point (work continues while the check is observed)
  because: small steps limit how much harm one wrong step can do
  example: canary rollout at 1 % → 10 % → 100 %, with a manual approval gate (hold point) before 100 %
  check: each risky rollout has defined steps, and each check between steps is marked as hold point or witness point
  violation: switching all traffic at once
  related:
    depends_on:
    - U13
    strengthens:
    - R4
  evidence: moderate
  evidence_note:
  source_domain: flight testing (build-up approach), construction management (hold points)
  notes:
  sources:
  - title: 'Google SRE Workbook: Canarying Releases'
    url: https://sre.google/workbook/canarying-releases/
  - title: 'Flight Test Fact: The build-up approach'
    url: https://flighttestfact.com/the-build-up-approach/
  - title: 'Quality Engineers Guide: Hold point and witness point'
    url: https://www.qualityengineersguide.com/what-is-witness-point-and-hold-point
  management:
    name: Small verified steps
    form_name: Iterative delivery and management stages
    form: deliver and decide in small steps, and decide at the end of each stage whether to continue
    example: a reorganization is piloted in one department before it rolls out
    evidence: strong
    evidence_note:
    sources:
    - title: 'DORA: small batches'
      url: https://dora.dev/capabilities/working-in-small-batches/
    - title: PRINCE2 principle 4 "Manage by stages"
      url: https://purplegriffon.com/blog/prince2-7th-edition-principles
- id: U20
  name: Stop authority
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: A
  if: anyone finds a problem that could cause harm
  then: let that person stop the work without needing permission and without being blamed; the stop must always be available, must override all other functions, and resetting it must not restart the system
  because: the person nearest to a problem sees it first
  example: a deploy freeze that overrides Argo CD auto-sync; lifting the freeze requires an explicit sync
  check: the stop mechanism exists, works in every operating mode, does not restart on reset, and every use is reviewed without blame
  violation: a release continues while a known problem is still being discussed
  related:
    depends_on:
    - U10
    strengthens:
    - U1
    - U18
  evidence: strong
  evidence_note: emergency stop is standardized in ISO 13850
  source_domain: manufacturing (Toyota andon), machinery (emergency stop)
  notes:
  sources:
  - title: 'Wikipedia: Andon (manufacturing)'
    url: https://en.wikipedia.org/wiki/Andon_%28manufacturing%29
  - title: ISO 13850:2015 Emergency stop function (sample)
    url: https://cdn.standards.iteh.ai/samples/59970/06ad76004ab746ff90b82cf44a8b0752/ISO-13850-2015.pdf
  - title: Directive (EU) 2019/1937 (EUR-Lex)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32019L1937
  management:
    name: Stop authority
    form_name: Speak-up and stop-the-line
    form: let every person raise a concern or stop work without permission and without retaliation; provide a confidential reporting channel and follow up every report
    example: any engineer may pause a release; an anonymous channel exists for legal and ethical concerns
    evidence: strong
    evidence_note: 'EU law: internal channels required for private entities with 50 or more workers'
    sources:
    - title: Directive (EU) 2019/1937, Art. 8(3) and recital 88
      url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:32019L1937
    - title: Deming point 8
      url: https://deming.org/explore/fourteen-points/
    - title: 'Toyota: jidoka'
      url: https://global.toyota/en/company/vision-and-philosophy/production-system/
- id: U21
  name: Decision records
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: B
  if: you make a significant design decision
  then: record the decision, why you made it, and which alternatives you rejected
  because: without the reason, later teams cannot judge whether the decision still holds
  example: Architecture Decision Record (ADR) in the repository
  check: each significant decision has a record with its reason and the rejected alternatives
  violation: nobody knows why the system is built this way
  related:
    strengthens:
    - U9
    - U10
  evidence: moderate
  evidence_note:
  source_domain: software (ADR), civil and offshore (basis of design)
  notes:
  sources:
  - title: 'adr.github.io: Architectural Decision Records'
    url: https://adr.github.io/
  - title: 'SPE: Design for decommissioning (basis of design)'
    url: https://onepetro.org/spe/general-information/1423/Design-for-decommissioning
  management:
    name: Decision records
    form_name: Decision log
    form: record each significant management decision with its reason, the alternatives considered and the owner
    example: 'a decision log entry: "move to a shared on-call rotation; rejected: per-team rotation, because…"'
    sources_text: '[COSO: ERM — Integrating with Strategy and Performance, Executive Summary (2017)](https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf); [ISO 30401:2018 Knowledge management systems (catalogue page)](https://www.iso.org/standard/68683.html) (supports)'
    evidence: moderate
    evidence_note:
    sources:
    - title: COSO ERM principle 8 "Evaluates Alternative Strategies"
      url: https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf
    - title: ISO 30401:2018
      url: https://www.iso.org/standard/68683.html
- id: U22
  name: Trustworthy evidence
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: B
  if: a record is used as evidence (test result, approval, measurement)
  then: make it attributable, legible, recorded at the time, original and accurate; changes must keep the original entry visible and record who, when and why
  because: evidence that can be changed silently proves nothing
  example: signed commits, immutable audit logs, CI results stored with the commit SHA
  check: a sample of records shows author, time and full change history
  violation: editing a test report after the fact without a trace
  related:
    strengthens:
    - U9
    - R3
  evidence: strong
  evidence_note: required in regulated domains
  source_domain: pharma and clinical trials (ALCOA)
  notes:
  sources:
  - title: 'FDA: Electronic Source Data guidance (ALCOA)'
    url: https://www.fda.gov/media/85183/download
  - title: § 239 HGB (text copy, dejure.org)
    url: https://dejure.org/gesetze/HGB/239.html
  management:
    name: Trustworthy evidence
    form_name: Proper bookkeeping and records
    form: keep business records so that no change hides the original entry, and so that the organization can demonstrate compliance
    example: budget changes are new entries with author and date, not overwrites
    evidence: strong
    evidence_note: German law for bookkeeping
    sources:
    - title: § 239(3) HGB
      url: https://dejure.org/gesetze/HGB/239.html
    - title: GDPR Art. 5(2)
      url: https://gdpr-info.eu/art-5-gdpr/
    - title: ISO 15489-1:2016
      url: https://www.iso.org/standard/62542.html
- id: U23
  name: Preserve evidence
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: I
  if: a failure has happened
  then: document and preserve the as-found state before you repair or restart anything, and record who handled the evidence (chain of custody)
  because: a repair destroys the evidence needed to find the cause
  example: capture logs, heap dump and disk snapshot before restarting a pod or rolling back
  check: each incident record lists the evidence captured before the first repair action
  violation: restarting the service first and finding no logs afterwards
  related:
    depends_on:
    - U22
    strengthens:
    - U10
    conflicts_with:
    - U35
  evidence: strong
  evidence_note: required in regulated failure investigation (PHMSA protocol)
  source_domain: forensic engineering
  notes:
  sources:
  - title: 'PHMSA: Metallurgical Laboratory Failure Examination Protocol'
    url: https://www.phmsa.dot.gov/sites/phmsa.dot.gov/files/docs/incident-reporting/accident-investigation-division/70066/metallurgical-laboratory-failure-examination-protocol.pdf
  - title: 'Wikipedia: Forensic engineering'
    url: https://en.wikipedia.org/wiki/Forensic_engineering
  management:
    name: Preserve evidence
    form_name: Legal hold
    form: when litigation or an investigation is reasonably anticipated, stop routine deletion and preserve the relevant records
    example: after a complaint about a dismissal, the related emails and chat channels are preserved
    evidence: strong
    evidence_note: US litigation duty
    sources:
    - title: Sedona Commentary on Legal Holds, Guideline 1 (via Troutman Pepper)
      url: https://www.troutman.com/insights/sedona-provides-updated-practical-guidance-for-legal-holds.html
- id: U24
  name: Design for testability
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: build ways to set and observe the internal state of each part into the design, so that it can be tested
  because: a state you cannot set or observe cannot be tested
  example: health and readiness endpoints, dry-run modes, feature flags for testing, debug endpoints
  check: each component has documented test access to set and observe its key states
  violation: a component that can only be tested in production
  related:
    strengthens:
    - U4
    - U13
    - U17
  evidence: moderate
  evidence_note:
  source_domain: computer engineering (design for testing)
  notes:
  sources:
  - title: 'IEEE 1149.1: Test Access Port and Boundary-Scan Architecture'
    url: https://standards.ieee.org/ieee/1149.1/4484/
  - title: 'Wikipedia: Design for testing'
    url: https://en.wikipedia.org/wiki/Design_for_testing
  management:
    name: Design for testability
    form_name: Auditable processes
    form: design each process so that its controls leave evidence that a reviewer can sample
    example: access approvals are stored as tickets that an auditor can sample
    sources_text: '[IIA: The Three Lines Model (2020)](https://www.theiia.org/globalassets/documents/resources/the-iias-three-lines-model-an-update-of-the-three-lines-of-defense-july-2020/three-lines-model-updated-english.pdf) (supports)'
    evidence: moderate
    evidence_note:
    sources:
    - title: IIA Three Lines principle 4
      url: https://www.theiia.org/globalassets/documents/resources/the-iias-three-lines-model-an-update-of-the-three-lines-of-defense-july-2020/three-lines-model-updated-english.pdf
- id: U25
  name: Margin
  class: universal
  class_note: every system has uncertain loads and inputs ("all models are wrong"); the size of the margin scales with the master rule
  strength: SHOULD
  category: E
  if: always
  then: 'design capacity above the expected load (margin), state the design load as a probability per time period, keep queued resources well below 100 % utilization, and set the margin by design maturity: larger early, smaller as uncertainty falls'
  because: real load exceeds estimated load, and delay rises sharply as utilization approaches 100 %
  example: capacity for the 1-in-100-day traffic peak plus 30 % headroom; worker pools sized for \< 70 % average utilization
  check: a load test shows capacity ≥ the stated design load × the chosen factor, and queue delay stays within the target at that load
  violation: sizing exactly to the average load
  related:
    conflicts_with:
    - U7
    checked_by:
    - U13
  evidence: strong
  evidence_note: the phase values of GSFC-STD-1000 come from a garbled table extraction; check the original before quoting them
  source_domain: mechanical, civil, coastal (factor of safety, return period), operations research (queueing), space systems (margins by phase), electronics (derating)
  notes:
  sources:
  - title: 'Univ. of Portland: Fail-safe designs and factor of safety'
    url: https://faculty.up.edu/lulay/MEStudentPage/failsafe.pdf
  - title: 'Wikipedia: Return period'
    url: https://en.wikipedia.org/wiki/Return_period
  - title: 'Linda Green: Queueing theory and modeling'
    url: https://business.columbia.edu/sites/default/files-efs/pubfiles/5474/queueing%20theory%20and%20modeling.pdf
  - title: NASA GSFC-STD-1000 Rev H (resource margins)
    url: https://standards.nasa.gov/sites/default/files/standards/GSFC/H/0/GSFC-STD-1000RevH_Approved.pdf
  - title: 'Wikipedia: Derating'
    url: https://en.wikipedia.org/wiki/Derating
  - title: 'Wikipedia: All models are wrong (Box & Draper 1987)'
    url: https://en.wikipedia.org/wiki/All_models_are_wrong
  - title: "Little: Little's Law as Viewed on Its 50th Anniversary (Operations Research 2011, reprint)"
    url: https://projectproduction.org/journal/reprint-littles-law-as-viewed-on-its-50th-anniversary/
  management:
    name: Margin
    form_name: Reserves and slack
    form: keep schedule buffers, budget contingency and free capacity of people; do not plan people near 100 % utilization
    example: the team plans 70 % of its capacity and keeps 30 % for unplanned work
    sources_text: "[Little: Little's Law as Viewed on Its 50th Anniversary (Operations Research 2011, reprint)](https://projectproduction.org/journal/reprint-littles-law-as-viewed-on-its-50th-anniversary/) (with U53)"
    evidence: strong
    evidence_note:
    sources:
    - title: Little's law
      url: https://projectproduction.org/journal/reprint-littles-law-as-viewed-on-its-50th-anniversary/
- id: U26
  name: Fail-safe
  class: universal
  class_note: every part can fail ("everything fails all the time")
  strength: MUST
  category: D
  if: always
  then: 'define a safe state, and design failure to move there (fail-safe; opposite: fail-dangerous)'
  because: an uncontrolled failure causes the most harm
  example: 'admission webhook rejects requests when it errors (fail-closed; opposite: fail-open)'
  check: failure injection shows that the system reaches the defined safe state
  violation: undefined behavior when a dependency is lost
  related:
    depends_on:
    - U6
  evidence: strong
  evidence_note:
  source_domain: nuclear, elevators, aviation
  notes:
  sources:
  - title: 'FAA AC 25.1309-1A: System Design and Analysis (fail-safe design concept)'
    url: https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_25.1309-1A.pdf
  - title: 'PatSnap: Fail-safe design'
    url: https://eureka.patsnap.com/article/what-is-a-fail-safe-design-principles-and-best-practices
  - title: 'The Next Web: Werner Vogels, "Everything fails all the time"'
    url: https://thenextweb.com/news/werner-vogels-everything-fails-all-the-time
  management:
    name: Fail-safe
    form_name: Default decisions and fallback authority
    form: 'define in advance what happens when a decision-maker is absent or a plan fails: deputy, default option, transfer of command'
    example: if the change approver is absent, the default is "no change", not "change without approval"
    evidence: moderate
    evidence_note:
    sources:
    - title: 'NIMS: "Establishment and Transfer of Command"'
      url: https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf
- id: U27
  name: Hierarchy of controls
  class: universal
  class_note: every system has risks; the trigger occurs in every life cycle
  strength: SHOULD
  category: D
  if: a risk is found
  then: 'use the highest possible control level: 1 eliminate; 2 minimize, substitute or moderate; 3 engineering control; 4 administrative control; 5 protective equipment; and act first at the source, then along the path, then at the receiver'
  because: higher control levels do not depend on human behavior, and a cause removed at the source cannot spread
  example: '1 remove the port → 2 store less data / safer library / lower rate limit → 3 policy engine → 4 runbook → 5 "be careful"; noisy neighbor: limit the source → separate node pool → client timeouts'
  check: for each risk, a record states why a higher control level, or a control closer to the source, was not possible
  violation: a warning in the README as the only control
  related:
    depends_on:
    - U14
    strengthens:
    - U28
  evidence: strong
  evidence_note:
  source_domain: occupational and chemical process safety (NIOSH, Kletz), acoustic engineering (source-path-receiver)
  notes:
  sources:
  - title: 'CDC/NIOSH: Hierarchy of controls'
    url: https://www.cdc.gov/niosh/hierarchy-of-controls/about/index.html
  - title: 'Wikipedia: Inherent safety'
    url: https://en.wikipedia.org/wiki/Inherent_safety
  - title: 'OSHA Technical Manual: Noise'
    url: https://www.osha.gov/otm/section-3-health-hazards/chapter-5
  management:
    name: Hierarchy of controls
    form_name: Hierarchy of controls for management risks
    form: eliminate the risky activity, then substitute, then use system-enforced controls, then policies and training, and personal care last
    example: instead of a policy "do not share credentials", remove shared accounts
    evidence: strong
    evidence_note: required in ISO 45001
    sources:
    - title: ISO 45001 clause 8.1.2 (secondary text)
      url: https://cdn.presencis.com/regulations/iso-45001/article-8.1.2/
- id: U28
  name: Error-proofing
  class: universal
  class_note: every system is built, operated or maintained by people
  strength: SHOULD
  category: D
  if: a person can make the same error repeatedly
  then: make the error impossible; if that is not possible, make the error visible immediately; if that is not possible either, limit its consequence so that it is survivable
  because: errors are certain, defects are not
  example: branch protection and required CI checks (impossible); a dry-run diff (visible); soft delete with a restore window (survivable)
  check: each repeated error from postmortems has a technical guard at the highest possible level
  violation: a "please remember to..." announcement as the only fix
  related:
    depends_on:
    - U10
    strengthened_by:
    - U27
  evidence: moderate
  evidence_note:
  source_domain: manufacturing (poka-yoke), transportation (Safe System)
  notes:
  sources:
  - title: 'UserSolutions: Poka-yoke'
    url: https://usersolutions.com/blog/poka-yoke-error-proofing
  - title: 'FHWA: Zero deaths and the Safe System approach'
    url: https://highways.dot.gov/safety/zero-deaths
  management:
    name: Error-proofing
    form_name: Build quality into the process
    form: make the error impossible in the process (system checks, mandatory fields) instead of relying on later inspection
    example: the purchase system refuses an order without a contract number
    evidence: moderate
    evidence_note:
    sources:
    - title: Deming point 3
      url: https://deming.org/explore/fourteen-points/
- id: U29
  name: Defense in depth
  class: universal
  class_note: every single control fails at some point; the number of layers scales with the master rule
  strength: SHOULD
  category: D
  if: always
  then: use several independent and verified control layers (defense in depth)
  because: every single control fails at some point
  example: RBAC + network policy + admission policy + runtime isolation
  check: each critical asset has at least two independent control layers, and each layer is verified
  violation: relying only on the perimeter firewall
  related:
    depends_on:
    - U12
    conflicts_with:
    - U7
  evidence: moderate
  evidence_note:
  source_domain: security, oil and gas (well barriers), drinking water (multi-barrier)
  notes:
  sources:
  - title: 'ScienceDirect: Least privilege and defense in depth'
    url: https://www.sciencedirect.com/topics/computer-science/principle-of-least-privilege
  - title: 'Palo Alto Networks: Defense in depth'
    url: https://www.paloaltonetworks.com/cyberpedia/what-is-defense-in-depth
  - title: 'JPT: Robust well barrier and well integrity management'
    url: https://jpt.spe.org/robust-well-barrier-and-well-integrity-management
  - title: 'Wikipedia: Multi-barrier approach'
    url: https://en.wikipedia.org/wiki/Multi-barrier_approach
  management:
    name: Defense in depth
    form_name: Three lines
    form: 'use independent lines: first line (management owns risk), second line (risk, compliance, security functions), third line (independent internal audit)'
    example: the platform team owns access risk, security monitors it, internal audit tests both
    evidence: strong
    evidence_note:
    sources:
    - title: IIA Three Lines Model (2020)
      url: https://www.theiia.org/globalassets/documents/resources/the-iias-three-lines-model-an-update-of-the-three-lines-of-defense-july-2020/three-lines-model-updated-english.pdf
- id: U30
  name: Robustness
  class: universal
  class_note: every system meets variation in its inputs
  strength: SHOULD
  category: C
  if: always
  then: design so that the result changes little when inputs vary (robustness)
  because: removing every cause of variation costs more than tolerating it
  example: retries with jitter, idempotent operations, tolerance for clock drift
  check: tests with varied inputs (latency, clock drift, message order) show stable results
  violation: a system that works only when timing is exact
  related:
    depends_on:
    - U6
    strengthens:
    - U25
    conflicts_with:
    - C5
  evidence: moderate
  evidence_note:
  source_domain: manufacturing quality (Taguchi), agricultural engineering
  notes:
  sources:
  - title: "Penn State: Taguchi's Robust Design Method"
    url: https://www.me.psu.edu/simpson/courses/ie466/ie466.robust.handout.pdf
  - title: 'PMC: Engineering approach for sustainable biological systems'
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2610168/
  management:
    name: Robustness
    form_name: Robust plans
    form: make plans that still work when assumptions vary within a credible range
    example: the roadmap still delivers its top objective if one engineer leaves
    sources_text: cross-reference only
    evidence: moderate
    evidence_note:
    sources: []
- id: U31
  name: Model validity
  class: universal
  class_note: every design decision rests on a model or an estimate
  strength: SHOULD
  category: B
  if: a decision depends on a model, simulation or estimate
  then: validate the model for its intended use, use it only inside the range it was validated for (domain of applicability), and check each result against an independent rough estimate (order of magnitude)
  because: a model is only trustworthy inside its validated range
  example: a load test on 3 nodes does not prove behavior on 50 nodes
  check: each model used for a decision states its validated range, and the decision lies inside that range
  violation: extrapolating a benchmark far beyond the tested load
  related:
    depends_on:
    - U4
    strengthens:
    - U25
  evidence: moderate
  evidence_note:
  source_domain: simulation and computational engineering, engineering physics (Fermi estimates)
  notes:
  sources:
  - title: 'OSTI: A Perspective on Model Validation and Validated Models (keynote)'
    url: https://www.osti.gov/servlets/purl/1109271
  - title: 'Wikipedia: V&V of computer simulation models'
    url: https://en.wikipedia.org/wiki/Verification_and_validation_of_computer_simulation_models
  - title: 'Wikipedia: Fermi problem'
    url: https://en.wikipedia.org/wiki/Fermi_problem
  - title: 'Wikipedia: All models are wrong (Box & Draper 1987)'
    url: https://en.wikipedia.org/wiki/All_models_are_wrong
  - title: 'Flyvbjerg: From Nobel Prize to Project Management (2006)'
    url: https://arxiv.org/pdf/1302.3642
  management:
    name: Model validity
    form_name: Forecast validity (outside view)
    form: check each estimate or business case against the real outcomes of a reference class of similar past projects, not only against the own plan
    example: the migration estimate is compared with the last five migrations, which overran by 40 % on average
    evidence: strong
    evidence_note: peer-reviewed
    sources:
    - title: Flyvbjerg 2006
      url: https://arxiv.org/pdf/1302.3642
- id: U32
  name: Checklists
  class: universal
  class_note: every system has rare or critical procedures (restore, upgrade, decommissioning)
  strength: SHOULD
  category: H
  if: a critical procedure is rare, complex or done under time pressure
  then: use a short checklist, and confirm each item by pointing at it and saying its status aloud
  because: memory fails under stress
  example: cluster upgrade checklist, incident commander checklist; read out cluster context and namespace before each destructive command
  check: each critical procedure has a checklist that is used and is updated after postmortems
  violation: an upgrade done from memory
  related:
    strengthens:
    - U15
  evidence: moderate
  evidence_note: 'mixed results: large effect in 8 pilot hospitals, no significant effect in 101 Ontario hospitals'
  source_domain: surgery, railway (pointing and calling)
  notes:
  sources:
  - title: 'ScienceDaily: WHO surgical checklist study (2009)'
    url: https://www.sciencedaily.com/releases/2009/01/090114172304.htm
  - title: 'ICES: Ontario checklist study (2014)'
    url: https://www.ices.on.ca/news-releases/study-shows-introduction-of-surgical-safety-checklists-in-ontario-have-not-reduced-post-operative-mortality-or-complications/
  - title: 'Wikipedia: Pointing and calling'
    url: https://en.wikipedia.org/wiki/Pointing_and_calling
  management:
    name: Checklists
    form_name: Checklists for rare management procedures
    form: 'use checklists for rare, complex or time-critical procedures: onboarding, offboarding, month-end close, the first hour of a crisis'
    example: 'offboarding checklist: access removal, knowledge handover, equipment return'
    sources_text: 'section 9 (surgery, rail); [FEMA: National Incident Management System, 3rd ed. (2017)](https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf)'
    evidence: moderate
    evidence_note:
    sources:
    - title: 'NIMS: incident action plans'
      url: https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf
- id: U33
  name: Critical control points
  class: universal
  class_note: every system is built or operated through repeated processes
  strength: SHOULD
  category: H
  if: a repeated process has a few steps where control is essential
  then: define those critical control points, rank them by consequence rather than by how often incidents happen, and give each one a limit, monitoring, a predefined corrective action, a record and regular verification in practice
  because: tight control at the essential steps works better than loose control at every step
  example: image-signature admission gate; SLO limit on the payment path with automatic rollback
  check: each critical control point has a limit, monitoring, a corrective action, records and a recent verification that it works
  violation: monitoring everything equally, with no defined limits
  related:
    depends_on:
    - U6
    strengthens:
    - R4
  evidence: strong
  evidence_note:
  source_domain: food safety (HACCP), mining (critical control management)
  notes:
  sources:
  - title: 'FDA: HACCP Principles & Application Guidelines'
    url: https://www.fda.gov/food/hazard-analysis-critical-control-point-haccp/haccp-principles-application-guidelines
  - title: 'Mining Weekly: ICMM critical control management guide'
    url: https://www.miningweekly.com/article/icmm-updates-critical-control-management-guide-to-strengthen-mining-safety-2026-04-29
  management:
    name: Critical control points
    form_name: Key controls
    form: identify the few controls that prevent material loss or misstatement, give each a limit, an owner, monitoring and a test
    example: access recertification for production is a key control, tested every quarter
    sources_text: cross-reference only
    evidence: moderate
    evidence_note:
    sources: []
- id: U34
  name: Compartments
  class: universal
  class_note: every system with more than one part can spread a failure; how strict the compartments are scales with the master rule
  strength: SHOULD
  category: D
  if: always
  then: divide the system into isolated compartments, so that one damaged compartment does not take down the whole system
  because: a failure that cannot spread stays small
  example: separate cloud accounts per environment, namespace quotas, cell-based architecture, bulkhead pattern
  check: a failure test in one compartment leaves all other compartments working
  violation: one shared database for all tenants and all environments
  related:
    strengthens:
    - R1
    - U29
    conflicts_with:
    - U7
  evidence: strong
  evidence_note:
  source_domain: naval architecture (watertight compartments)
  notes:
  sources:
  - title: IMO SOLAS Chapter II-1, subdivision and stability (text via imorules.com)
    url: https://www.imorules.com/solas/02_chapter_II-1.html
  - title: 'Wikipedia: Compartment (ship)'
    url: https://en.wikipedia.org/wiki/Compartment_%28ship%29
  management:
    name: Compartments
    form_name: Ring-fencing
    form: separate units, budgets or legal entities so that a failure in one does not spread to all
    example: a risky new product runs with its own budget and stop criteria
    evidence: moderate
    evidence_note:
    sources:
    - title: 'NIMS: "Modular Organization"'
      url: https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf
- id: U35
  name: Response faster than harm
  class: universal
  class_note: every operated system has harms that develop over time (wear, filling, drift)
  strength: SHOULD
  category: H
  if: harm develops over time after a fault starts
  then: make sure the time to detect + alert + respond + recover is shorter than the time until harm, with a margin
  because: a response that arrives after the harm is no response
  example: an alert fires when the disk will be full in 4 h, and on-call response takes \< 30 min
  check: for each main hazard, the measured detection-plus-response time is shorter than the time until harm
  violation: an alert that fires only when the disk is already full
  related:
    depends_on:
    - U13
  evidence: moderate
  evidence_note:
  source_domain: fire protection (ASET > RSET)
  notes:
  sources:
  - title: 'Cooper: Estimating Safe Available Egress Time from Fires (NBSIR 80-2172, 1981)'
    url: https://nvlpubs.nist.gov/nistpubs/Legacy/IR/nbsir80-2172.pdf
  - title: 'Fire Risk Assessment Network: ASET and RSET'
    url: https://fire-risk-assessment-network.com/blog/aset-rset/
  - title: BCI Good Practice Guidelines 2018 (with ISO 22301:2019 definitions)
    url: https://www.thebci.org/static/cf455e45-b2c2-4a44-b77da7c99fd6df77/BCI-GPG-2018-Edition.pdf
  management:
    name: Response faster than harm
    form_name: Recovery inside the tolerable disruption
    form: set the recovery time objective of each critical activity inside its maximum tolerable period of disruption
    example: payroll must resume within 3 days; the tolerable maximum is 5 days
    evidence: strong
    evidence_note:
    sources:
    - title: ISO 22301 definitions (via BCI GPG)
      url: https://www.thebci.org/static/cf455e45-b2c2-4a44-b77da7c99fd6df77/BCI-GPG-2018-Edition.pdf
- id: U36
  name: Isolation before work
  class: universal
  class_note: every system is maintained by people
  strength: MUST
  category: G
  if: people work on a part of the system
  then: isolate that part from all inputs and energy, and lock the isolation so that nobody can restart it unexpectedly
  because: an unexpected restart during work injures people or destroys the work
  example: cordon and drain the node; pause Argo CD auto-sync before manual maintenance
  check: each maintenance procedure starts with an isolation step and ends with a release step
  violation: auto-sync overwrites a manual fix in the middle of an incident
  related:
    strengthens:
    - U28
  evidence: strong
  evidence_note:
  source_domain: industrial safety (lockout/tagout)
  notes:
  sources:
  - title: 'OSHA: Control of hazardous energy (lockout/tagout)'
    url: https://www.osha.gov/control-hazardous-energy
  management:
    name: Isolation before work
    form_name: Protected iteration
    form: while a team works on a committed goal, protect it from unplanned changes; only the accountable owner may cancel the goal
    example: new requests wait for the next sprint unless the Product Owner cancels the sprint
    evidence: moderate
    evidence_note:
    sources:
    - title: Scrum Guide 2020
      url: https://scrumguides.org/scrum-guide.html
- id: U37
  name: Maintenance by failure pattern
  class: universal
  class_note: every system needs maintenance (see U14)
  strength: SHOULD
  category: H
  if: you plan maintenance
  then: 'choose the maintenance method by how each part actually fails: replace on a schedule only what wears out with age, and monitor the condition of everything else'
  because: most failures are not linked to age, so scheduled replacement does not prevent them
  example: rotate certificates on a schedule (age-related); alert on disk usage (condition-based); no "just in case" pod restarts
  check: each maintenance task states which failure pattern it addresses
  violation: scheduled restarts that hide a memory leak
  related:
    depends_on:
    - U6
    - U13
  evidence: moderate
  evidence_note:
  source_domain: aviation maintenance (RCM)
  notes:
  sources:
  - title: 'Nowlan & Heap: Reliability-Centered Maintenance (1978)'
    url: https://www.omdec.com/wikifiles/nowlanHeap.pdf
  - title: 'Wikipedia: Reliability-centered maintenance'
    url: https://en.wikipedia.org/wiki/Reliability-centered_maintenance
  management:
    name: Maintenance by failure pattern
    form_name: Review frequency by risk
    form: set the frequency of audits, reviews and recertifications by how each control actually fails, not one fixed cycle for everything
    example: high-risk access every quarter, low-risk tools once a year
    sources_text: cross-reference only
    evidence: moderate
    evidence_note:
    sources: []
- id: U38
  name: Accumulated degradation
  class: universal
  class_note: every system that is used more than once degrades over time
  strength: SHOULD
  category: C
  if: always
  then: design for the damage that builds up over the whole design life, not only for the single largest load
  because: repeated loads far below the maximum load cause failure, and the damage does not recover
  example: soak tests over days, not only peak tests; disk wear; leaks that grow with uptime
  check: an endurance (soak) test runs for a period that represents real use, and the growth of leaks, wear or fragmentation is measured
  violation: only a short peak test, then failure after weeks of normal load
  related:
    depends_on:
    - U6
    strengthens:
    - U37
  evidence: moderate
  evidence_note:
  source_domain: materials, mechanical, piping (fatigue, corrosion allowance)
  notes:
  sources:
  - title: 'FAA AC 25.1309-1A: System Design and Analysis (fail-safe design concept)'
    url: https://www.faa.gov/documentLibrary/media/Advisory_Circular/AC_25.1309-1A.pdf
  - title: 'Wikipedia: Fatigue (material)'
    url: https://en.wikipedia.org/wiki/Fatigue_%28material%29
  - title: 'Wermac: Corrosion allowance'
    url: https://www.wermac.org/materials/corrosion_allowance.html
  - title: 'WHO/ILO: Long working hours increasing deaths (2021)'
    url: https://www.who.int/news/item/17-05-2021-long-working-hours-increasing-deaths-from-heart-disease-and-stroke-who-ilo
  - title: 'Pencavel: The Productivity of Working Hours (IZA DP 8129, 2014)'
    url: https://docs.iza.org/dp8129.pdf
  management:
    name: Accumulated degradation
    form_name: Sustainable pace
    form: limit sustained overtime and track debt that builds up slowly (overtime, deferred maintenance, technical debt)
    example: on-call load and overtime are reviewed monthly; no one works above 48 h per week as a pattern
    evidence: strong
    evidence_note:
    sources:
    - title: WHO/ILO 2021
      url: https://www.who.int/news/item/17-05-2021-long-working-hours-increasing-deaths-from-heart-disease-and-stroke-who-ilo
    - title: Pencavel 2014
      url: https://docs.iza.org/dp8129.pdf
    - title: Agile principle 8
      url: https://agilemanifesto.org/principles
- id: U39
  name: Critical path
  class: universal
  class_note: every project has tasks that depend on each other
  strength: SHOULD
  category: G
  if: work consists of tasks that depend on each other
  then: identify the longest chain of dependent tasks (critical path) and protect it first
  because: a delay on the critical path delays everything; other tasks have slack
  example: in a cluster migration, data sync and DNS cutover are critical; documentation has slack
  check: each multi-step project plan marks its critical path and the slack of the other tasks
  violation: speeding up tasks that have slack while the critical path slips
  related:
    strengthens:
    - U19
  evidence: moderate
  evidence_note:
  source_domain: construction management (critical path method)
  notes:
  sources:
  - title: 'Kelley: The Origins of CPM, a Personal History (PMI)'
    url: https://www.pmi.org/learning/library/origins-cpm-personal-history-3762
  - title: 'Wikipedia: Critical path method'
    url: https://en.wikipedia.org/wiki/Critical_path_method
  management:
    name: Critical path
    form_name: Critical path
    form: identify the longest chain of dependent tasks and protect it first
    example: in an office move, network installation is critical; furniture has slack
    sources_text: section 9 (critical path method); [ISO 21502:2020 Guidance on project management (catalogue page)](https://www.iso.org/standard/74947.html)
    evidence: strong
    evidence_note:
    sources:
    - title: ISO 21502:2020
      url: https://www.iso.org/standard/74947.html
- id: U40
  name: Comparable measurement
  class: universal
  class_note: every engineering decision uses measurements
  strength: SHOULD
  category: F
  if: measurements are used to compare or decide
  then: measure under stated, controlled reference conditions, report the uncertainty with every result, and calibrate instruments regularly against traceable references
  because: uncontrolled conditions change results, and a result without its uncertainty is incomplete
  example: benchmarks on the same instance type with fixed load and warm-up; report the spread over several runs
  check: each benchmark or test report states its reference conditions and the spread or uncertainty of the result
  violation: comparing two single benchmark runs from different machines
  related:
    strengthens:
    - U31
    - U17
  evidence: strong
  evidence_note: standardized in ISO 139 and the GUM
  source_domain: textile testing (ISO 139), metrology (GUM, traceability)
  notes:
  sources:
  - title: ISO 139:2005 Textiles - standard atmospheres (sample)
    url: https://cdn.standards.iteh.ai/samples/35179/19d75d1dcdd147d4b630728954acc86d/ISO-139-2005.pdf
  - title: 'Chiuvention: Why fabric test results vary with weather'
    url: https://chiuvention.com/blog/why-fabric-test-results-vary-with-weather-solved-by-a-temperature-and-humidity-chamber
  - title: 'Wikipedia: Measurement uncertainty'
    url: https://en.wikipedia.org/wiki/Measurement_uncertainty
  - title: 'Wikipedia: Metrological traceability'
    url: https://en.wikipedia.org/wiki/Metrological_traceability
  management:
    name: Comparable measurement
    form_name: Comparable indicators
    form: define each indicator once (formula, period, population, data source), and show its normal variation before comparing teams or periods
    example: lead time is measured the same way for all teams before teams are compared
    evidence: moderate
    evidence_note:
    sources:
    - title: 'ISO/TS 30433: "comparable measures" (via ISO TC 260)'
      url: https://committee.iso.org/news/ref2689.html
- id: U41
  name: Actionable alerts
  class: universal
  class_note: every operated system is monitored (U13), and monitoring raises alerts
  strength: SHOULD
  category: H
  if: a system raises alerts to people
  then: make every alert actionable, and remove or change alerts that nobody acts on
  because: many non-actionable alerts make people ignore all alerts, including the important ones (alert fatigue)
  example: page only on symptoms that need action now; review alert noise every month
  check: each alert has an owner and a runbook action, and the share of alerts with no action is measured and kept low
  violation: an alert channel with hundreds of messages per day that nobody reads
  related:
    strengthens:
    - U13
    - U18
    - U35
  evidence: strong
  evidence_note: 'The Joint Commission: "between 85 and 99 percent of alarm signals do not require clinical intervention"'
  source_domain: clinical engineering, rail dispatch (alarm fatigue)
  notes:
  sources:
  - title: 'The Joint Commission: Sentinel Event Alert 50, Medical device alarm safety (2013)'
    url: https://www.kff.org/wp-content/uploads/sites/2/2013/04/sea_50_alarms_4_5_13_final1.pdf
  - title: 'Wikipedia: Alarm fatigue'
    url: https://en.wikipedia.org/wiki/Alarm_fatigue
  management:
    name: Actionable alerts
    form_name: Management by exception
    form: report to the next management level only when a tolerance is forecast to be breached; remove reports that lead to no action
    example: weekly status shows only items outside tolerance
    evidence: moderate
    evidence_note:
    sources:
    - title: PRINCE2 principle 5
      url: https://purplegriffon.com/blog/prince2-7th-edition-principles
- id: U42
  name: Sterile critical phase
  class: universal
  class_note: every project has critical phases (cutover, commissioning, launch)
  strength: SHOULD
  category: H
  if: work is in a critical phase (cutover, deployment, incident)
  then: allow only the activity and communication that the critical phase needs
  because: distraction during critical phases causes errors
  example: incident channel limited to the response; no unrelated changes during a cutover window
  check: critical phases are defined, and their communication rules are written down and used
  violation: side discussions and parallel deployments during an incident
  related:
    strengthens:
    - U32
    - U15
  evidence: strong
  evidence_note: FAA regulation since 1981
  source_domain: aviation (sterile flight deck)
  notes:
  sources:
  - title: 'eCFR: 14 CFR 121.542, Flight crewmember duties'
    url: https://www.ecfr.gov/current/title-14/chapter-I/subchapter-G/part-121/subpart-T/section-121.542
  - title: 'Wikipedia: Sterile flight deck rule'
    url: https://en.wikipedia.org/wiki/Sterile_flight_deck_rule
  management:
    name: Sterile critical phase
    form_name: Focus time and crisis discipline
    form: protect blocks of uninterrupted work; during a crisis, limit communication to the response
    example: no meetings on Tuesday and Thursday mornings; one crisis channel with one commander
    evidence: moderate
    evidence_note:
    sources:
    - title: Mark et al. 2008
      url: https://www.interruptions.net/literature/Mark-CHI08.pdf
    - title: 'NIMS: "Integrated Communications"'
      url: https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf
- id: U43
  name: Automated reproducible results
  class: universal
  class_note: every engineering result must be checkable by someone else (U8)
  strength: SHOULD
  category: B
  if: a result must be reproducible
  then: produce it only through automated, recorded steps, with versions of data, code and tools
  because: manual steps are error-prone and cannot be reproduced
  example: infrastructure changed only through pipelines; no manual kubectl edits; pinned tool versions
  check: each result can be regenerated from recorded inputs and versions with one command
  violation: a report built by copying numbers by hand
  related:
    depends_on:
    - U9
    strengthens:
    - U22
  evidence: moderate
  evidence_note:
  source_domain: bioinformatics (reproducible computational research)
  notes:
  sources:
  - title: 'Sandve et al.: Ten Simple Rules for Reproducible Computational Research'
    url: https://journals.plos.org/ploscompbiol/article?id=10.1371/journal.pcbi.1003285
  management:
    name: Automated reproducible results
    form_name: Reproducible reporting
    form: produce management figures (KPIs, budgets, forecasts) through automated, documented steps from named data sources
    example: the DORA dashboard is generated from pipeline data, not from a hand-edited spreadsheet
    evidence: moderate
    evidence_note:
    sources:
    - title: COSO ERM principle 18 "Leverages Information Systems"
      url: https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf
- id: U44
  name: Compatibility
  class: universal
  class_note: every system with parts of different kinds has interactions between them
  strength: SHOULD
  category: C
  if: parts of different kinds touch or interact
  then: verify that they are compatible with each other in the real environment, and separate them where they are not
  because: incompatible parts damage each other, even when each part is good on its own
  example: tested compatibility matrix for Kubernetes, CNI and CSI versions; separate node pools for incompatible kernel modules
  check: each interacting pair of components is on a tested compatibility list
  violation: upgrading one component and breaking another that was never tested with it
  related:
    strengthens:
    - C5
    - U6
  evidence: moderate
  evidence_note:
  source_domain: materials (galvanic corrosion), biomaterials (biocompatibility)
  notes:
  sources:
  - title: 'MIL-STD-889D: Dissimilar metals, galvanic compatibility (2021)'
    url: https://corrdesa.com/wp-content/uploads/2024/04/MIL-STD-889D-2021-Release.pdf
  - title: 'ISO 10993-1: Biological evaluation of medical devices'
    url: https://www.iso.org/standard/44908.html
  - title: 'Wikipedia: Galvanic corrosion'
    url: https://en.wikipedia.org/wiki/Galvanic_corrosion
  - title: 'Wikipedia: Biocompatibility'
    url: https://en.wikipedia.org/wiki/Biocompatibility
  management:
    name: Compatibility
    form_name: Compatibility of teams, processes and cultures
    form: before merging teams, organizations or processes, check that they are compatible, and plan the integration of the differences
    example: before two platform teams merge, their on-call rules and release processes are compared
    sources_text: cross-reference only
    evidence: moderate
    evidence_note:
    sources: []
- id: U45
  name: Provenance
  class: universal
  class_note: almost every system uses parts or software from suppliers
  strength: SHOULD
  category: B
  if: parts or materials come from suppliers
  then: trace each part to its origin, batch and certificate (provenance)
  because: without provenance you cannot prove quality, or find all affected parts when a defect is found
  example: signed images with build provenance and SBOM; deployment by pinned digest
  check: for each deployed artifact, origin, build and certificate can be shown
  violation: running an unsigned image from an unknown registry
  related:
    strengthens:
    - U22
    - C12
  evidence: moderate
  evidence_note:
  source_domain: metallurgical engineering (mill test certificates)
  notes:
  sources:
  - title: 'SLSA v1.0: Provenance'
    url: https://slsa.dev/spec/v1.0/provenance
  - title: 'Wikipedia: Mill test report'
    url: https://en.wikipedia.org/wiki/Mill_test_report
  management:
    name: Provenance
    form_name: Supplier due diligence
    form: know each supplier and the risks in its own supply chain, and act on what you find
    example: a SaaS vendor's sub-processors and their data locations are known before signing
    evidence: strong
    evidence_note: OECD guidance; national supply-chain laws exist
    sources:
    - title: OECD Due Diligence Guidance (2018)
      url: https://www.oecd.org/en/publications/oecd-due-diligence-guidance-for-responsible-business-conduct_15f5f4b3-en.html
- id: U46
  name: Exact constraint
  class: universal
  class_note: over-constraint can occur in any system with more than one control mechanism
  strength: SHOULD
  category: C
  if: several mechanisms can set the same property
  then: constrain each property exactly once, with one owner (exact constraint)
  because: over-constraint makes parts fight each other and deform the system
  example: either the HPA or the GitOps manifest owns the replica count, not both; one source of truth per configuration value
  check: each managed field has exactly one owner
  violation: Argo CD and the HPA both set the replica count and keep reverting each other
  related:
    strengthens:
    - U7
    - U9
  evidence: moderate
  evidence_note:
  source_domain: optomechanical and precision engineering (kinematic coupling)
  notes:
  sources:
  - title: 'Slocum: Kinematic couplings, a review of design principles and applications (MIT)'
    url: https://web.mit.edu/2.70/Reading%20Materials/Kinematic%20coupling%20review%20article.pdf
  - title: 'Wikipedia: Kinematic coupling (exact constraint)'
    url: https://en.wikipedia.org/wiki/Kinematic_coupling
  - title: 'FEMA: National Incident Management System, 3rd ed. (2017)'
    url: https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf
  management:
    name: Exact constraint
    form_name: Single point of accountability, unity of command
    form: give each objective, decision, risk and process exactly one accountable owner; each person reports to one person for a given task
    example: one product owner per backlog; one incident commander per incident
    evidence: strong
    evidence_note: US federal doctrine
    sources:
    - title: 'NIMS: "Unity of command means that each individual only reports to one person."'
      url: https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf
    - title: PRINCE2 principle 3
      url: https://purplegriffon.com/blog/prince2-7th-edition-principles
- id: U47
  name: Psychological safety
  class: universal
  class_note: every system is built or operated by people who work together
  strength: SHOULD
  category: A
  if: people work together on a system
  then: 'make it safe to report errors, ask questions and disagree: leaders ask for input, thank people for bad news, and never punish an honest report'
  because: psychological safety enables learning behavior, which drives team performance; problems that people hide cannot be fixed
  example: the first person to report a broken pipeline is thanked, not blamed; the team lead names their own mistake in the retrospective
  check: a regular anonymous survey item on safety to speak up; the number of reported near misses does not fall after an incident
  violation: punishing the person who reported a problem
  related:
    strengthens:
    - U10
    - U18
    - U20
  related_text: strengthens U10, U18, U20; conflicts with accountability (see K7)
  evidence: strong
  evidence_note: peer-reviewed field study; Google study of 180 teams
  source_domain: management (team leadership)
  notes:
  sources:
  - title: 'Edmondson: Psychological Safety and Learning Behavior in Work Teams (ASQ 1999, copy)'
    url: https://web.mit.edu/curhan/www/docs/Articles/15341_Readings/Group_Performance/Edmondson%20Psychological%20safety.pdf
  - title: 'Google re:Work: Understand team effectiveness'
    url: https://rework.withgoogle.com/intl/en/guides/understand-team-effectiveness
  management:
- id: U48
  name: Conflict-of-interest disclosure
  class: universal
  class_note: trigger that occurs in the life cycle of every system (every system has suppliers, reviewers and decision-makers)
  strength: MUST
  category: A
  if: a person decides on, reviews or advises on work in which they have a personal interest
  then: disclose the interest and step out of the decision or review
  because: a personal interest biases judgment and destroys trust in the decision
  example: an engineer who holds shares in a monitoring vendor leaves its evaluation
  check: a register of declared interests exists and is checked before each vendor selection, design review and approval
  violation: a reviewer approves a design that uses a product of a company they own
  related:
    strengthens:
    - U8
    - U2
    - R9
  evidence: strong
  evidence_note: NSPE Code of Ethics II.4.a; G20/OECD Principles II.F.2
  source_domain: professional ethics, management (corporate governance)
  notes:
  sources:
  - title: NSPE Ethics Reference Guide
    url: https://www.nspe.org/sites/default/files/resources/pdfs/Ethics/EthicsReferenceGuide.pdf
  - title: G20/OECD Principles of Corporate Governance 2023
    url: https://legalinstruments.oecd.org/public/doc/322/322.en.pdf
  management:
- id: U49
  name: Commander's intent
  class: universal
  class_note: every engineering organization delegates work
  strength: SHOULD
  category: A
  if: you delegate a task
  then: state the purpose, the desired end state and the constraints, and leave the method to the people who do the work (mission orders)
  because: plans meet changing conditions; people who know the purpose can act correctly without new orders
  example: an epic states "why", "done when" and "must not", not a list of kubectl steps
  check: each delegated task or epic states purpose, end state and constraints
  violation: a step list with no purpose; work stops when the plan no longer fits
  related:
    depends_on:
    - U2
    conflicts_with:
    - U32
    - U33
    - C10
  related_text: depends on U2; conflicts with U32, U33, C10 (see K6)
  evidence: strong
  evidence_note: US Army doctrine ADP 6-0
  source_domain: management (military command and control)
  notes:
  sources:
  - title: US Army ADP 6-0 Mission Command (2019)
    url: https://irp.fas.org/doddir/army/adp6_0.pdf
  management:
- id: U50
  name: Decision speed by reversibility
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: B
  if: you make a decision
  then: classify it as reversible (two-way door) or irreversible (one-way door); make reversible decisions quickly at the lowest competent level, and irreversible decisions slowly, with consultation and review
  because: heavy process on reversible decisions causes slowness and too little experimentation; light process on irreversible decisions causes lasting harm
  example: 'a new linter rule: the team decides today; deleting a production database or changing the cloud provider: R6, red team, ADR'
  check: each decision record (U21) states the class (reversible or irreversible) and the matching process
  violation: a three-week approval for a reversible tool trial; a lock-in contract signed in one meeting
  related:
    strengthens:
    - U21
    - R5
    - R6
    conflicts_with:
    - U8
    - U9
  related_text: strengthens U21, R5, R6; conflicts with U8, U9 (see K5)
  evidence: moderate
  evidence_note: "practitioner source: a CEO's shareholder letter; consistent with R5 and R6"
  source_domain: management (decision making)
  notes:
  sources:
  - title: Amazon 2015 letter to shareholders (SEC filing)
    url: https://www.sec.gov/Archives/edgar/data/1018724/000119312516530910/d168744dex991.htm
  management:
- id: U51
  name: Indicators are not targets
  class: universal
  class_note: every system and every team whose performance is measured (U13, U40)
  strength: SHOULD
  category: B
  if: a measure is used to reward, rank or punish people
  then: 'expect it to be gamed: pair it with a counter-measure, compare it with direct observation, and change it when it drifts from the real objective'
  because: the more a quantitative indicator is used for decisions, the more it is corrupted and the more it distorts the process it measures (Campbell's law)
  example: deployment frequency is paired with change failure rate; MTTR is not a bonus target
  check: each rewarded indicator has a counter-indicator and a yearly review of whether it still tracks the objective
  violation: ticket count as the only measure of on-call quality
  related:
    strengthens:
    - U40
    - U18
    - U13
  evidence: strong
  evidence_note: Campbell; the same pattern is known as Goodhart's law
  source_domain: management (performance measurement)
  notes:
  sources:
  - title: 'Campbell: Assessing the Impact of Planned Social Change (reprint, J. MultiDisciplinary Evaluation 2011; original 1976/1979)'
    url: https://jmde.journals.publicknowledgeproject.org/index.php/jmde_1/article/view/297
  - title: "Wikipedia: Campbell's law"
    url: https://en.wikipedia.org/wiki/Campbell%27s_law
  management:
- id: U52
  name: Stop criteria set in advance
  class: universal
  class_note: trigger that occurs in the life cycle of every system (every system starts as a project)
  strength: SHOULD
  category: B
  if: you start a project or prototype with an uncertain outcome
  then: write down, before starting, the evidence and the decision points (gates) at which it stops, and let someone who did not start it make the continue-or-stop decision
  because: people who are responsible for an earlier decision commit the most resources to it after negative results (escalation of commitment)
  example: a service-mesh pilot stops if p99 latency rises by more than 5 ms after 4 weeks; the architecture board, not the sponsor, decides
  check: each project and prototype has written stop criteria and gate dates, and gate decisions are made by someone other than the sponsor
  violation: '"we have invested too much to stop now"'
  related:
    strengthens:
    - R8
    - U19
    - U21
    - C2
  evidence: strong
  evidence_note: experimental research, Staw 1976; PRINCE2 "continued business justification"
  source_domain: management (project management, organizational psychology)
  notes:
  sources:
  - title: 'Staw: Knee-deep in the big muddy (1976, copy)'
    url: https://Www.Gwern.net/doc/psychology/cognitive-bias/sunk-cost/1976-staw.pdf
  - title: 'Purple Griffon: PRINCE2 7th edition principles'
    url: https://purplegriffon.com/blog/prince2-7th-edition-principles
  management:
- id: U53
  name: Limit work in progress
  class: universal
  class_note: every system that is built, changed or operated has a flow of work (changes, tickets, requests)
  strength: SHOULD
  category: E
  if: a team or system handles a flow of work items
  then: set a limit on the number of items in progress, and finish items before starting new ones
  because: at a given throughput, average lead time is proportional to average work in progress (Little's law), so more parallel work means longer waiting for every item
  example: at most 4 epics in progress per team; at most N concurrent rollouts per cluster
  check: a visible WIP limit exists, and lead time and WIP are tracked
  violation: everything is "in progress" and nothing is finished
  related:
    strengthens:
    - U25
    - C8
    depends_on:
    - U13
  evidence: strong
  evidence_note:
  evidence_text: strong for the relation (mathematical theorem); moderate for the practice
  source_domain: management (operations management, queueing theory)
  notes:
  sources:
  - title: "Little: Little's Law as Viewed on Its 50th Anniversary (Operations Research 2011, reprint)"
    url: https://projectproduction.org/journal/reprint-littles-law-as-viewed-on-its-50th-anniversary/
  management:
- id: U54
  name: Fair process
  class: universal
  class_note: every engineering organization makes decisions that affect people
  strength: SHOULD
  category: A
  if: a decision affects people
  then: engage them (ask for input and challenge), explain the final decision and its reasons, and state the new expectations clearly; this is not consensus
  because: people accept and carry out decisions they disagree with when the process was fair
  example: before changing the on-call model, the team is asked, then told the decision, the reasons and the new rules
  check: "for each decision that changes people's work: an input round, a written explanation and stated expectations exist"
  violation: announcing a reorganization without reasons
  related:
    strengthens:
    - U58
    - U9
  evidence: moderate
  evidence_note: management research; practitioner article
  source_domain: management (organizational justice)
  notes:
  sources:
  - title: 'Kim & Mauborgne: Fair Process (HBR 1997, copy)'
    url: https://ieanea.org/wp-content/uploads/2019/05/FairProcessArticle.pdf
  management:
- id: U55
  name: Specific, challenging goals with feedback
  class: universal
  class_note: every engineering organization sets goals
  strength: SHOULD
  category: B
  if: you set goals for people or teams
  then: set few, specific and challenging goals, give regular feedback on progress toward them, and for new or complex tasks set learning goals first
  because: specific, difficult goals lead to higher performance than "do your best", and goals plus feedback work better than goals alone
  example: '"cut median build time from 12 to 6 minutes this quarter", with a weekly chart; for a new technology: "run three spikes and document what we learned"'
  check: each goal has a measure, a deadline and a progress chart; new or complex work has learning goals
  violation: '"do your best" as the only goal; goals without progress feedback'
  related:
    strengthens:
    - U3
    conflicts_with:
    - U51
  related_text: strengthens U3; conflicts with U51 (see K8)
  evidence: strong
  evidence_note:
  evidence_text: strong (experimental and field research summarized in the paper); contested by Deming points 11 and 12, who rejects management by numerical goals
  source_domain: management (goals and motivation (goal-setting theory))
  notes:
  sources:
  - title: 'Locke & Latham: Building a practically useful theory of goal setting (Am. Psychol. 2002, copy)'
    url: https://goal-lab.psych.umn.edu/orgpsych/2020/readings/5.%20Motivation/Locke%20&%20Latham%20(2002).pdf
  - title: 'The W. Edwards Deming Institute: 14 Points'
    url: https://deming.org/explore/fourteen-points/
  management:
- id: U56
  name: Structured selection of people
  class: universal
  class_note: every engineering organization selects people (trigger)
  strength: SHOULD
  category: F
  if: you select a person for a job or a promotion
  then: use structured, job-related interviews (the same questions for each candidate, answers rated on scales anchored to job requirements), and add work samples or job-knowledge tests
  because: structured interviews predict job performance better than any other common method (mean validity .42, compared with .19 for unstructured interviews)
  example: every platform-engineer candidate answers the same 6 questions and does the same debugging exercise; two raters score independently
  check: interview guides with fixed questions and rating scales exist and are used; raters score independently before discussion
  violation: '"culture fit" chat with different questions for each candidate'
  related:
    strengthens:
    - U2
    - C10
    - U8
  evidence: strong
  evidence_note: meta-analysis, Journal of Applied Psychology
  source_domain: management (personnel selection)
  notes:
  sources:
  - title: 'Sackett, Zhang, Berry, Lievens: Revisiting meta-analytic estimates of validity in personnel selection (J. Appl. Psychol., copy)'
    url: https://www.Gwern.net/doc/statistics/meta-analysis/2021-sackett.pdf
  management:
- id: U57
  name: Feedback on the task
  class: universal
  class_note: every engineering organization gives feedback
  strength: SHOULD
  category: F
  if: you give feedback on a person's or a team's performance
  then: focus the feedback on the task and on how to improve it, not on the person's character or ranking, and check afterwards whether performance improved
  because: feedback improves performance on average, but in over one third of cases it decreased performance
  example: '"the runbook missed the rollback step; add it and test it" instead of "you are careless"'
  check: feedback records name a task and an improvement; the effect is checked at the next review
  violation: feedback that compares people or judges character
  related:
    strengthens:
    - U47
    - U55
  evidence: strong
  evidence_note:
  evidence_text: strong for the finding (meta-analysis); the "focus on the task" part rests on the authors' feedback intervention theory and is the author's summary, not a quote
  source_domain: management (performance feedback)
  notes:
  sources:
  - title: 'Kluger & DeNisi: The effects of feedback interventions on performance (Psychol. Bull. 1996)'
    url: https://cris.huji.ac.il/en/publications/the-effects-of-feedback-interventions-on-performance-a-historical/
  management:
- id: U58
  name: Guided change
  class: universal
  class_note: every engineering organization changes how its people work (trigger)
  strength: SHOULD
  category: G
  if: you change how many people work (a reorganization, a new process, a new tool for everyone)
  then: make the need visible, form a group that leads the change, communicate the vision far more often than seems necessary, remove obstacles, plan early visible wins, and continue until the new way is part of daily routine
  because: '"skipping steps creates only the illusion of speed" (Kotter); changes declared finished too early fall back'
  example: 'migration to the new CI system: reasons shared, a pilot team, weekly updates, old system switched off only when all teams use the new one'
  check: each large change has a written reason, a named leading group, a communication plan, defined early wins and an end criterion ("the old way is switched off")
  violation: announcing a change by email and declaring it done
  related:
    depends_on:
    - U54
    - U9
    strengthens:
    - U19
  evidence: moderate
  evidence_note: practitioner model from case experience; the eight steps have limited empirical testing
  source_domain: management (change management)
  notes:
  sources:
  - title: 'Kotter: Leading Change — Why Transformation Efforts Fail (HBR 1995, copy)'
    url: https://fcm.ucsf.edu/sites/g/files/tkssra17611/files/Kotter_WhyTransformationEffortsFail.pdf
  management:
- id: R1
  name: Redundancy (N-1)
  class: risk-scaled
  class_note: only where the function must survive single failures; a system that may stop briefly (a development environment) does not need it
  strength: SHOULD
  category: E
  if: one failure must not stop the function
  then: add redundancy, so that the function survives the loss of any single element (N-1), and make sure each copy and the switch-over mechanism are reliable enough for the redundancy to help
  because: one copy is a single point of failure
  example: nodes in several availability zones
  check: removing any single element in a test keeps the function running
  violation: a single replica of a critical service
  related:
    strengthened_by:
    - R2
    conflicts_with:
    - U7
  evidence: strong
  evidence_note: N-1 ignores how likely an outage is and how large the affected area is; use the master rule for those. Error correction helps only when component error rates are below a threshold (quantum threshold theorem)
  source_domain: aerospace, electronics, power grids, quantum engineering, computing theory (von Neumann)
  notes:
  sources:
  - title: 'ScienceDirect: Fail-safe design'
    url: https://www.sciencedirect.com/topics/materials-science/fail-safe-design
  - title: 'USPTO: Materials-based failure analysis in electronic devices'
    url: https://image-ppubs.uspto.gov/dirsearch-public/print/downloadPdf/8285522
  - title: "SINTEF: N-1 isn't always enough"
    url: https://blog.sintef.com/sintefenergy/energy-systems/electricity-supply-security-n-1-isnt-always-enough/
  - title: "UCSD: Lectures on von Neumann's Probabilistic Logics"
    url: https://cseweb.ucsd.edu/~dasgupta/254-neural-ul/anthony-andrew.pdf
  - title: 'Wikipedia: Quantum error correction'
    url: https://en.wikipedia.org/wiki/Quantum_error_correction
  management:
    name: Redundancy (N-1)
    form_name: Deputies and succession
    form: 'make every critical function survive the loss of one person: named deputy, trained successor, documented knowledge'
    example: each on-call skill is held by at least two people
    evidence: moderate
    evidence_note:
    sources:
    - title: ISO/TS 30433 succession metrics (via ISO TC 260)
      url: https://committee.iso.org/news/ref2689.html
- id: R2
  name: Diversity
  class: risk-scaled
  class_note: only where redundancy is required and a common cause is credible
  strength: SHOULD
  category: E
  if: one cause can hit all copies at once
  then: make the copies different (diversity)
  because: identical copies fail together
  example: two different DNS providers
  check: the shared dependencies of redundant copies are listed, and each one is justified
  violation: all replicas depend on the same expiring certificate
  related:
    depends_on:
    - R1
    conflicts_with:
    - U7
  evidence: moderate
  evidence_note:
  source_domain: automotive (autonomous vehicles)
  notes:
  sources:
  - title: 'arXiv: Safety design in autonomous vehicles'
    url: https://arxiv.org/pdf/2412.08862
  management:
    name: Diversity
    form_name: Diverse suppliers and diverse views
    form: 'avoid a common cause hitting all copies: suppliers in different regions; decision input from people with different views'
    example: two cloud regions from different providers for the status page; a red team from another department
    evidence: moderate
    evidence_note:
    sources:
    - title: UK MoD Red Teaming Handbook
      url: https://assets.publishing.service.gov.uk/government/uploads/system/uploads/attachment_data/file/1027158/20210625-Red_Teaming_Handbook.pdf
- id: R3
  name: Traceability
  class: risk-scaled
  class_note: required by safety standards for safety-critical or regulated systems; costly elsewhere
  strength: MUST
  category: F
  if: the system is safety-critical or regulated
  then: link every requirement in both directions to design and test
  because: standards require proof of complete coverage
  example: requirement ↔ code ↔ test ID in the ticket system
  check: a traceability report shows no requirement without a test and no test without a requirement
  violation: tests that link to no requirement
  related:
    depends_on:
    - U3
  evidence: strong
  evidence_note:
  source_domain: aerospace, automotive, medical (DO-178C, ISO 26262, IEC 62304)
  notes:
  sources:
  - title: 'NASA Software Engineering Handbook: SWE-052 Bidirectional Traceability (NPR 7150.2)'
    url: https://swehb.nasa.gov/spaces/SWEHBVC/pages/50888903/SWE-052+-+Bidirectional+Traceability?showComments=true&showCommentArea=true
  - title: 'Stell: Requirements traceability'
    url: https://stell-engineering.com/blog/what-is-requirement-traceability
  management:
    name: Traceability
    form_name: Obligation-to-control traceability
    form: in regulated areas, link each legal or contractual obligation to a control and to a test of that control
    example: each GDPR obligation in the register points to an owner, a control and an audit test
    evidence: strong
    evidence_note: regulated areas
    sources:
    - title: ISO 37301:2021
      url: https://www.iso.org/standard/75080.html
- id: R4
  name: Observational method
  class: risk-scaled
  class_note: only where key properties stay uncertain until construction or operation
  strength: SHOULD
  category: G
  if: key properties can only be measured during construction or operation
  then: design for the most probable conditions, monitor the real values, and plan trigger levels and backup actions in advance
  because: measuring the real values is more reliable than guessing them in advance
  example: Argo Rollouts analysis that rolls back automatically when the error rate exceeds a trigger level
  check: each monitored value has a trigger level and a planned backup action
  violation: discovering at go-live that there is no rollback plan
  related:
    depends_on:
    - U13
    - U19
  evidence: moderate
  evidence_note:
  source_domain: geotechnical (observational method)
  notes:
  sources:
  - title: 'ICE: The observational method'
    url: https://knowledgehub.ice.org.uk/cpd/delivery-exc/observational-method/
  management:
    name: Observational method
    form_name: Tolerances with pre-planned responses
    form: where outcomes stay uncertain until execution, set tolerances and planned responses in advance, monitor, and escalate when a tolerance will be breached
    example: if the migration exceeds its time tolerance by 10 %, the steering group decides on scope
    evidence: moderate
    evidence_note:
    sources:
    - title: PRINCE2 principle 5 "Manage by exception"
      url: https://purplegriffon.com/blog/prince2-7th-edition-principles
    - title: 'Scrum: inspection and adaptation'
      url: https://scrumguides.org/scrum-guide.html
- id: R5
  name: Precaution
  class: risk-scaled
  class_note: only for serious or irreversible harm with incomplete evidence
  strength: SHOULD
  category: B
  if: a possible harm is serious or irreversible, and the evidence is incomplete
  then: take proportionate, cost-effective protective measures without waiting for full proof
  because: irreversible harm cannot be undone once the proof arrives
  example: take a snapshot and stop writes when data corruption is suspected, before the root cause is proven
  check: for each serious or irreversible risk with incomplete evidence, a record states which protective measure was taken, or why none was
  violation: writes continue while the team waits for proof of data corruption
  related:
    strengthens:
    - U26
    - U18
  evidence: moderate
  evidence_note: 'contested: critics call it vague and say strong versions block beneficial technology; this rule uses the weak, proportionate version'
  source_domain: environmental engineering (precautionary principle)
  notes:
  sources:
  - title: 'UN: Rio Declaration on Environment and Development (1992)'
    url: https://icsid.worldbank.org/sites/default/files/parties_publications/C8394/Respondent%27s%20documents/RL%20-%20Legal%20Authorities/RL-0150-ENG%201992-06-13.pdf
  - title: 'Wikipedia: Precautionary principle'
    url: https://en.wikipedia.org/wiki/Precautionary_principle
  management:
    name: Precaution
    form_name: Precautionary management action
    form: when serious or irreversible harm is credible but unproven, take a proportionate protective step now
    example: payments to a supplier are paused while a fraud warning is checked
    sources_text: cross-reference only
    evidence: moderate
    evidence_note:
    sources: []
- id: R6
  name: Two-person rule
  class: risk-scaled
  class_note: only for critical, irreversible actions; the cost is a second person who must be available
  strength: SHOULD
  category: D
  if: an action is critical and cannot be undone
  then: require two authorized people at the moment of action (two-person rule)
  because: one person can make an error or act with bad intent, and nobody stops it
  example: break-glass production access and deletion of production data need a second approver, live
  check: the system enforces a second approval for each listed critical action
  violation: one administrator can delete the production database alone
  related:
    depends_on:
    - U12
    strengthens:
    - U8
  evidence: strong
  evidence_note: NIST SP 800-53 control AC-3(2) "Dual Authorization"
  source_domain: nuclear, banking, aviation (two-person rule)
  notes:
  sources:
  - title: NIST SP 800-53 Rev. 5, AC-3(2) Dual Authorization (text via CSF Tools)
    url: https://csf.tools/reference/nist-sp-800-53/r5/ac/ac-3/ac-3-2/
  - title: 'Wikipedia: Two-man rule'
    url: https://en.wikipedia.org/wiki/Two-man_rule
  management:
    name: Two-person rule
    form_name: Four-eyes principle at the moment of action
    form: require two authorized people for critical, irreversible management actions (large payments, contract signature, dismissal)
    example: a payment above a threshold needs two signatures
    sources_text: '[NIST CSRC Glossary: separation of duty (SP 800-192)](https://csrc.nist.gov/glossary/term/separation_of_duty) (supports); see R9'
    evidence: strong
    evidence_note:
    sources:
    - title: 'NIST: separation of duty'
      url: https://csrc.nist.gov/glossary/term/separation_of_duty
- id: R7
  name: Design by selection
  class: risk-scaled
  class_note: only where models are too weak for analytical design
  strength: SHOULD
  category: C
  if: no model is good enough to design the solution analytically
  then: generate many variants, test them, keep the best, and repeat (design by selection)
  because: selection by test finds good solutions without knowing exactly how they work
  example: A/B tests, fuzzing, parameter search for autoscaler settings
  check: each selection round has a defined test and records which variants were kept
  violation: choosing a configuration by opinion when it could be tested
  related:
    depends_on:
    - U40
    strengthens:
    - U11
  evidence: moderate
  evidence_note: directed evolution received the 2018 Nobel Prize in Chemistry
  source_domain: molecular and biomolecular engineering (directed evolution, DBTL)
  notes:
  sources:
  - title: 'Nobel Prize in Chemistry 2018: press release'
    url: https://www.nobelprize.org/prizes/chemistry/2018/press-release/
  - title: 'Wikipedia: Directed evolution'
    url: https://en.wikipedia.org/wiki/Directed_evolution
  - title: 'Molecular Devices: Design-build-test-learn cycle'
    url: https://www.moleculardevices.com/applications/synthetic-biology/dbtl-approach
  management:
    name: Design by selection
    form_name: Controlled experiments
    form: where you cannot predict which option works, test variants with real users, keep the best, repeat
    example: two onboarding flows for the developer portal are A/B-tested
    evidence: strong
    evidence_note:
    sources:
    - title: Kohavi & Thomke 2017
      url: https://web-docs.stern.nyu.edu/executive/The%20Surprising%20Power%20of%20Online%20Experiments.pdf
- id: R8
  name: Set-based design
  class: risk-scaled
  class_note: only where uncertainty is high early; for a repeat design, one option is enough
  strength: SHOULD
  category: B
  if: uncertainty is high early in a design
  then: 'develop several alternatives in parallel, eliminate weak ones as evidence arrives, and commit only after feasibility is shown (set-based design; opposite: point-based design)'
  because: committing early to one option risks expensive rework when it fails
  example: prototype two ingress controllers until load tests decide
  check: early design records list the alternatives kept and the evidence that eliminated each other one
  violation: choosing one design at the start and discovering at the end that it cannot meet a requirement
  related:
    depends_on:
    - U40
    strengthens:
    - U21
    - C2
  evidence: moderate
  evidence_note:
  source_domain: design engineering (Toyota set-based concurrent engineering)
  notes:
  sources:
  - title: "Sobek, Ward, Liker: Toyota's Principles of Set-Based Concurrent Engineering"
    url: https://www.gapimprove.org/_files/ugd/cd8b34_2d04bd540ca04019986c3ba54ae8631e.pdf?index=true
  management:
    name: Set-based design
    form_name: Keep strategic options open
    form: evaluate several strategies or options in parallel and drop weak ones as evidence arrives
    example: two vendors run a paid pilot before one contract is signed
    evidence: moderate
    evidence_note:
    sources:
    - title: COSO ERM principle 8
      url: https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf
- id: R9
  name: Segregation of duties
  class: risk-scaled
  class_note: required above the acceptable risk (master rule); in a very small team, compensating controls replace full segregation
  strength: MUST
  category: D
  if: a process handles money, assets, access rights or records, and the possible loss is above the acceptable risk
  then: split the process so that no single person can request, approve, execute and record the same transaction; where the team is too small, add a compensating control (a later independent review)
  because: a person who controls every step can cause an error or fraud and hide it
  example: the engineer who requests production access cannot approve it; nobody can grant themselves admin rights and also delete the audit log
  check: a matrix of incompatible roles exists, and an access review finds nobody holding two incompatible roles
  violation: one person can create a cloud account, grant themselves admin and delete the audit log
  related:
    depends_on:
    - U12
    strengthens:
    - R6
    - U8
    - U29
  evidence: strong
  evidence_note: NIST SP 800-192 definition; internal control frameworks
  source_domain: management (internal control), security engineering
  notes:
  sources:
  - title: 'NIST CSRC Glossary: separation of duty (SP 800-192)'
    url: https://csrc.nist.gov/glossary/term/separation_of_duty
  management:
- id: C1
  name: Codes as minimum
  class: conditional
  class_note: 'counterexample: novel technology for which no code exists yet'
  strength: MUST
  category: F
  if: a code or standard exists
  then: meet it as the minimum, then apply the other rules
  because: a code is a minimum, not a maximum
  example: CIS Benchmark for Kubernetes
  check: a compliance scan passes
  violation: treating compliance as proof of safety
  related:
    depends_on:
    - U2
  evidence: strong
  evidence_note:
  source_domain: pressure vessels (codes and standards)
  counterexample: novel technology for which no code exists yet
  notes:
  sources:
  - title: 'Univ. of Portland: Fail-safe designs and factor of safety'
    url: https://faculty.up.edu/lulay/MEStudentPage/failsafe.pdf
  management:
    name: Codes as minimum
    form_name: Compliance as the floor
    form: meet laws and standards as a minimum, then apply the other rules
    example: working-time law is the minimum; U47 and U38 go further
    evidence: strong
    evidence_note:
    sources:
    - title: ISO 37301:2021
      url: https://www.iso.org/standard/75080.html
- id: C2
  name: Technology maturity
  class: conditional
  class_note: 'counterexample: a system built only from proven technology'
  strength: SHOULD
  category: B
  if: the design depends on a technology that is new to the team or the industry
  then: assess how mature the technology is, and keep immature technology out of critical paths
  because: immature technology carries unknown failures
  example: CNCF sandbox project vs. graduated project for a core platform component
  check: each technology in a critical path has a recorded maturity assessment
  violation: adopting an untested tool for the production control plane without an assessment
  related:
    depends_on:
    - U21
    strengthens:
    - U6
  evidence: strong
  evidence_note: standardized as ISO 16290:2013; NASA defines TRL 1 to 9
  source_domain: aerospace (NASA TRL), EU, DoD
  counterexample: a system built only from proven technology
  notes:
  sources:
  - title: 'NASA: Technology Readiness Levels'
    url: https://www.nasa.gov/directorates/somd/space-communications-navigation-program/technology-readiness-levels/
  - title: 'Wikipedia: Technology readiness level'
    url: https://en.wikipedia.org/wiki/Technology_readiness_level
  management:
    name: Technology maturity
    form_name: Maturity of new tools, vendors and methods
    form: assess the maturity of a new tool, vendor or management method before it carries a critical process
    example: a start-up vendor is not chosen for the payroll process without an exit plan
    sources_text: '[ISO 56001:2024 Innovation management system (catalogue page)](https://www.iso.org/standard/79278.html) (supports)'
    evidence: moderate
    evidence_note:
    sources:
    - title: ISO 56001:2024
      url: https://www.iso.org/standard/79278.html
- id: C3
  name: Graceful degradation
  class: conditional
  class_note: 'counterexample: a system with a fixed, known load (an embedded controller)'
  strength: SHOULD
  category: E
  if: demand can exceed capacity
  then: 'define in advance which lower-priority functions switch off first, so that critical functions keep running (graceful degradation; opposite: cascading failure)'
  because: uncontrolled overload makes the whole system collapse
  example: PriorityClasses with preemption, rate limiting, switching off recommendations to keep checkout running
  check: an overload test shows that low-priority functions stop first and critical functions keep running
  violation: all functions slow down together until everything fails
  related:
    depends_on:
    - U25
    conflicts_with:
    - U7
  evidence: moderate
  evidence_note:
  source_domain: power grids (load shedding)
  counterexample: a system with a fixed, known load (an embedded controller)
  notes:
  sources:
  - title: 'NERC PRC-006-5: Automatic Underfrequency Load Shedding'
    url: https://www.nerc.com/globalassets/standards/reliability-standards/prc/prc-006-5.pdf
  - title: 'Wikipedia: Load shedding'
    url: https://en.wikipedia.org/wiki/Load_shedding
  management:
    name: Graceful degradation
    form_name: Prioritization and triage under overload
    form: decide in advance which work stops first when demand exceeds capacity, and which activities must resume at a minimum capacity
    example: under overload, feature requests stop first; incident response and security patches continue
    evidence: strong
    evidence_note:
    sources:
    - title: ISO 22301:2019 RTO definition (via BCI GPG)
      url: https://www.thebci.org/static/cf455e45-b2c2-4a44-b77da7c99fd6df77/BCI-GPG-2018-Edition.pdf
- id: C4
  name: End-to-end
  class: conditional
  class_note: 'counterexample: a system without communication between end points (a passive structure)'
  strength: SHOULD
  category: C
  if: a function (integrity, security, deduplication) can only be fully correct with knowledge at the end points
  then: implement it at the end points; add it in lower layers only to improve performance
  because: lower layers cannot guarantee the function and would burden every user
  example: mTLS between services instead of relying only on network encryption; checksums on backups at the application level
  check: for each end-to-end property (integrity, authentication, exactly-once), the end points verify it themselves
  violation: trusting the network to deliver data correctly without a check in the application
  related:
    strengthens:
    - U29
  evidence: moderate
  evidence_note:
  source_domain: network engineering (Saltzer, Reed, Clark 1984)
  counterexample: a system without communication between end points (a passive structure)
  notes:
  sources:
  - title: 'Saltzer, Reed, Clark: End-to-End Arguments in System Design (1984)'
    url: https://web.mit.edu/Saltzer/www/publications/endtoend/endtoend.pdf
  - title: 'Wikipedia: End-to-end principle'
    url: https://en.wikipedia.org/wiki/End-to-end_principle
  management:
    name: End-to-end
    form_name: End-to-end ownership of the customer outcome
    form: let the unit closest to the customer verify that the customer outcome is reached, instead of trusting each department's local result
    example: the platform team measures time-to-first-deploy for product teams, not only its own ticket times
    evidence: moderate
    evidence_note:
    sources:
    - title: Deming point 9
      url: https://deming.org/explore/fourteen-points/
- id: C5
  name: Strict interfaces
  class: conditional
  class_note: 'counterexample: a system without data interfaces (a passive structure)'
  strength: SHOULD
  category: C
  if: components exchange data over an interface
  then: send strictly according to the specification, reject and report input that violates it instead of silently accepting it, and state units, time zone and reference frames explicitly in every interface
  because: silently tolerated defects become permanent unofficial standards and security holes, and unstated units get misread
  example: schema validation in CI; fail on unknown fields; field names like latency_ms; timestamps in UTC with offset
  check: every interface has a machine-checked schema, and invalid input is rejected and logged
  violation: silently ignoring unknown or malformed fields
  related:
    strengthens:
    - U28
    - U18
    conflicts_with:
    - U30
  evidence: moderate
  evidence_note: "disputed: Postel's original principle says to accept liberally; RFC 9413 argues against it"
  source_domain: network protocol engineering (Postel, RFC 9413), space systems (Mars Climate Orbiter units)
  counterexample: a system without data interfaces (a passive structure)
  notes:
  sources:
  - title: 'RFC 9413: Maintaining Robust Protocols (2023)'
    url: https://www.rfc-editor.org/rfc/rfc9413.html
  - title: 'NASA: Mars Climate Orbiter Mishap Investigation Board, Phase I Report (1999)'
    url: https://discovery.larc.nasa.gov/PDF_FILES/MCO_report_2.pdf
  - title: 'Wikipedia: Robustness principle (incl. RFC 9413 critique)'
    url: https://en.wikipedia.org/wiki/Robustness_principle
  - title: 'Wikipedia: Mars Climate Orbiter'
    url: https://en.wikipedia.org/wiki/Mars_Climate_Orbiter
  management:
    name: Strict interfaces
    form_name: Explicit agreements between units
    form: state what each unit delivers to the next (contract, service level, definition of ready) and return incomplete handovers instead of silently fixing them
    example: a request without a cost centre is returned, not guessed
    sources_text: '[ISO/IEC 20000-1:2018 Service management (catalogue page)](https://www.iso.org/standard/70636.html) (supports)'
    evidence: moderate
    evidence_note:
    sources:
    - title: ISO/IEC 20000-1:2018
      url: https://www.iso.org/standard/70636.html
- id: C6
  name: Damping
  class: conditional
  class_note: 'counterexample: a system without automatic control loops'
  strength: SHOULD
  category: E
  if: a control loop reacts automatically to measurements
  then: 'add a deadband, delay or cooldown, so that the loop does not switch back and forth (oscillation; opposite: stable control)'
  because: repeated on-off cycles waste resources and destabilize the system
  example: HPA stabilization window; failover hysteresis; circuit breaker cooldown
  check: each automatic control loop has a documented deadband, delay or cooldown, and a test shows no repeated switching
  violation: an autoscaler that scales up and down every minute
  related:
    depends_on:
    - U13
    strengthens:
    - C3
  evidence: moderate
  evidence_note:
  source_domain: control engineering
  counterexample: a system without automatic control loops
  notes:
  sources:
  - title: 'Åström & Murray: Feedback Systems, section 1.5 On-Off Control'
    url: https://introcontrol.mit.edu/_static/fall21/extras/Feedback%20Systems%20Murray.pdf
  - title: 'Wikipedia: Deadband'
    url: https://en.wikipedia.org/wiki/Deadband
  management:
    name: Damping
    form_name: Stable management cadence
    form: change priorities, structures and plans on a fixed cadence, not on every new signal
    example: priorities change at sprint boundaries, not daily
    evidence: moderate
    evidence_note:
    sources:
    - title: 'Scrum Guide: "No changes are made that would endanger the Sprint Goal"'
      url: https://scrumguides.org/scrum-guide.html
- id: C7
  name: Induced demand
  class: conditional
  class_note: 'counterexample: a system without a shared, congested resource'
  strength: SHOULD
  category: E
  if: you add capacity to relieve congestion
  then: expect demand to grow into the new capacity, and also manage demand (quotas, priorities, pricing)
  because: added capacity lowers the cost of use, which increases use
  example: a larger cluster fills up again; faster CI leads to more CI runs
  check: each capacity increase comes with a forecast of demand growth and a demand control (quota, priority or price)
  violation: doubling the cluster size and being full again a month later
  related:
    depends_on:
    - U13
    strengthens:
    - U16
    - U25
  evidence: moderate
  evidence_note:
  source_domain: transportation (induced demand)
  counterexample: a system without a shared, congested resource
  notes:
  sources:
  - title: 'Duranton & Turner: The Fundamental Law of Road Congestion (AER 2011)'
    url: https://www.aeaweb.org/articles?id=10.1257/aer.101.6.2616
  - title: 'Wikipedia: Induced demand'
    url: https://en.wikipedia.org/wiki/Induced_demand
  management:
    name: Induced demand
    form_name: Parkinson's law
    form: expect work and spending to grow into added time or budget; manage demand as well as capacity
    example: a larger budget is given with an explicit scope, not "more of the same"
    evidence: moderate
    evidence_note: the original is a satirical essay; the general claim is weak, the budget case is widely observed
    sources:
    - title: Parkinson 1955 (text copy)
      url: https://doc.cat-v.org/economics/parkinsons-law
- id: C8
  name: Bottleneck first
  class: conditional
  class_note: 'counterexample: a system without a throughput goal (a monument)'
  strength: SHOULD
  category: E
  if: you want more throughput
  then: find the constraint (bottleneck) and improve it first
  because: improving other parts does not increase output
  example: speeding up lint does nothing if integration tests or the review queue are the bottleneck
  check: before an improvement for throughput, the current constraint is measured and named
  violation: optimizing a fast step while work piles up in front of a slow step
  related:
    depends_on:
    - U13
    strengthens:
    - U25
  evidence: moderate
  evidence_note:
  source_domain: industrial engineering (theory of constraints)
  counterexample: a system without a throughput goal (a monument)
  notes:
  sources:
  - title: 'Theory of Constraints Institute: Five Focusing Steps'
    url: https://www.tocinstitute.org/five-focusing-steps.html
  - title: 'Wikipedia: Theory of constraints'
    url: https://en.wikipedia.org/wiki/Theory_of_constraints
  management:
    name: Bottleneck first
    form_name: Constraint first
    form: find the step that limits output (often an approval, a meeting or a specialist) and improve it first
    example: the security review queue is the constraint, so review capacity is added there first
    sources_text: section 9 (theory of constraints)
    evidence: moderate
    evidence_note:
    sources: []
- id: C9
  name: Data as a dependency
  class: conditional
  class_note: 'counterexample: a system whose behavior does not depend on data or learned models'
  strength: SHOULD
  category: H
  if: behavior depends on data or learned models
  then: version and validate the data like code, monitor for drift, and retrain or re-evaluate when the world changes
  because: data dependencies cost more than code dependencies, and predictions get worse over time
  example: versioned evaluation set for code-review prompts; alerts on shifts in the input distribution
  check: data and models have versions, inputs are validated, and drift is monitored with an alert
  violation: a model or prompt that silently gets worse over months
  related:
    depends_on:
    - U9
    strengthens:
    - U13
    - U31
  evidence: moderate
  evidence_note:
  source_domain: data and ML engineering
  counterexample: a system whose behavior does not depend on data or learned models
  notes:
  sources:
  - title: 'Sculley et al.: Hidden Technical Debt in ML Systems (NeurIPS 2015)'
    url: https://proceedings.neurips.cc/paper_files/paper/2015/file/86df7dcfd896fcaf2674f757a2463eba-Paper.pdf
  - title: 'Wikipedia: Concept drift'
    url: https://en.wikipedia.org/wiki/Concept_drift
  management:
    name: Data as a dependency
    form_name: Data governance for decisions
    form: where decisions depend on data or models, version the definitions, check data quality and watch for drift
    example: the headcount figure in the board report and in HR have the same definition
    evidence: moderate
    evidence_note:
    sources:
    - title: COSO ERM principle 18
      url: https://www.coso.org/_files/ugd/3059fc_61ea5985b03c4293960642fdce408eaa.pdf
- id: C10
  name: Qualified procedure and person
  class: conditional
  class_note: 'counterexample: results that can be fully inspected afterwards (a dimension check on a simple part)'
  strength: SHOULD
  category: F
  if: the quality of a result cannot be fully checked afterwards
  then: prove the procedure by a test before using it, and qualify each person who performs it
  because: a defect that inspection cannot find must be prevented by a proven procedure and a qualified person
  example: a restore procedure proven by a real restore; only engineers who did a restore drill run production restores
  check: each such procedure has a test record, and each performer has a qualification record
  violation: a backup procedure that was never restored
  related:
    depends_on:
    - U2
    strengthens:
    - U17
    - U32
  evidence: strong
  evidence_note: required for welding by ASME Section IX
  source_domain: welding (WPS, PQR, welder qualification)
  counterexample: results that can be fully inspected afterwards (a dimension check on a simple part)
  notes:
  sources:
  - title: 'ASME BPVC Section IX: Welding, Brazing and Fusing Qualifications'
    url: https://www.asme.org/codes-standards/find-codes-standards/bpvc-ix-bpvc-section-ix-welding-brazing-fusing-qualifications
  - title: 'Wikipedia: Welding Procedure Specification'
    url: https://en.wikipedia.org/wiki/Welding_Procedure_Specification
  management:
    name: Qualified procedure and person
    form_name: Qualified roles
    form: where a result cannot be fully checked afterwards (hiring, audit, investigation, negotiation), use a proven procedure and trained people
    example: only trained interviewers run structured interviews (U56)
    sources_text: '[Regulation (EU) No 537/2014, Article 17 (text copy)](https://www.charteredaccountants.ie/chariotindex/text/ec_2014_537/17.html) (supports)'
    evidence: strong
    evidence_note: statutory audit
    sources:
    - title: EU 537/2014 (approved statutory auditors)
      url: https://www.charteredaccountants.ie/chariotindex/text/ec_2014_537/17.html
- id: C11
  name: Shared demand signal
  class: conditional
  class_note: 'counterexample: a single-stage system'
  strength: SHOULD
  category: E
  if: several stages pass demand signals along a chain
  then: share the real end demand with every stage, instead of letting each stage react only to the stage below it
  because: each stage amplifies the variation it sees, so swings grow upstream (bullwhip effect)
  example: upstream services scale on front-end traffic, not only on their own delayed queue length
  check: each stage in a chain can see the end demand signal
  violation: each service autoscaler reacts only to its own queue, and the swings grow along the chain
  related:
    depends_on:
    - U13
    strengthens:
    - C6
    - C7
  evidence: moderate
  evidence_note:
  source_domain: supply chain engineering (bullwhip effect)
  counterexample: a single-stage system
  notes:
  sources:
  - title: 'MIT Sloan Management Review: The Bullwhip Effect in Supply Chains'
    url: https://sloanreview.mit.edu/article/the-bullwhip-effect-in-supply-chains/
  - title: 'Wikipedia: Bullwhip effect'
    url: https://en.wikipedia.org/wiki/Bullwhip_effect
  - title: 'Lee, Padmanabhan, Whang: Information Distortion in a Supply Chain (Management Science 1997)'
    url: https://courses.ie.bilkent.edu.tr/ie102/wp-content/uploads/sites/12/2019/02/Lee-Padmanabhan-Whang-1997-MS.pdf
  management:
    name: Shared demand signal
    form_name: Share real end demand
    form: give every stage of a chain the real end demand, not only the order of the next stage
    example: the platform team sees product teams' roadmaps, not only tickets
    evidence: strong
    evidence_note:
    sources:
    - title: Lee, Padmanabhan, Whang 1997
      url: https://courses.ie.bilkent.edu.tr/ie102/wp-content/uploads/sites/12/2019/02/Lee-Padmanabhan-Whang-1997-MS.pdf
- id: C12
  name: Asset inventory
  class: conditional
  class_note: 'counterexample: a single, small asset'
  strength: SHOULD
  category: H
  if: you operate many assets
  then: keep a complete inventory of all assets, with owner, condition and lifecycle stage
  because: you cannot maintain, secure or decommission what you do not know you have
  example: inventory of clusters, accounts, certificates and images with owners; SBOM per image
  check: an automated discovery compares the real assets with the inventory and finds no unknown assets
  violation: a forgotten test cluster with public access
  related:
    strengthens:
    - U14
    - U37
    - U12
  evidence: moderate
  evidence_note:
  source_domain: municipal and infrastructure engineering (asset management, ISO 55000)
  counterexample: a single, small asset
  notes:
  sources:
  - title: 'CIS Control 1: Inventory and Control of Enterprise Assets'
    url: https://www.cisecurity.org/controls/inventory-and-control-of-enterprise-assets
  - title: 'Wikipedia: Asset management (incl. ISO 55000)'
    url: https://en.wikipedia.org/wiki/Asset_management
  management:
    name: Asset inventory
    form_name: Registers of assets, contracts, information and records
    form: keep complete registers with an owner, condition and life-cycle stage
    example: a contract register with end dates and notice periods
    evidence: strong
    evidence_note:
    sources:
    - title: ISO 55000:2024
      url: https://www.iso.org/standard/83053.html
    - title: ISO/IEC 27001:2022
      url: https://www.iso.org/standard/27001
    - title: ISO 15489-1:2016
      url: https://www.iso.org/standard/62542.html
- id: C13
  name: Weakest-link scaling
  class: conditional
  class_note: 'counterexample: a system of fixed, small size'
  strength: SHOULD
  category: C
  if: a system grows in size or in number of parts
  then: expect rare failures to become frequent, and design and test for the target scale
  because: the larger the system, the more likely it contains a critical weak part (weakest link)
  example: at 1,000 nodes, a node failure that happens once in 1,000 days per node happens every day
  check: failure rates are estimated per component and multiplied by the planned scale
  violation: assuming that a failure never seen in a 3-node test will not happen at 300 nodes
  related:
    strengthens:
    - U31
    - R1
  evidence: strong
  evidence_note: 'ASTM C1683: "The larger the specimen or component, the weaker it is likely to be"'
  source_domain: ceramics and brittle materials (Weibull statistics, size effect)
  counterexample: a system of fixed, small size
  notes:
  sources:
  - title: 'ASTM C1683: Size Scaling of Tensile Strengths Using Weibull Statistics for Advanced Ceramics'
    url: https://store.astm.org/c1683-10r24.html
  - title: 'Wikipedia: Weibull modulus'
    url: https://en.wikipedia.org/wiki/Weibull_modulus
  - title: 'Wikipedia: Size effect on structural strength'
    url: https://en.wikipedia.org/wiki/Size_effect_on_structural_strength
  management:
    name: Weakest-link scaling
    form_name: Rare events become frequent with size
    form: as the organization grows, expect rare events (fraud, misconduct, key-person loss) to happen regularly, and scale controls with size
    example: at 500 people, a once-per-500-person-years event happens about every year
    sources_text: cross-reference only
    evidence: moderate
    evidence_note:
    sources: []
- id: C14
  name: Structure follows the intended system
  class: conditional
  class_note: 'counterexample: a system built by one person, or by one small team that communicates as one unit'
  strength: SHOULD
  category: C
  if: an organization designs a system with several components
  then: design team boundaries and communication paths to match the component structure you want, and change them when the intended structure changes
  because: organizations produce designs that copy their own communication structure (Conway's law)
  example: one team per bounded context; the platform team owns the platform API, not parts of each product's code
  check: each major component boundary has one owning team, and cross-team dependencies are counted
  violation: one component maintained by four teams that never talk to each other
  related:
    strengthens:
    - U7
    - C5
    - U46
  evidence: moderate
  evidence_note: widely observed; one original paper
  source_domain: management (organization design), software engineering
  counterexample: a system built by one person, or by one small team that communicates as one unit
  notes:
  sources:
  - title: 'Conway: How Do Committees Invent? (1968)'
    url: https://www.melconway.com/Home/Committees_Paper.html
  management:
- id: C15
  name: Late work and added people
  class: conditional
  class_note: 'counterexample: work that can be split into independent parts without communication (for example harvesting a field)'
  strength: SHOULD
  category: E
  if: work is late, and it needs coordination and learning
  then: do not expect added people to recover the schedule soon; cut or move scope first, and add people early, only where the work can be split
  because: new people need training and add communication paths, which at first lowers the output of the existing team (Brooks's law)
  example: two weeks before a cluster-migration deadline, scope is cut; new engineers join the next migration from its start
  check: before people are added to late work, a record states the expected training and coordination cost
  violation: adding five engineers to a migration two weeks before its deadline
  related:
    strengthens:
    - U39
    conflicts_with:
    - R1
  related_text: strengthens U39; conflicts with R1 when people are added for redundancy (add early, not late)
  evidence: moderate
  evidence_note:
  evidence_text: moderate; **secondary only** (the book is not online; Brooks himself calls the law an outrageous oversimplification)
  source_domain: management (software project management)
  counterexample: work that can be split into independent parts without communication (for example harvesting a field)
  notes:
  sources:
  - title: 'Reinertsen: Is it always a bad idea to add resources to a late project? (Electronic Design 2000)'
    url: https://www.electronicdesign.com/archive/article/21760483/is-it-always-a-bad-idea-to-add-resources-to-a-late-project
  - title: "The Jargon File: Brooks's Law"
    url: https://www.catb.org/jargon/html/B/Brookss-Law.html
  management:
- id: C16
  name: Span of control
  class: conditional
  class_note: 'counterexample: a system operated by one person or by fully automated control'
  strength: SHOULD
  category: H
  if: one person directs other people during operation (incident, cutover, commissioning)
  then: 'keep the number of people one person directs in a manageable range (guideline: about five), and add group leads above that'
  because: a person can coordinate only a limited number of people, and an overloaded coordinator misses actions
  example: an incident commander with 12 responders appoints two group leads (communication, mitigation)
  check: each incident record lists the roles and the number of people each lead directed; values above the guideline have a reason
  violation: one incident commander directly coordinating 20 people in one channel
  related:
    strengthens:
    - U42
    - U32
    - U46
  evidence: strong
  evidence_note:
  evidence_text: 'strong for incident management (US federal doctrine NIMS: 1:5 as guideline)'
  source_domain: management (incident management)
  counterexample: a system operated by one person or by fully automated control
  notes:
  sources:
  - title: 'FEMA: National Incident Management System, 3rd ed. (2017)'
    url: https://training.fema.gov:443/EMIWeb/IS/IS700b/Handouts/National_Incident_Management%20System_Third%20Edition_October_2017.pdf
  management:
conflict_rules:
- id: K1
  if: a rule that adds parts (U25, R1, R2, U29, U34, C3) conflicts with U7 (fewer parts)
  then: add those parts only as far as the master rule and the rigor matrix require
  because: both adding and removing parts change failure risk
  example: multi-AZ for production, single-AZ for development
  basis: sourced (see U7, U25, R1)
  rules:
  - U25
  - R1
  - R2
  - U29
  - U34
  - C3
  - U7
- id: K2
  if: a fix is needed faster than U9 (change review) and U19 (small steps) allow, because of U35 (time until harm)
  then: use a predefined emergency change path with a shorter review, and do the full review afterwards
  because: skipping review without a plan removes every check at the moment of highest stress
  example: a hotfix path with one approver and a mandatory postmortem within 48 h
  basis: author's synthesis; no single source
  rules:
  - U9
  - U19
  - U35
- id: K3
  if: U30 (tolerate variation) seems to conflict with C5 (reject bad input)
  then: tolerate variation within the specification (U30); reject and report input outside the specification (C5)
  because: both rules aim at stable behavior; they differ only in where the boundary lies
  example: accept any valid timestamp format the schema allows; reject a timestamp field that is missing
  basis: author's synthesis from Taguchi and RFC 9413
  rules:
  - U30
  - C5
- id: K4
  if: preserving evidence (U23) would delay recovery beyond the time until harm (U35)
  then: capture evidence automatically and fast; if harm is imminent, restore service first and keep whatever the automation captured
  because: both the evidence and the service matter, and automation makes the trade-off small
  example: crash dumps and log shipping run before every automatic restart
  basis: author's synthesis; no single source
  rules:
  - U23
  - U35
- id: K5
  if: U50 (decide reversible decisions fast) conflicts with U9 (change review) and U8 (independent checker)
  then: 'scale the review depth with reversibility and consequence: reversible and low consequence → peer review or self-check; irreversible or high consequence → full review, R6 and an external checker'
  because: both slowness and unreviewed irreversible harm are failures
  example: 'a new dashboard: the team decides; deleting historical audit logs: two approvers and a legal review'
  basis: author's synthesis from the Amazon 2015 letter and the master rule
  rules:
  - U50
  - U9
  - U8
  - R6
- id: K6
  if: U49 (leave the method to the people doing the work) conflicts with U32 (checklists), U33 (critical control points) and C10 (qualified procedure)
  then: prescribe the method only at critical control points, in qualified or regulated procedures, and where the rigor matrix requires it; everywhere else give intent and constraints
  because: prescribed methods everywhere stop initiative; free methods at critical points remove proven protections
  example: '"use the restore checklist" (prescribed); "improve developer onboarding" (intent only)'
  basis: author's synthesis from ADP 6-0 and C10
  rules:
  - U49
  - U32
  - U33
  - C10
- id: K7
  if: U47 (psychological safety) and U10 (blameless analysis) seem to conflict with accountability (U2, U48, R9, legal duties)
  then: treat honest errors and system weaknesses without blame; treat deliberate violations, reckless behavior and fraud through a defined, fair disciplinary procedure
  because: blame for honest errors hides information; no consequence for deliberate violations destroys trust and controls
  example: a wrong command during an incident → blameless postmortem; bypassing the two-person rule on purpose → disciplinary procedure
  basis: author's synthesis; no single source
  rules:
  - U47
  - U10
  - U2
  - U48
  - R9
- id: K8
  if: U55 (specific, challenging goals) conflicts with U51 (indicators are gamed) and with Deming's rejection of numerical goals
  then: use goals for direction and learning; do not tie pay or ranking mechanically to one indicator; pair every target with a counter-indicator
  because: goals raise performance, but a single rewarded number distorts the work
  example: the team goal "halve build time" has a guard "test coverage does not drop"; bonuses are not calculated from the build time
  basis: author's synthesis from Locke & Latham, Campbell and Deming
  rules:
  - U55
  - U51
