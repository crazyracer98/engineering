  group: management_rules
  sources_text: "[Campbell 1979, Evaluation and Program Planning 2(1): 67–90, doi:10.1016/0149-7189(79)90048-X](https://doi.org/10.1016/0149-7189(79)90048-X); [Wikipedia: Campbell's law](https://en.wikipedia.org/wiki/Campbell%27s_law) (secondary, quote checked here)"
  sources:
