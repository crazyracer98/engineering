  text: '"We found that specific, difficult goals consistently led to higher performance than urging people to do their best." "the combination of goals plus feedback is more effective than goals alone" "on tasks that are complex for people, learning goals can be superior to performance goals". Deming 11(b): "Eliminate management by objective. Eliminate management by numbers, numerical goals. Substitute leadership."'
