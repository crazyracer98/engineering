  text: "\"Engagement—involving individuals in decisions by inviting their input and encouraging them to challenge one another's ideas.\" \"Explanation—clarifying the thinking behind a final decision.\" \"Expectation clarity—stating the new rules of the game, including performance standards…\" \"Notice that fair process is not decision by consensus.\""
