  text: 'OECD II.F.2: "Members of the board and key executives should be required to disclose to the board whether they, directly, indirectly" … "have a material interest in any transaction or matter directly affecting the corporation." OECD procurement risk: "Mismanagement of conflict of interest in the public service and in post-public employment"'
