  text: 'Edmondson: team psychological safety is "a shared belief that the team is safe for interpersonal risk taking"; "learning behavior mediates between team psychological safety and team performance." Google: five dynamics "In order of importance": "Psychological safety", "Dependability", "Structure and clarity", "Meaning", "Impact" (180 teams studied)'
