# Weekly link check over the published prose. Never fails the run on broken
# or flaky links; it keeps one tracking issue open/updated instead.
name: Links

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lychee:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --config lychee.toml
            --no-progress
            'publication/**/*.md'
            'docs/**/*.md'
            'paper/**/*.md'
          fail: false
          jobSummary: true
          output: lychee/report.md
          token: ${{ secrets.GITHUB_TOKEN }}

      # `gh issue` instead of peter-evans/create-issue-from-file: one fewer
      # third-party action to pin and trust with issues:write, and it can
      # find, update and close the single tracking issue by title.
      - name: Open or update the tracking issue
        if: steps.lychee.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Link check failed
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          { printf 'Weekly link check: %s\n\n' "$RUN_URL"; cat lychee/report.md; } > body.md
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file body.md
          else
            gh issue create --title "$TITLE" --body-file body.md
          fi

      - name: Close the tracking issue when links are fine
        if: steps.lychee.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Link check failed
        run: |
          set -euo pipefail
          n=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number // empty")
          if [ -n "$n" ]; then
            gh issue close "$n" --comment "The weekly link check passes again."
          fi
