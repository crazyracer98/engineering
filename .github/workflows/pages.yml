# Deploys the site to GitHub Pages for a published release. Pull requests
# (and manual runs without a tag) only build the site and the PDF and upload
# them as workflow artifacts for review; they never deploy.
#
# Three paths deploy, all through the `tag` job, which resolves the tag once:
#   - release: published        -> that release's tag (releases made by people).
#   - workflow_run: Release     -> the latest published release, once the
#     Release workflow succeeded. release.yml creates its release with
#     GITHUB_TOKEN, and GitHub starts no workflow runs for events that token
#     creates, so `release: published` never fires for it.
#   - workflow_dispatch + `tag` -> that tag, if it is a published release
#     (a re-deploy, or the first deploy of a release made before this ran).
name: Pages

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to deploy; leave empty for a preview build only
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  # Resolves the tag to deploy, or leaves `tag` empty to skip the deploy.
  tag:
    if: >-
      github.event_name == 'release'
      || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      actions: read
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve the release tag
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release)
              tag="$RELEASE_TAG"
              ;;
            workflow_run)
              # The latest published (non-draft, non-prerelease) release.
              if ! tag="$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name 2>/dev/null)"; then
                echo "::notice::No published release yet; skipping the Pages deploy."
                exit 0
              fi
              ;;
            workflow_dispatch)
              # Must be an existing, published (not draft) release.
              if ! info="$(gh release view "$INPUT_TAG" --json tagName,isDraft --jq '[.tagName, .isDraft] | @tsv')"; then
                echo "::error::'$INPUT_TAG' is not a release tag of $GH_REPO."
                exit 1
              fi
              if [ "${info##*$'\t'}" != "false" ]; then
                echo "::error::The release '$INPUT_TAG' is a draft, not published."
                exit 1
              fi
              tag="${info%%$'\t'*}"
              ;;
            *)
              echo "::error::Unexpected event $EVENT."
              exit 1
              ;;
          esac
          echo "Deploying release $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  preview:
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.tag == '')
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # setup-uv instead of the devcontainer (checks.yml): the site and PDF
      # need only Python wheels (Pandoc and Typst come from PyPI), so the
      # devcontainer's compose stack would just add minutes.
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the site
        run: uv run --locked taxonomy site --out build/site

      - name: Build the PDF
        run: uv run --locked taxonomy paper --out build/paper.pdf

      - name: Upload the site preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: build/site
          if-no-files-found: error

      - name: Upload the PDF preview
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: paper-preview
          path: |
            build/paper.pdf
            build/references.json
          if-no-files-found: error

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --locked

      - name: Build the site
        run: uv run --locked taxonomy site --out build/site

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
