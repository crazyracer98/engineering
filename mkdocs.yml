site_name: Engineering Best Practices
site_description: A cross-domain taxonomy of engineering and management rules.
site_url: https://crazyracer98.github.io/engineering/
repo_url: https://github.com/crazyracer98/engineering
repo_name: crazyracer98/engineering
# Pages are generated; "edit" leads to the data they are built from.
edit_uri: edit/main/data/
copyright: CC BY-SA 4.0 (content), GPL-3.0 (code)
docs_dir: build/site-src
site_dir: build/site
strict: true

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - attr_list
  - tables
  - admonition
  - md_in_html

extra_css:
  - assets/quiz/quiz.css

extra_javascript:
  - path: assets/quiz/quiz.js
    type: module

nav:
- Home: index.md
- Chapters:
    - "1. How to read the rules": 01-how-to-read.md
    - "2. Master rule": 02-master-rule.md
    - "3. Taxonomy overview": 03-overview.md
    - "4. Domain index": 04-domain-index.md
    - "5. Glossary": 05-glossary.md
    - "6. Rigor matrix": 06-rigor-matrix.md
    - "7. Rules by category": 07-rules.md
    - "8. Conflict rules": 08-conflicts.md
    - "9. Sources by rule": 09-sources-by-rule.md
    - "10. Management form of each rule": 10-management-forms.md
    - "11. Direct quotes": 11-quotes.md
    - "12. Method and limits": 12-method.md
- Learn:
    - Overview: learn/index.md
    - Rules by category:
        - "A. Responsibility": learn/a.md
        - "B. Knowledge and decisions": learn/b.md
        - "C. Design": learn/c.md
        - "D. Protection": learn/d.md
        - "E. Capacity and continuity": learn/e.md
        - "F. Verification and review": learn/f.md
        - "G. Change": learn/g.md
        - "H. Operation and maintenance": learn/h.md
        - "I. Learning": learn/i.md
    - Domains by branch:
        - "Civil": learn/branch-civil.md
        - "Mechanical": learn/branch-mechanical.md
        - "Materials": learn/branch-materials.md
        - "Electrical": learn/branch-electrical.md
        - "Chemical": learn/branch-chemical.md
        - "Nuclear": learn/branch-nuclear.md
        - "Mining": learn/branch-mining.md
        - "Biomedical": learn/branch-biomedical.md
        - "Agricultural": learn/branch-agricultural.md
        - "Industrial": learn/branch-industrial.md
        - "Computing": learn/branch-computing.md
        - "Cross-cutting": learn/branch-cross-cutting.md
        - "Management: Governance and assurance": learn/branch-management-governance-and-assurance.md
        - "Management: Strategy and decisions": learn/branch-management-strategy-and-decisions.md
        - "Management: Portfolio, programme and project": learn/branch-management-portfolio-programme-and-project.md
        - "Management: Product and innovation": learn/branch-management-product-and-innovation.md
        - "Management: Operations, quality and supply": learn/branch-management-operations-quality-and-supply.md
        - "Management: Risk, resilience and legal": learn/branch-management-risk-resilience-and-legal.md
        - "Management: People and organization": learn/branch-management-people-and-organization.md
        - "Management: Finance": learn/branch-management-finance.md
- Quiz:
    - Overview: quiz/index.md
    - Mixed test: quiz/mixed.md
    - "A. Responsibility": quiz/a.md
    - "B. Knowledge and decisions": quiz/b.md
    - "C. Design": quiz/c.md
    - "D. Protection": quiz/d.md
    - "E. Capacity and continuity": quiz/e.md
    - "F. Verification and review": quiz/f.md
    - "G. Change": quiz/g.md
    - "H. Operation and maintenance": quiz/h.md
    - "I. Learning": quiz/i.md
    - Conflict rules: quiz/conflicts.md
- Methodology: methodology.md
- History: history.md
