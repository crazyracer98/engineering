glossary:
  error:
    meaning: a human action or omission that differs from the intended action
    not_same_as: defect, failure
  defect:
    meaning: a flaw in the product, caused by an error
    not_same_as: error, failure
  failure:
    meaning: the product does not perform its required function
    not_same_as: defect (a defect can exist without causing a failure)
  anomaly:
    meaning: behavior that differs from what was expected, with or without harm
    not_same_as: failure (an anomaly can happen without a failure)
  requirement:
    meaning: a measurable statement of what the product must do
    not_same_as: a wish or goal without a measure
  verification:
    meaning: checking that the product was built as the requirements specify ("built right")
    not_same_as: validation
  validation:
    meaning: checking that the product fulfills its intended purpose ("right thing built")
    not_same_as: verification
  domain of applicability:
    meaning: the range of conditions for which a model has been validated
    not_same_as: the range in which a model produces an answer
  consequence:
    meaning: the harm caused if a failure happens
    not_same_as: likelihood
  uncertainty:
    meaning: how poorly the loads, inputs or conditions are known
    not_same_as: consequence
  margin:
    meaning: capacity above the expected load
    not_same_as: redundancy, robustness
  robustness:
    meaning: the result changes little when inputs vary within the specification
    not_same_as: margin; strictness (rejecting input outside the specification, C5)
  fatigue:
    meaning: damage from repeated loads that builds up over time
    not_same_as: overload (one load above the limit)
  oscillation:
    meaning: a control loop switching back and forth around its target
    not_same_as: 'opposite: stable control'
  constraint (bottleneck):
    meaning: the part of a system that limits its total output
    not_same_as: any slow part
  critical path:
    meaning: the longest chain of dependent tasks
    not_same_as: the most important tasks
  hold point:
    meaning: a check that work cannot pass until it is approved
    not_same_as: witness point (work continues while the check is observed)
  drift:
    meaning: a change in real-world data that makes a model less accurate
    not_same_as: a defect in the model
  measurement uncertainty:
    meaning: the spread of values that could reasonably be attributed to a measured quantity
    not_same_as: error (the difference from the true value)
  chain of custody:
    meaning: a record of who held a piece of evidence, and when
    not_same_as: ownership
  actionable alert:
    meaning: an alert that requires a defined human action now
    not_same_as: an informational message
  commissioning:
    meaning: testing that all parts work together against the owner's requirements before handover
    not_same_as: testing each part alone
  provenance:
    meaning: the documented origin, batch and certificate of a part
    not_same_as: a part's current location
  exact constraint:
    meaning: each property is set by exactly one mechanism
    not_same_as: 'opposite: over-constraint (several mechanisms set the same property)'
  weakest link:
    meaning: the single part whose failure makes the whole system fail
    not_same_as: the average part
  set-based design:
    meaning: keeping several alternatives open and eliminating weak ones as evidence arrives
    not_same_as: 'opposite: point-based design (choosing one option early)'
  cliff effect:
    meaning: output stays perfect until it collapses suddenly
    not_same_as: gradual degradation
  redundancy:
    meaning: a second copy of a part that takes over when the first copy fails
    not_same_as: diversity
  diversity:
    meaning: copies that are built differently, so one cause cannot fail all of them
    not_same_as: redundancy
  compartment:
    meaning: an isolated part of the system that contains a failure
    not_same_as: 'opposite: shared failure domain'
  graceful degradation:
    meaning: losing lower-priority functions while critical functions keep running
    not_same_as: 'opposite: cascading failure'
  safe state:
    meaning: a predefined state that causes no harm
    not_same_as: normal operating state
  isolation:
    meaning: disconnecting a part from all inputs and energy, and locking that state
    not_same_as: switching off (anyone can switch it on again)
  control:
    meaning: a measure that reduces risk
    not_same_as: a check (a check detects; a control reduces)
  critical control point:
    meaning: a process step where control is essential to prevent a hazard
    not_same_as: every process step
  critical limit:
    meaning: a minimum or maximum value that must be kept at a critical control point
    not_same_as: a target value
  checker:
    meaning: a person, other than the author, who reviews work
    not_same_as: the author
  universal rule (U):
    meaning: a rule whose condition is true, or whose trigger occurs, in every engineered system; its intensity scales with the master rule
    not_same_as: a rule that applies everywhere at full strength
  risk-scaled rule (R):
    meaning: a rule that applies only above a consequence or uncertainty threshold set by the rigor matrix
    not_same_as: conditional rule
  conditional rule (C):
    meaning: a rule that applies only when the system has a property that a common class of systems lacks
    not_same_as: risk-scaled rule
  trigger:
    meaning: an event that happens in the life of every system, such as a failure, a change or a decision
    not_same_as: scope condition (a property only some systems have)
rigor_matrix:
- consequence: low
  uncertainty: low
  apply:
  - all U-rules
  - C-rules whose condition is true
  checker_level: peer
- consequence: low
  uncertainty: high
  apply:
  - all U-rules
  - C-rules whose condition is true
  - R4
  - R7
  - R8
  checker_level: peer
- consequence: high
  uncertainty: low
  apply:
  - all U-rules
  - C-rules whose condition is true
  - R1
  - R2
  - R3
  - R6
  checker_level: external
- consequence: high
  uncertainty: high
  apply:
  - all U-rules
  - C-rules whose condition is true
  - all R-rules
  checker_level: external
rules:
- id: U1
  former_id: U1
  name: Public safety first
  class: universal
  class_note: true for every system
  strength: MUST
  category: A
  if: always
  then: put public safety above cost, schedule and convenience
  because: failures harm people outside the project
  example: block a release that leaks user data
  check: every release gate contains a safety and security sign-off item
  violation: shipping a known safety defect to meet a deadline
  related:
    strengthens:
    - U26
    - U27
  evidence: strong
  source_domain: all (professional ethics)
  sources:
  - https://www.nspe.org/sites/default/files/resources/pdfs/Ethics/EthicsReferenceGuide.pdf
  sources_wikipedia_only: false
- id: U2
  former_id: U2
  name: Work within competence
  class: universal
  class_note: true for every system
  strength: MUST
  category: A
  if: always
  then: work only within your competence, and involve an expert outside it
  because: error rates rise outside known areas
  example: a security engineer reviews an IAM design
  check: each design has a named checker with expertise in its domain
  violation: approving work in a domain you do not know
  related:
    strengthens:
    - U8
  evidence: strong
  source_domain: all (professional ethics)
  sources:
  - https://www.nspe.org/sites/default/files/resources/pdfs/Ethics/EthicsReferenceGuide.pdf
  sources_wikipedia_only: false
- id: U3
  former_id: U3
  name: Measurable requirements
  class: universal
  class_note: true for every system
  strength: MUST
  category: B
  if: always
  then: write each requirement as measurable, and link it to a user need
  because: an unmeasurable requirement cannot be verified
  example: '"p95 latency < 200 ms", linked to a ticket'
  check: every requirement has an acceptance criterion and a link to a user need
  violation: '"the system shall be fast"'
  related:
    strengthens:
    - U4
    - R3
  evidence: moderate
  source_domain: systems engineering
  sources:
  - https://wbt.dot.state.fl.us/ois/ITS-SystemsEngineering100/SystemsEngineeringPt2-m2-TRANSCRIPT.pdf
  sources_wikipedia_only: false
- id: U4
  former_id: U4
  name: Verification and validation
  class: universal
  class_note: true for every system
  strength: MUST
  category: F
  if: always
  then: do verification AND validation, and before handover test that all parts work together against the owner's requirements (commissioning)
  because: passing one does not mean passing the other, and parts that pass alone can fail together
  example: CI tests pass = verification; user acceptance = validation; end-to-end test of a new platform with DNS, certificates, monitoring and backup
  check: both a test result and a stakeholder acceptance exist
  violation: declaring the work done because tests pass
  related:
    depends_on:
    - U3
  evidence: strong
  source_domain: systems engineering, building services (commissioning)
  sources:
  - https://arxiv.org/pdf/1311.3626
  - https://en.wikipedia.org/wiki/Building_commissioning
  sources_wikipedia_only: false
- id: U5
  former_id: U5
  name: Find defects early
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: F
  if: always
  then: find and fix defects at the earliest possible stage
  because: the cost of a fix rises at each later stage
  example: lint and tests run in CI before merge
  check: each check runs at the first stage where it can run
  violation: finding defects only in production
  related:
    strengthens:
    - U6
    - U28
  evidence: moderate
  evidence_note: direction strong; the '10x per stage' factor is weak
  source_domain: software engineering
  sources:
  - https://arxiv.org/pdf/1609.04886
  sources_wikipedia_only: false
- id: U6
  former_id: U6
  name: Failure and interaction analysis
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: before you build, list how each part can fail, how parts that have not failed can interact unsafely, and how the system can cause harm while working as designed (insufficient design or foreseeable misuse)
  because: a known failure or interaction can be designed against
  example: '"what happens if the registry is down?" and "what if two controllers fight over the same resource?"'
  check: a list of failure modes and unsafe interactions exists per component and is reviewed
  violation: the first failure analysis happens after an incident
  related:
    strengthens:
    - U25
    - R1
    - R2
    - U26
    - U27
    - U34
  evidence: moderate
  evidence_note: method widely used; RPN scoring criticized
  source_domain: reliability and safety (FMEA, STPA), automotive (SOTIF)
  sources:
  - https://www.ebsco.com/research-starters/social-sciences-and-humanities/failure-mode-and-effects-analysis-fmea
  - https://www.ncbi.nlm.nih.gov/pmc/articles/PMC3405478/
  - https://www.flighttestsafety.org/images/STPA_Handbook.pdf
  - https://www.swiftnav.com/glossary/what-is-safety-of-the-intended-functionality-sotif
  sources_wikipedia_only: false
- id: U7
  former_id: U7
  name: Simplicity and modularity
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: choose the simplest design that meets the requirements, and split it into modules
  because: every added part adds a way to fail
  example: one Helm chart per app, not one chart for all
  check: each component has one stated purpose, and no part is unused
  violation: adding features for imagined future needs
  related:
    conflicts_with:
    - U25
    - R1
    - R2
    - U29
    - U34
    - C3
  evidence: moderate
  source_domain: aerospace (Lockheed Skunk Works), software
  sources:
  - https://grokipedia.com/page/KISS_principle
  sources_wikipedia_only: false
- id: U8
  former_id: U8
  name: Independent checker
  class: universal
  class_note: true for every system
  strength: MUST
  category: F
  if: always
  then: 'have a checker review the work, and raise the checker''s independence with the consequence of failure: self → peer → external organization'
  because: authors do not see their own errors, and shared assumptions hide shared errors
  example: required PR approval; external penetration test for high-consequence systems
  check: every change has a checker who is not the author, and the checker's independence matches the rigor matrix
  violation: the author merges their own change
  related:
    depends_on:
    - U2
  evidence: strong
  source_domain: technical drawing (checker in the title block), civil and structural (independent checking)
  sources:
  - https://eng.libretexts.org/Courses/Western_Technical_College/Inventor_Parametric_Design:_Level_1_(Bahl)/01:_Technical_Drawings/1.02:_Peer_Review_Process_and_Markup_Drawings/1.2.01:_The_Role_of_Peer_Review_in_Engineering_Design
  - https://epcland.com/checking-of-design-engineering-checklist/
  sources_wikipedia_only: false
- id: U9
  former_id: U9
  name: Versioning and change review
  class: universal
  class_note: true for every system
  strength: MUST
  category: G
  if: always
  then: version every artifact; before each change, review its technical basis, its safety impact and the procedures it affects, approve it, and inform the affected people before go-live
  because: an unknown version makes failures unreproducible, and an unreviewed change brings in unknown hazards
  example: 'GitOps: every change is a reviewed pull request; the runbook is updated in the same pull request'
  check: every change record shows basis, impact review and approval, and the deployed state matches an approved commit
  violation: a manual change in production (drift)
  related:
    strengthens:
    - U10
  evidence: strong
  source_domain: all (configuration management), chemical process safety (management of change)
  sources:
  - https://arxiv.org/pdf/1608.02836
  - https://arxiv.org/pdf/2608.11166
  - https://www.osha.gov/laws-regs/regulations/standardnumber/1910/1910.119
  sources_wikipedia_only: false
- id: U10
  former_id: U10
  name: Blameless root cause analysis
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: I
  if: a failure has happened
  then: find the root cause in the system, not a person to blame
  because: blame makes people hide information
  example: blameless postmortem with 5 Whys
  check: each failure above a set severity has a postmortem with system-level actions
  violation: '"operator error" as the final root cause'
  related:
    depends_on:
    - U9
    strengthens:
    - U11
  evidence: moderate
  source_domain: site reliability engineering
  sources:
  - https://sre.google/workbook/postmortem-culture/
  sources_wikipedia_only: false
- id: U11
  former_id: U11
  name: Plan-Do-Check-Act
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: I
  if: always
  then: repeat the cycle Plan → Do → Check → Act
  because: improvement is a cycle, not a single event
  example: retrospective after each sprint
  check: actions from earlier cycles are tracked until they are completed
  violation: the same failure happens again with no process change
  related:
    depends_on:
    - U10
    - U13
  evidence: strong
  source_domain: quality management (ISO 9001)
  sources:
  - https://isocentral.org/resources/what-is-plan-do-check-act
  sources_wikipedia_only: false
- id: U12
  former_id: U12
  name: Least privilege
  class: universal
  class_note: true for every system
  strength: MUST
  category: D
  if: always
  then: give each person, service and process only the minimum access its function needs
  because: minimum access limits the damage when one part is compromised
  example: Kubernetes RBAC scoped to one namespace
  check: no role holds a permission that was unused for a set period
  violation: a CI pipeline with cluster-admin rights
  related:
    strengthens:
    - U27
    - U29
  evidence: strong
  source_domain: security engineering (NIST)
  sources:
  - https://www.jamf.com/blog/zero-trust-vs-least-privilege/
  sources_wikipedia_only: false
- id: U13
  former_id: U13
  name: Monitoring in operation
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: H
  if: the system is in operation
  then: measure its behavior in real use, and alert on symptoms that users feel; where the output stays perfect until a sudden collapse (cliff effect), also monitor the remaining margin
  because: tests before release cannot cover all real conditions, and some systems show no symptom until they fail completely
  example: alerts on latency, traffic, errors and saturation; certificate days left, disk headroom, error budget
  check: each service has dashboards and alerts for user-facing symptoms
  violation: learning about an outage from users
  related:
    strengthens:
    - U10
    - U11
    - U18
    checks:
    - U25
    - U35
  evidence: moderate
  source_domain: site reliability engineering, broadcast (confidence monitoring)
  sources:
  - https://sre.google/sre-book/monitoring-distributed-systems/
  - https://www.tvtechnology.com/opinions/confidence-monitors
  sources_wikipedia_only: false
- id: U14
  former_id: U14
  name: Lifecycle and decommissioning
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: plan operation, maintenance and decommissioning at design time
  because: early design decisions fix most end-of-life costs
  example: define how to delete a cluster and its data before creating it
