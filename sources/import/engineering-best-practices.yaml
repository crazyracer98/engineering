  sources_wikipedia_only: false
- id: U34
  former_id: C17
  name: Compartments
  class: universal
  class_note: every system with more than one part can spread a failure; how strict the compartments are scales with the master rule
  strength: SHOULD
  category: D
  if: always
  then: divide the system into isolated compartments, so that one damaged compartment does not take down the whole system
  because: a failure that cannot spread stays small
  example: separate cloud accounts per environment, namespace quotas, cell-based architecture, bulkhead pattern
  check: a failure test in one compartment leaves all other compartments working
  violation: one shared database for all tenants and all environments
  related:
    conflicts_with:
    - U7
    strengthens:
    - R1
    - U29
  evidence: strong
  source_domain: naval architecture (watertight compartments)
  sources:
