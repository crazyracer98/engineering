  sources_wikipedia_only: true
- id: U35
  former_id: C19
  name: Response faster than harm
  class: universal
  class_note: every operated system has harms that develop over time (wear, filling, drift)
  strength: SHOULD
  category: H
  if: harm develops over time after a fault starts
  then: make sure the time to detect + alert + respond + recover is shorter than the time until harm, with a margin
  because: a response that arrives after the harm is no response
  example: an alert fires when the disk will be full in 4 h, and on-call response takes < 30 min
  check: for each main hazard, the measured detection-plus-response time is shorter than the time until harm
  violation: an alert that fires only when the disk is already full
  related:
    depends_on:
    - U13
  evidence: moderate
  source_domain: fire protection (ASET > RSET)
  sources:
  - https://fire-risk-assessment-network.com/blog/aset-rset/
  sources_wikipedia_only: false
- id: U36
  former_id: C20
  name: Isolation before work
  class: universal
  class_note: every system is maintained by people
  strength: MUST
  category: G
  if: people work on a part of the system
  then: isolate that part from all inputs and energy, and lock the isolation so that nobody can restart it unexpectedly
  because: an unexpected restart during work injures people or destroys the work
  example: cordon and drain the node; pause Argo CD auto-sync before manual maintenance
  check: each maintenance procedure starts with an isolation step and ends with a release step
  violation: auto-sync overwrites a manual fix in the middle of an incident
  related:
    strengthens:
    - U28
  evidence: strong
  source_domain: industrial safety (lockout/tagout)
  sources:
  - https://www.osha.gov/control-hazardous-energy
  sources_wikipedia_only: false
- id: U37
  former_id: C21
  name: Maintenance by failure pattern
  class: universal
  class_note: every system needs maintenance (see U14)
  strength: SHOULD
  category: H
  if: you plan maintenance
  then: 'choose the maintenance method by how each part actually fails: replace on a schedule only what wears out with age, and monitor the condition of everything else'
  because: most failures are not linked to age, so scheduled replacement does not prevent them
  example: rotate certificates on a schedule (age-related); alert on disk usage (condition-based); no "just in case" pod restarts
  check: each maintenance task states which failure pattern it addresses
  violation: scheduled restarts that hide a memory leak
  related:
    depends_on:
    - U6
    - U13
  evidence: moderate
  source_domain: aviation maintenance (RCM)
  sources:
  - https://en.wikipedia.org/wiki/Reliability-centered_maintenance
  sources_wikipedia_only: true
- id: U38
  former_id: C22
  name: Accumulated degradation
  class: universal
  class_note: every system that is used more than once degrades over time
  strength: SHOULD
  category: C
  if: always
  then: design for the damage that builds up over the whole design life, not only for the single largest load
  because: repeated loads far below the maximum load cause failure, and the damage does not recover
  example: soak tests over days, not only peak tests; disk wear; leaks that grow with uptime
  check: an endurance (soak) test runs for a period that represents real use, and the growth of leaks, wear or fragmentation is measured
  violation: only a short peak test, then failure after weeks of normal load
  related:
    depends_on:
    - U6
    strengthens:
    - U37
  evidence: moderate
  source_domain: materials, mechanical, piping (fatigue, corrosion allowance)
  sources:
  - https://en.wikipedia.org/wiki/Fatigue_(material)
  - https://www.wermac.org/materials/corrosion_allowance.html
  sources_wikipedia_only: false
- id: U39
  former_id: C28
  name: Critical path
  class: universal
  class_note: every project has tasks that depend on each other
  strength: SHOULD
  category: G
  if: work consists of tasks that depend on each other
  then: identify the longest chain of dependent tasks (critical path) and protect it first
  because: a delay on the critical path delays everything; other tasks have slack
  example: in a cluster migration, data sync and DNS cutover are critical; documentation has slack
  check: each multi-step project plan marks its critical path and the slack of the other tasks
  violation: speeding up tasks that have slack while the critical path slips
  related:
    strengthens:
    - U19
  evidence: moderate
  source_domain: construction management (critical path method)
  sources:
  - https://en.wikipedia.org/wiki/Critical_path_method
  sources_wikipedia_only: true
- id: U40
  former_id: C31
  name: Comparable measurement
  class: universal
  class_note: every engineering decision uses measurements
  strength: SHOULD
  category: F
  if: measurements are used to compare or decide
  then: measure under stated, controlled reference conditions, report the uncertainty with every result, and calibrate instruments regularly against traceable references
  because: uncontrolled conditions change results, and a result without its uncertainty is incomplete
  example: benchmarks on the same instance type with fixed load and warm-up; report the spread over several runs
  check: each benchmark or test report states its reference conditions and the spread or uncertainty of the result
  violation: comparing two single benchmark runs from different machines
  related:
    strengthens:
    - U31
    - U17
  evidence: strong
  evidence_note: standardized in ISO 139 and the GUM
  source_domain: textile testing (ISO 139), metrology (GUM, traceability)
  sources:
  - https://cdn.standards.iteh.ai/samples/35179/19d75d1dcdd147d4b630728954acc86d/ISO-139-2005.pdf
  - https://chiuvention.com/blog/why-fabric-test-results-vary-with-weather-solved-by-a-temperature-and-humidity-chamber
  - https://en.wikipedia.org/wiki/Measurement_uncertainty
  - https://en.wikipedia.org/wiki/Metrological_traceability
  sources_wikipedia_only: false
- id: U41
  former_id: C32
  name: Actionable alerts
  class: universal
  class_note: every operated system is monitored (U13), and monitoring raises alerts
  strength: SHOULD
  category: H
  if: a system raises alerts to people
  then: make every alert actionable, and remove or change alerts that nobody acts on
  because: many non-actionable alerts make people ignore all alerts, including the important ones (alert fatigue)
  example: page only on symptoms that need action now; review alert noise every month
  check: each alert has an owner and a runbook action, and the share of alerts with no action is measured and kept low
  violation: an alert channel with hundreds of messages per day that nobody reads
  related:
    strengthens:
    - U13
    - U18
    - U35
  evidence: moderate
  source_domain: clinical engineering, rail dispatch (alarm fatigue)
