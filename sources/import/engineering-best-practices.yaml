- id: U30
  former_id: C12
  name: Robustness
  class: universal
  class_note: every system meets variation in its inputs
  strength: SHOULD
  category: C
  if: always
  then: design so that the result changes little when inputs vary (robustness)
  because: removing every cause of variation costs more than tolerating it
  example: retries with jitter, idempotent operations, tolerance for clock drift
  check: tests with varied inputs (latency, clock drift, message order) show stable results
  violation: a system that works only when timing is exact
