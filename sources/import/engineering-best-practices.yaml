- id: R2
  former_id: C3
  name: Diversity
  class: risk-scaled
  class_note: only where redundancy is required and a common cause is credible
  strength: SHOULD
  category: E
  if: one cause can hit all copies at once
  then: make the copies different (diversity)
  because: identical copies fail together
  example: two different DNS providers
  check: the shared dependencies of redundant copies are listed, and each one is justified
  violation: all replicas depend on the same expiring certificate
  related:
