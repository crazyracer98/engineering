- id: U18
  former_id: U18
  name: Investigate anomalies
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: I
  if: the system behaves differently from what was expected, even if nobody was harmed
  then: record the anomaly and investigate it before you accept it as normal
  because: ignored warning signs come before major accidents
  example: a flaky test, or an alert that everyone silences
  check: 'each anomaly has a ticket with a decision: fix it, or accept it with a written reason'
