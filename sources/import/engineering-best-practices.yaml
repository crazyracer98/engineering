  sources_wikipedia_only: false
- id: R3
  former_id: C7
  name: Traceability
  class: risk-scaled
  class_note: required by safety standards for safety-critical or regulated systems; costly elsewhere
  strength: MUST
  category: F
  if: the system is safety-critical or regulated
  then: link every requirement in both directions to design and test
  because: standards require proof of complete coverage
  example: requirement ↔ code ↔ test ID in the ticket system
  check: a traceability report shows no requirement without a test and no test without a requirement
  violation: tests that link to no requirement
  related:
