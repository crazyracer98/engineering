- id: U23
  former_id: U23
  name: Preserve evidence
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: I
  if: a failure has happened
  then: document and preserve the as-found state before you repair or restart anything, and record who handled the evidence (chain of custody)
  because: a repair destroys the evidence needed to find the cause
  example: capture logs, heap dump and disk snapshot before restarting a pod or rolling back
  check: each incident record lists the evidence captured before the first repair action
  violation: restarting the service first and finding no logs afterwards
  related:
