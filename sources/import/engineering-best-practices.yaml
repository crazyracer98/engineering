  sources_wikipedia_only: false
- id: U31
  former_id: C13
  name: Model validity
  class: universal
  class_note: every design decision rests on a model or an estimate
  strength: SHOULD
  category: B
  if: a decision depends on a model, simulation or estimate
  then: validate the model for its intended use, use it only inside the range it was validated for (domain of applicability), and check each result against an independent rough estimate (order of magnitude)
  because: a model is only trustworthy inside its validated range
  example: a load test on 3 nodes does not prove behavior on 50 nodes
  check: each model used for a decision states its validated range, and the decision lies inside that range
  violation: extrapolating a benchmark far beyond the tested load
  related:
    depends_on:
    - U4
    strengthens:
    - U25
  evidence: moderate
  source_domain: simulation and computational engineering, engineering physics (Fermi estimates)
