# Engineering Best Practices — machine-readable version.
# Same IDs and wording as engineering-best-practices.md (version 6, 2026-10-14).

meta:
  title: Engineering Best Practices — Cross-Domain Taxonomy
  version: '6'
  date: '2026-10-14'
  master_rule:
    scale: Scale the rigor of every rule to (consequence of failure) × (uncertainty).
    alarp: Keep reducing risk until the cost of the next reduction is grossly disproportionate to the benefit (ALARP).
    risk_regions:
      unacceptable: risk must be reduced, whatever the cost
      tolerable: reduce risk while it is reasonably practicable (ALARP)
      negligible: no further reduction is required
    sources:
    - https://www.primatech.com/technical/alarp-principle
  sentence_structure: IF [condition], THEN [action], BECAUSE [reason].
  id_prefixes:
    U: 'universal: condition true or trigger occurs in every engineered system; strictness scaled by the master rule'
    R: 'risk-scaled: applies only above a consequence or uncertainty threshold (rigor matrix)'
    C: 'conditional: applies only when the system has a property that a common class of systems lacks'
    K: 'conflict rule: decides between two rules that pull in opposite directions'
  classification_test: Is there a common class of engineered systems in which this condition can never be true during the whole life cycle? No -> U (or R if only the strength of the need varies with risk). Yes -> C.
  applicability_note: The test asks whether a rule can apply, not whether a domain already practices it. A missing practice is an adoption gap, not a counterexample.
  quick_view_questions:
    A: Who can be harmed, is the work within our competence, and who can stop it?
    B: Are requirements measurable, decisions recorded, and models, data and evidence trustworthy?
    C: How can each part fail or interact badly, and is the design as simple as the requirements allow?
    D: Is the hazard removed at the source, and if not, which independent controls contain it?
    E: How much margin is there, and what happens when the load exceeds the capacity?
    F: Who checked the work, and was it tested the way it will be operated?
    G: Is each change reviewed, made in small steps, and isolated from the people working on it?
    H: Will we notice a problem before harm, and can people act on what they see?
    I: Do we preserve evidence, investigate anomalies, and change the system afterwards?
  strength_keywords:
    MUST: required; not following it is a violation; applies whenever its IF-condition is true
    SHOULD: expected; not following it requires a written reason
  relation_types:
    depends_on: this rule needs the other rule to work
    strengthens: this rule makes the other rule more effective
    strengthened_by: the other rule makes this rule more effective (inverse of strengthens)
    conflicts_with: following both rules fully pulls in opposite directions; see conflict_rules
    checks: this rule provides the check for the other rule
    checked_by: the other rule provides the check for this rule (inverse of checks)
    scaled_by: the other rule sets how strictly this rule is applied
  evidence_levels:
    strong: required by a standard, code, regulation or professional body
    moderate: widespread practice with published guidance
    weak: mostly anecdotal
