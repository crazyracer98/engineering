- id: U26
  former_id: C4
  name: Fail-safe
  class: universal
  class_note: every part can fail ("everything fails all the time")
  strength: MUST
  category: D
  if: always
  then: 'define a safe state, and design failure to move there (fail-safe; opposite: fail-dangerous)'
  because: an uncontrolled failure causes the most harm
  example: 'admission webhook rejects requests when it errors (fail-closed; opposite: fail-open)'
  check: failure injection shows that the system reaches the defined safe state
  violation: undefined behavior when a dependency is lost
