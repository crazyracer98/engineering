- id: U27
  former_id: C5
  name: Hierarchy of controls
  class: universal
  class_note: every system has risks; the trigger occurs in every life cycle
  strength: SHOULD
  category: D
  if: a risk is found
  then: 'use the highest possible control level: 1 eliminate; 2 minimize, substitute or moderate; 3 engineering control; 4 administrative control; 5 protective equipment; and act first at the source, then along the path, then at the receiver'
  because: higher control levels do not depend on human behavior, and a cause removed at the source cannot spread
  example: '1 remove the port → 2 store less data / safer library / lower rate limit → 3 policy engine → 4 runbook → 5 "be careful"; noisy neighbor: limit the source → separate node pool → client timeouts'
  check: for each risk, a record states why a higher control level, or a control closer to the source, was not possible
  violation: a warning in the README as the only control
  related:
    strengthens:
    - U28
    depends_on:
    - U14
  evidence: strong
  source_domain: occupational and chemical process safety (NIOSH, Kletz), acoustic engineering (source-path-receiver)
