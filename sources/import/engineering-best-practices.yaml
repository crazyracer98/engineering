- id: U28
  former_id: C6
  name: Error-proofing
  class: universal
  class_note: every system is built, operated or maintained by people
  strength: SHOULD
  category: D
  if: a person can make the same error repeatedly
  then: make the error impossible; if that is not possible, make the error visible immediately; if that is not possible either, limit its consequence so that it is survivable
  because: errors are certain, defects are not
  example: branch protection and required CI checks (impossible); a dry-run diff (visible); soft delete with a restore window (survivable)
  check: each repeated error from postmortems has a technical guard at the highest possible level
  violation: a "please remember to..." announcement as the only fix
