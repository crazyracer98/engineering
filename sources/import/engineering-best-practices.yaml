- id: U32
  former_id: C15
  name: Checklists
  class: universal
  class_note: every system has rare or critical procedures (restore, upgrade, decommissioning)
  strength: SHOULD
  category: H
  if: a critical procedure is rare, complex or done under time pressure
  then: use a short checklist, and confirm each item by pointing at it and saying its status aloud
  because: memory fails under stress
  example: cluster upgrade checklist, incident commander checklist; read out cluster context and namespace before each destructive command
  check: each critical procedure has a checklist that is used and is updated after postmortems
  violation: an upgrade done from memory
  related:
    strengthens:
