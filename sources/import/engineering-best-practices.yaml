  sources_wikipedia_only: false
- id: C1
  former_id: C9
  name: Codes as minimum
  class: conditional
  class_note: 'counterexample: novel technology for which no code exists yet'
  strength: MUST
  category: F
  if: a code or standard exists
  then: meet it as the minimum, then apply the other rules
  because: a code is a minimum, not a maximum
  example: CIS Benchmark for Kubernetes
  check: a compliance scan passes
  violation: treating compliance as proof of safety
  related:
    depends_on:
    - U2
