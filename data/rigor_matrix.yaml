# Rigor matrix: which rules apply in which cell.
# Schema: schema/rigor_matrix.schema.json. data/ is the single source of truth (ADR 0003);
# seeded once by sources/import/import_v9.py from edition 9.
- consequence: low
  uncertainty: low
  apply:
  - all U-rules
  - C-rules whose condition is true
  checker_level: peer
- consequence: low
  uncertainty: high
  apply:
  - all U-rules
  - C-rules whose condition is true
  - R4
  - R7
  - R8
  checker_level: peer
- consequence: high
  uncertainty: low
  apply:
  - all U-rules
  - C-rules whose condition is true
  - R1
  - R2
  - R3
  - R6
  - R9
  checker_level: external
- consequence: high
  uncertainty: high
  apply:
  - all U-rules
  - C-rules whose condition is true
  - all R-rules
  checker_level: external
