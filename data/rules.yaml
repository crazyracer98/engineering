- id: P42
  name: Two-person rule
  class: risk-scaled
  class_note: only for critical, irreversible actions; the cost is a second person who must be available
  strength: SHOULD
  category: D
  if: an action is critical and cannot be undone
  then: require two authorized people at the moment of action (two-person rule)
  because: one person can make an error or act with bad intent, and nobody stops it
  example: break-glass production access and deletion of production data need a second approver, live
  check: the system enforces a second approval for each listed critical action
  violation: one administrator can delete the production database alone
  related:
    depends_on:
    - P36
    strengthens:
    - P56
    strengthened_by:
    - P18
    - P43
  evidence: strong
  evidence_note: NIST SP 800-53 control AC-3(2) "Dual Authorization"
  source_domain: nuclear, banking, aviation (two-person rule)
  notes: null
  sources:
  - nist-sp-800-53-ac-3-2
  - wikipedia-two-man-rule
  management:
    name: Two-person rule
    form_name: Four-eyes principle at the moment of action
    form: require two authorized people for critical, irreversible management actions (large payments, contract signature, dismissal)
    example: a payment above a threshold needs two signatures
    sources:
    - nist-csrc-glossary-separation-duty
    source_titles:
      nist-csrc-glossary-separation-duty: 'NIST: separation of duty'
    sources_text: '[@nist-csrc-glossary-separation-duty] (supports); see P43'
