- id: P79
  name: Span of control
  class: conditional
  class_note: 'counterexample: a system operated by one person or by fully automated control'
  strength: SHOULD
  category: H
  if: one person directs other people during operation (incident, cutover, commissioning)
  then: 'keep the number of people one person directs in a manageable range (guideline: about five), and add group leads above that'
  because: a person can coordinate only a limited number of people, and an overloaded coordinator misses actions
  example: an incident commander with 12 responders appoints two group leads (communication, mitigation)
  check: each incident record lists the roles and the number of people each lead directed; values above the guideline have a reason
  violation: one incident commander directly coordinating 20 people in one channel
  related:
    strengthens:
    - P30
    - P71
    - P76
