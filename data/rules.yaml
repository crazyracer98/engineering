    sources_text: '[@little-littles-law-as-viewed] (with P52)'
    evidence: strong
    evidence_note: null
- id: P45
  name: Redundancy (N-1)
  class: risk-scaled
  class_note: only where the function must survive single failures; a system that may stop briefly (a development environment) does not need it
  strength: SHOULD
  category: E
  if: one failure must not stop the function
  then: add redundancy, so that the function survives the loss of any single element (N-1), and make sure each copy and the switch-over mechanism are reliable enough for the redundancy to help
  because: one copy is a single point of failure
  example: nodes in several availability zones
  check: removing any single element in a test keeps the function running
  violation: a single replica of a critical service
  related:
    strengthened_by:
    - P22
    - P34
    - P41
    - P46
    conflicts_with:
    - P23
    - P53
  related_text: strengthened by P22, P41, P46, P34; conflicts with P23; conflicts with P53 when people are added for redundancy (add early, not late)
  evidence: strong
  evidence_note: N-1 ignores how likely an outage is and how large the affected area is; use the master rule for those. Error correction helps only when component error rates are below a threshold (quantum threshold theorem)
  source_domain: aerospace, electronics, power grids, quantum engineering, computing theory (von Neumann)
  notes: null
  sources:
  - uspto-materials-based-failure-analysis
  - ucsd-lectures-von-neumanns-probabilistic
  - sciencedirect-fail-safe-design
  - sintef-n-1-isnt-always
  - wikipedia-quantum-error-correction
  management:
    name: Redundancy (N-1)
    form_name: Deputies and succession
    form: 'make every critical function survive the loss of one person: named deputy, trained successor, documented knowledge'
    example: each on-call skill is held by at least two people
    sources:
    - iso-tc-260-people-power
    source_titles:
      iso-tc-260-people-power: ISO/TS 30433 succession metrics (via ISO TC 260)
    evidence: moderate
    evidence_note: null
- id: P46
  name: Diversity
  class: risk-scaled
  class_note: only where redundancy is required and a common cause is credible
  strength: SHOULD
  category: E
  if: one cause can hit all copies at once
  then: make the copies different (diversity)
  because: identical copies fail together
  example: two different DNS providers
  check: the shared dependencies of redundant copies are listed, and each one is justified
  violation: all replicas depend on the same expiring certificate
  related:
