- id: P24
  name: Lifecycle and decommissioning
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: plan operation, maintenance and decommissioning at design time
  because: early design decisions fix most end-of-life costs
  example: define how to delete a cluster and its data before creating it
  check: each design document has a maintenance and a decommissioning section
  violation: orphaned resources that nobody can safely remove
