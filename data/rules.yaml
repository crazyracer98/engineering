  source_domain: management (internal control), security engineering
  notes: null
  sources:
  - nist-csrc-glossary-separation-duty
  management: null
- id: P44
  name: Margin
  class: universal
  class_note: every system has uncertain loads and inputs ("all models are wrong"); the size of the margin scales with the master rule
  strength: SHOULD
  category: E
  if: always
  then: 'design capacity above the expected load (margin), state the design load as a probability per time period, keep queued resources well below 100 % utilization, and set the margin by design maturity: larger early, smaller as uncertainty falls'
  because: real load exceeds estimated load, and delay rises sharply as utilization approaches 100 %
  example: capacity for the 1-in-100-day traffic peak plus 30 % headroom; worker pools sized for \< 70 % average utilization
  check: a load test shows capacity ≥ the stated design load × the chosen factor, and queue delay stays within the target at that load
  violation: sizing exactly to the average load
  related:
    strengthened_by:
    - P12
    - P22
    - P27
    - P49
    - P50
    - P52
    conflicts_with:
    - P23
    checked_by:
    - P70
  evidence: strong
  evidence_note: the phase values of GSFC-STD-1000 come from a garbled table extraction; check the original before quoting them
  source_domain: mechanical, civil, coastal (factor of safety, return period), operations research (queueing), space systems (margins by phase), electronics (derating)
  notes: null
