- id: P47
  name: Graceful degradation
  class: conditional
  class_note: 'counterexample: a system with a fixed, known load (an embedded controller)'
  strength: SHOULD
  category: E
  if: demand can exceed capacity
  then: 'define in advance which lower-priority functions switch off first, so that critical functions keep running (graceful degradation; opposite: cascading failure)'
  because: uncontrolled overload makes the whole system collapse
  example: PriorityClasses with preemption, rate limiting, switching off recommendations to keep checkout running
  check: an overload test shows that low-priority functions stop first and critical functions keep running
  violation: all functions slow down together until everything fails
  related:
    depends_on:
    - P44
    strengthened_by:
    - P48
    conflicts_with:
    - P23
  evidence: moderate
  evidence_note: null
  source_domain: power grids (load shedding)
  counterexample: a system with a fixed, known load (an embedded controller)
  notes: null
  sources:
  - nerc-prc-006-5-automatic
  - wikipedia-load-shedding
  management:
    name: Graceful degradation
    form_name: Prioritization and triage under overload
    form: decide in advance which work stops first when demand exceeds capacity, and which activities must resume at a minimum capacity
    example: under overload, feature requests stop first; incident response and security patches continue
    sources:
    - bci-good-practice-guidelines-2018
    source_titles:
      bci-good-practice-guidelines-2018: ISO 22301:2019 RTO definition (via BCI GPG)
    evidence: strong
    evidence_note: null
- id: P48
  name: Damping
  class: conditional
  class_note: 'counterexample: a system without automatic control loops'
  strength: SHOULD
  category: E
  if: a control loop reacts automatically to measurements
  then: 'add a deadband, delay or cooldown, so that the loop does not switch back and forth (oscillation; opposite: stable control)'
  because: repeated on-off cycles waste resources and destabilize the system
  example: HPA stabilization window; failover hysteresis; circuit breaker cooldown
  check: each automatic control loop has a documented deadband, delay or cooldown, and a test shows no repeated switching
  violation: an autoscaler that scales up and down every minute
  related:
    depends_on:
    - P70
    strengthens:
    - P47
    strengthened_by:
    - P51
  evidence: moderate
  evidence_note: null
  source_domain: control engineering
  counterexample: a system without automatic control loops
  notes: null
  sources:
  - astrom-murray-feedback-systems-section
  - wikipedia-deadband
  management:
    name: Damping
    form_name: Stable management cadence
    form: change priorities, structures and plans on a fixed cadence, not on every new signal
    example: priorities change at sprint boundaries, not daily
    sources:
    - scrum-guide
    source_titles:
      scrum-guide: 'Scrum Guide: "No changes are made that would endanger the Sprint Goal"'
    evidence: moderate
    evidence_note: null
- id: P49
  name: Induced demand
  class: conditional
  class_note: 'counterexample: a system without a shared, congested resource'
  strength: SHOULD
  category: E
  if: you add capacity to relieve congestion
  then: expect demand to grow into the new capacity, and also manage demand (quotas, priorities, pricing)
  because: added capacity lowers the cost of use, which increases use
  example: a larger cluster fills up again; faster CI leads to more CI runs
  check: each capacity increase comes with a forecast of demand growth and a demand control (quota, priority or price)
  violation: doubling the cluster size and being full again a month later
  related:
    depends_on:
    - P70
    strengthens:
    - P3
    - P44
    strengthened_by:
    - P51
  evidence: moderate
  evidence_note: null
  source_domain: transportation (induced demand)
  counterexample: a system without a shared, congested resource
  notes: null
  sources:
  - duranton-turner-fundamental-law-road
  - wikipedia-induced-demand
  management:
    name: Induced demand
    form_name: Parkinson's law
    form: expect work and spending to grow into added time or budget; manage demand as well as capacity
    example: a larger budget is given with an explicit scope, not "more of the same"
    sources:
    - parkinson-parkinsons-law
    source_titles:
      parkinson-parkinsons-law: Parkinson 1955 (text copy)
    evidence: moderate
    evidence_note: the original is a satirical essay; the general claim is weak, the budget case is widely observed
- id: P50
  name: Bottleneck first
  class: conditional
  class_note: 'counterexample: a system without a throughput goal (a monument)'
  strength: SHOULD
  category: E
  if: you want more throughput
  then: find the constraint (bottleneck) and improve it first
  because: improving other parts does not increase output
  example: speeding up lint does nothing if integration tests or the review queue are the bottleneck
  check: before an improvement for throughput, the current constraint is measured and named
  violation: optimizing a fast step while work piles up in front of a slow step
  related:
    depends_on:
    - P70
    strengthens:
    - P44
    strengthened_by:
    - P52
  evidence: moderate
  evidence_note: null
  source_domain: industrial engineering (theory of constraints)
  counterexample: a system without a throughput goal (a monument)
  notes: null
  sources:
  - theory-constraints-institute-five-focusing
  - wikipedia-theory-constraints
  management:
    name: Bottleneck first
    form_name: Constraint first
    form: find the step that limits output (often an approval, a meeting or a specialist) and improve it first
    example: the security review queue is the constraint, so review capacity is added there first
    sources: []
    sources_text: section 9 (theory of constraints)
    evidence: moderate
    evidence_note: null
- id: P51
  name: Shared demand signal
  class: conditional
  class_note: 'counterexample: a single-stage system'
  strength: SHOULD
  category: E
  if: several stages pass demand signals along a chain
  then: share the real end demand with every stage, instead of letting each stage react only to the stage below it
  because: each stage amplifies the variation it sees, so swings grow upstream (bullwhip effect)
  example: upstream services scale on front-end traffic, not only on their own delayed queue length
  check: each stage in a chain can see the end demand signal
  violation: each service autoscaler reacts only to its own queue, and the swings grow along the chain
  related:
    depends_on:
    - P70
    strengthens:
    - P48
    - P49
  evidence: moderate
  evidence_note: null
  source_domain: supply chain engineering (bullwhip effect)
  counterexample: a single-stage system
  notes: null
  sources:
  - mit-sloan-management-review-bullwhip
  - lee-padmanabhan-whang-information-distortion
  - wikipedia-bullwhip-effect
  management:
    name: Shared demand signal
    form_name: Share real end demand
    form: give every stage of a chain the real end demand, not only the order of the next stage
    example: the platform team sees product teams' roadmaps, not only tickets
    sources:
    - lee-padmanabhan-whang-information-distortion
    source_titles:
      lee-padmanabhan-whang-information-distortion: Lee, Padmanabhan, Whang 1997
    evidence: strong
    evidence_note: null
- id: P52
  name: Limit work in progress
  class: universal
  class_note: every system that is built, changed or operated has a flow of work (changes, tickets, requests)
  strength: SHOULD
  category: E
  if: a team or system handles a flow of work items
  then: set a limit on the number of items in progress, and finish items before starting new ones
  because: at a given throughput, average lead time is proportional to average work in progress (Little's law), so more parallel work means longer waiting for every item
  example: at most 4 epics in progress per team; at most N concurrent rollouts per cluster
  check: a visible WIP limit exists, and lead time and WIP are tracked
  violation: everything is "in progress" and nothing is finished
  related:
    depends_on:
    - P70
    strengthens:
    - P44
    - P50
  evidence: strong
  evidence_note: null
  evidence_text: strong for the relation (mathematical theorem); moderate for the practice
  source_domain: management (operations management, queueing theory)
  notes: null
  sources:
  - little-littles-law-as-viewed
  management: null
- id: P53
  name: Late work and added people
  class: conditional
  class_note: 'counterexample: work that can be split into independent parts without communication (for example harvesting a field)'
  strength: SHOULD
  category: E
  if: work is late, and it needs coordination and learning
  then: do not expect added people to recover the schedule soon; cut or move scope first, and add people early, only where the work can be split
  because: new people need training and add communication paths, which at first lowers the output of the existing team (Brooks's law)
  example: two weeks before a cluster-migration deadline, scope is cut; new engineers join the next migration from its start
  check: before people are added to late work, a record states the expected training and coordination cost
  violation: adding five engineers to a migration two weeks before its deadline
  related:
    strengthens:
    - P67
    conflicts_with:
    - P45
  related_text: strengthens P67; conflicts with P45 when people are added for redundancy (add early, not late)
  evidence: moderate
  evidence_note: null
  evidence_text: moderate; **secondary only** (the book is not online; Brooks himself calls the law an outrageous oversimplification)
  source_domain: management (software project management)
  counterexample: work that can be split into independent parts without communication (for example harvesting a field)
  notes: null
  sources:
  - reinertsen-always-bad-idea-add
  - jargon-file-brookss-law
  management: null
- id: P54
  name: Verification and validation
  class: universal
  class_note: true for every system
  strength: MUST
  category: F
  if: always
  then: do verification AND validation, and before handover test that all parts work together against the owner's requirements (commissioning)
  because: passing one does not mean passing the other, and parts that pass alone can fail together
  example: CI tests pass = verification; user acceptance = validation; end-to-end test of a new platform with DNS, certificates, monitoring and backup
  check: both a test result and a stakeholder acceptance exist
  violation: declaring the work done because tests pass
  related:
    depends_on:
    - P9
    strengthened_by:
    - P9
    - P26
  evidence: strong
  evidence_note: null
  source_domain: systems engineering, building services (commissioning)
  notes: null
  sources:
