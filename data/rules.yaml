  - fema-national-incident-management-system
  - wikipedia-kinematic-coupling
  management:
    name: Exact constraint
    form_name: Single point of accountability, unity of command
    form: give each objective, decision, risk and process exactly one accountable owner; each person reports to one person for a given task
    example: one product owner per backlog; one incident commander per incident
    sources:
    - fema-national-incident-management-system
    - purple-griffon-prince2-7th-edition
    source_titles:
      fema-national-incident-management-system: 'NIMS: "Unity of command means that each individual only reports to one person."'
