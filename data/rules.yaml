# The 83 rules (P1-P83, numbered in category order), in ID order. The class
# (universal, risk-scaled, conditional) is the `class` field.
# Schema: schema/rules.schema.json. data/ is the single source of truth (ADR 0003);
# seeded once by sources/import/import_v9.py from edition 9.
- id: P1
  name: Public safety first
  class: universal
  class_note: true for every system
  strength: MUST
  category: A
  if: always
  then: put public safety above cost, schedule and convenience
  because: failures harm people outside the project
  example: block a release that leaks user data
  check: every release gate contains a safety and security sign-off item
  violation: shipping a known safety defect to meet a deadline
  related:
    strengthens:
    - P37
    - P38
    strengthened_by:
    - P4
  evidence: strong
  evidence_note: null
  source_domain: all (professional ethics)
  notes: null
  sources:
  - nspe-ethics-reference-guide
  management:
    name: Public safety first
    form_name: Duty of care and ethics first
    form: put the safety, health and legal rights of people (customers, the public, the own people) above cost, schedule and convenience
    example: the manager stops a launch that would process personal data without a legal basis
    sources:
    - iso-9001-2026-launch
    - iso-45001-2018
    source_titles:
      iso-9001-2026-launch: 'ISO 9001:2026 launch: "ethical behaviour"'
      iso-45001-2018: ISO 45001:2018
    evidence: strong
    evidence_note: null
- id: P2
  name: Work within competence
  class: universal
  class_note: true for every system
  strength: MUST
  category: A
  if: always
  then: work only within your competence, and involve an expert outside it
  because: error rates rise outside known areas
  example: a security engineer reviews an IAM design
  check: each design has a named checker with expertise in its domain
  violation: approving work in a domain you do not know
  related:
    strengthens:
    - P56
    strengthened_by:
    - P6
    - P62
  evidence: strong
  evidence_note: null
  source_domain: all (professional ethics)
  notes: null
  sources:
  - nspe-ethics-reference-guide
  management:
    name: Work within competence
    form_name: Competence management
    form: give work only to people competent for it, and train them or add an expert otherwise
    example: a team lead without labour-law knowledge asks HR before changing on-call rules
    sources:
    - coso-erm-integrating-strategy-performance
    - us-army-adp-6-0
    source_titles:
      coso-erm-integrating-strategy-performance: COSO ERM principle 5
      us-army-adp-6-0: 'ADP 6-0: principle "Competence"'
    evidence: strong
    evidence_note: null
- id: P3
  name: Sustainability
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: A
  if: always
  then: reduce environmental impact and resource use across the whole lifecycle
  because: NSPE canon 1 includes sustainable development
  example: scale idle environments to zero
  check: resource use is measured and reviewed
  violation: unused resources running all the time
  related:
    depends_on:
    - P24
    strengthened_by:
    - P24
    - P49
  evidence: moderate
  evidence_note: null
  source_domain: all (professional ethics)
  notes: null
  sources:
  - nspe-sustainability-pes-obligations
  management:
    name: Sustainability
    form_name: Environmental and social sustainability
    form: include environmental and social impact in decisions across the whole life cycle, including procurement
    example: cloud cost and energy reports reviewed with the budget
    sources:
    - iso-14001-2015-withdrawn-replaced
    - iso-20400-2017-sustainable-procurement
    - pmi-pmbok-guide-8th-edition
    source_titles:
      iso-14001-2015-withdrawn-replaced: ISO 14001:2026 (via 2015 page)
      iso-20400-2017-sustainable-procurement: ISO 20400:2017
      pmi-pmbok-guide-8th-edition: 'PMBOK 8: "integrate sustainability"'
    evidence: strong
    evidence_note: standard text is paid; only the official summary was read
- id: P4
  name: Stop authority
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: A
  if: anyone finds a problem that could cause harm
  then: let that person stop the work without needing permission and without being blamed; the stop must always be available, must override all other functions, and resetting it must not restart the system
  because: the person nearest to a problem sees it first
  example: a deploy freeze that overrides Argo CD auto-sync; lifting the freeze requires an explicit sync
  check: the stop mechanism exists, works in every operating mode, does not restart on reset, and every use is reviewed without blame
  violation: a release continues while a known problem is still being discussed
  related:
    depends_on:
    - P80
    strengthens:
    - P1
    - P82
    strengthened_by:
    - P5
  evidence: strong
  evidence_note: emergency stop is standardized in ISO 13850
  source_domain: manufacturing (Toyota andon), machinery (emergency stop)
  notes: null
  sources:
  - iso-13850-2015-emergency-stop
  - directive-2019-1937
  - wikipedia-andon
  management:
    name: Stop authority
    form_name: Speak-up and stop-the-line
    form: let every person raise a concern or stop work without permission and without retaliation; provide a confidential reporting channel and follow up every report
    example: any engineer may pause a release; an anonymous channel exists for legal and ethical concerns
    sources:
    - directive-2019-1937
    - deming-14-points
    - toyota-production-system
    source_titles:
      directive-2019-1937: Directive (EU) 2019/1937, Art. 8(3) and recital 88
      deming-14-points: Deming point 8
      toyota-production-system: 'Toyota: jidoka'
    evidence: strong
    evidence_note: 'EU law: internal channels required for private entities with 50 or more workers'
- id: P5
  name: Psychological safety
  class: universal
  class_note: every system is built or operated by people who work together
  strength: SHOULD
  category: A
  if: people work together on a system
  then: 'make it safe to report errors, ask questions and disagree: leaders ask for input, thank people for bad news, and never punish an honest report'
  because: psychological safety enables learning behavior, which drives team performance; problems that people hide cannot be fixed
  example: the first person to report a broken pipeline is thanked, not blamed; the team lead names their own mistake in the retrospective
  check: a regular anonymous survey item on safety to speak up; the number of reported near misses does not fall after an incident
  violation: punishing the person who reported a problem
  related:
    strengthens:
    - P4
    - P80
    - P82
    strengthened_by:
    - P63
  related_text: strengthens P80, P82, P4; strengthened by P63; conflicts with accountability (see K7)
  evidence: strong
  evidence_note: peer-reviewed field study; Google study of 180 teams
  source_domain: management (team leadership)
  notes: null
  sources:
  - edmondson-psychological-safety-learning-behavior
  - google-re-work-understand-team
  management: null
- id: P6
  name: Conflict-of-interest disclosure
  class: universal
  class_note: trigger that occurs in the life cycle of every system (every system has suppliers, reviewers and decision-makers)
  strength: MUST
  category: A
  if: a person decides on, reviews or advises on work in which they have a personal interest
  then: disclose the interest and step out of the decision or review
  because: a personal interest biases judgment and destroys trust in the decision
  example: an engineer who holds shares in a monitoring vendor leaves its evaluation
  check: a register of declared interests exists and is checked before each vendor selection, design review and approval
  violation: a reviewer approves a design that uses a product of a company they own
  related:
    strengthens:
    - P2
    - P43
    - P56
  evidence: strong
  evidence_note: NSPE Code of Ethics II.4.a; G20/OECD Principles II.F.2
  source_domain: professional ethics, management (corporate governance)
  notes: null
  sources:
  - nspe-ethics-reference-guide
  - g20-oecd-principles-corporate-governance
  management: null
- id: P7
  name: Commander's intent
  class: universal
  class_note: every engineering organization delegates work
  strength: SHOULD
  category: A
  if: you delegate a task
  then: state the purpose, the desired end state and the constraints, and leave the method to the people who do the work (mission orders)
  because: plans meet changing conditions; people who know the purpose can act correctly without new orders
  example: an epic states "why", "done when" and "must not", not a list of kubectl steps
  check: each delegated task or epic states purpose, end state and constraints
  violation: a step list with no purpose; work stops when the plan no longer fits
  related:
    depends_on:
    - P2
    conflicts_with:
    - P61
    - P71
    - P72
  related_text: depends on P2; conflicts with P71, P72, P61 (see K6)
  evidence: strong
  evidence_note: US Army doctrine ADP 6-0
  source_domain: management (military command and control)
  notes: null
  sources:
  - us-army-adp-6-0
  management: null
- id: P8
  name: Fair process
  class: universal
  class_note: every engineering organization makes decisions that affect people
  strength: SHOULD
  category: A
  if: a decision affects people
  then: engage them (ask for input and challenge), explain the final decision and its reasons, and state the new expectations clearly; this is not consensus
  because: people accept and carry out decisions they disagree with when the process was fair
  example: before changing the on-call model, the team is asked, then told the decision, the reasons and the new rules
  check: "for each decision that changes people's work: an input round, a written explanation and stated expectations exist"
  violation: announcing a reorganization without reasons
  related:
    strengthens:
    - P64
    - P69
  evidence: moderate
  evidence_note: management research; practitioner article
  source_domain: management (organizational justice)
  notes: null
  sources:
  - kim-mauborgne-fair-process
  management: null
- id: P9
  name: Measurable requirements
  class: universal
  class_note: true for every system
  strength: MUST
  category: B
  if: always
  then: write each requirement as measurable, and link it to a user need
  because: an unmeasurable requirement cannot be verified
  example: '"p95 latency \< 200 ms", linked to a ticket'
  check: every requirement has an acceptance criterion and a link to a user need
  violation: '"the system shall be fast"'
  related:
    strengthens:
    - P54
    - P59
    strengthened_by:
    - P21
  evidence: moderate
  evidence_note: null
  source_domain: systems engineering
  notes: null
  sources:
  - fdot-systems-engineering-100
  management:
    name: Measurable requirements
    form_name: Measurable objectives
    form: write each objective with a measure, a target, a deadline and one owner, and link it to a customer or stakeholder need
    example: '"reduce median time to provision a namespace from 3 days to 1 hour by Q2", owner named'
    sources:
    - fema-national-incident-management-system
    - locke-latham-building-practically-useful
    source_titles:
      fema-national-incident-management-system: 'NIMS: management by objectives'
      locke-latham-building-practically-useful: Locke & Latham 2002
    evidence: strong
    evidence_note: null
- id: P10
  name: Decision records
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: B
  if: you make a significant design decision
  then: record the decision, why you made it, and which alternatives you rejected
  because: without the reason, later teams cannot judge whether the decision still holds
  example: Architecture Decision Record (ADR) in the repository
  check: each significant decision has a record with its reason and the rejected alternatives
  violation: nobody knows why the system is built this way
  related:
    strengthens:
    - P64
    - P80
    strengthened_by:
    - P16
    - P18
    - P20
  evidence: moderate
  evidence_note: null
  source_domain: software (ADR), civil and offshore (basis of design)
  notes: null
  sources:
  - spe-design-decommissioning
  - adr-github-io-architectural-decision
  management:
    name: Decision records
    form_name: Decision log
    form: record each significant management decision with its reason, the alternatives considered and the owner
    example: 'a decision log entry: "move to a shared on-call rotation; rejected: per-team rotation, because…"'
    sources:
    - coso-erm-integrating-strategy-performance
    - iso-30401-2018-knowledge-management
    source_titles:
      coso-erm-integrating-strategy-performance: COSO ERM principle 8 "Evaluates Alternative Strategies"
      iso-30401-2018-knowledge-management: ISO 30401:2018
    sources_text: '[@coso-erm-integrating-strategy-performance]; [@iso-30401-2018-knowledge-management] (supports)'
    evidence: moderate
    evidence_note: null
- id: P11
  name: Trustworthy evidence
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: B
  if: a record is used as evidence (test result, approval, measurement)
  then: make it attributable, legible, recorded at the time, original and accurate; changes must keep the original entry visible and record who, when and why
  because: evidence that can be changed silently proves nothing
  example: signed commits, immutable audit logs, CI results stored with the commit SHA
  check: a sample of records shows author, time and full change history
  violation: editing a test report after the fact without a trace
  related:
    strengthens:
    - P59
    - P64
    strengthened_by:
    - P13
    - P14
  evidence: strong
  evidence_note: required in regulated domains
  source_domain: pharma and clinical trials (ALCOA)
  notes: null
  sources:
  - fda-electronic-source-data-guidance
  - hgb-239
  management:
    name: Trustworthy evidence
    form_name: Proper bookkeeping and records
    form: keep business records so that no change hides the original entry, and so that the organization can demonstrate compliance
    example: budget changes are new entries with author and date, not overwrites
    sources:
    - hgb-239
    - gdpr-article-5
    - iso-15489-1-2016-records
    source_titles:
      hgb-239: § 239(3) HGB
      gdpr-article-5: GDPR Art. 5(2)
      iso-15489-1-2016-records: ISO 15489-1:2016
    evidence: strong
    evidence_note: German law for bookkeeping
- id: P12
  name: Model validity
  class: universal
  class_note: every design decision rests on a model or an estimate
  strength: SHOULD
  category: B
  if: a decision depends on a model, simulation or estimate
  then: validate the model for its intended use, use it only inside the range it was validated for (domain of applicability), and check each result against an independent rough estimate (order of magnitude)
  because: a model is only trustworthy inside its validated range
  example: a load test on 3 nodes does not prove behavior on 50 nodes
  check: each model used for a decision states its validated range, and the decision lies inside that range
  violation: extrapolating a benchmark far beyond the tested load
  related:
    depends_on:
    - P54
    strengthens:
    - P44
    strengthened_by:
    - P34
    - P58
    - P77
  evidence: moderate
  evidence_note: null
  source_domain: simulation and computational engineering, engineering physics (Fermi estimates)
  notes: null
  sources:
  - osti-perspective-model-validation-validated
  - flyvbjerg-from-nobel-prize-project
  - wikipedia-v-v-computer-simulation
  - wikipedia-fermi-problem
  - wikipedia-all-models-are-wrong
  management:
    name: Model validity
    form_name: Forecast validity (outside view)
    form: check each estimate or business case against the real outcomes of a reference class of similar past projects, not only against the own plan
    example: the migration estimate is compared with the last five migrations, which overran by 40 % on average
    sources:
    - flyvbjerg-from-nobel-prize-project
    source_titles:
      flyvbjerg-from-nobel-prize-project: Flyvbjerg 2006
    evidence: strong
    evidence_note: peer-reviewed
- id: P13
  name: Automated reproducible results
  class: universal
  class_note: every engineering result must be checkable by someone else (P56)
  strength: SHOULD
  category: B
  if: a result must be reproducible
  then: produce it only through automated, recorded steps, with versions of data, code and tools
  because: manual steps are error-prone and cannot be reproduced
  example: infrastructure changed only through pipelines; no manual kubectl edits; pinned tool versions
  check: each result can be regenerated from recorded inputs and versions with one command
  violation: a report built by copying numbers by hand
  related:
    depends_on:
    - P64
    strengthens:
    - P11
  evidence: moderate
  evidence_note: null
  source_domain: bioinformatics (reproducible computational research)
  notes: null
  sources:
  - sandve-et-al-ten-simple
  management:
    name: Automated reproducible results
    form_name: Reproducible reporting
    form: produce management figures (KPIs, budgets, forecasts) through automated, documented steps from named data sources
    example: the DORA dashboard is generated from pipeline data, not from a hand-edited spreadsheet
    sources:
    - coso-erm-integrating-strategy-performance
    source_titles:
      coso-erm-integrating-strategy-performance: COSO ERM principle 18 "Leverages Information Systems"
    evidence: moderate
    evidence_note: null
- id: P14
  name: Provenance
  class: universal
  class_note: almost every system uses parts or software from suppliers
  strength: SHOULD
  category: B
  if: parts or materials come from suppliers
  then: trace each part to its origin, batch and certificate (provenance)
  because: without provenance you cannot prove quality, or find all affected parts when a defect is found
  example: signed images with build provenance and SBOM; deployment by pinned digest
  check: for each deployed artifact, origin, build and certificate can be shown
  violation: running an unsigned image from an unknown registry
  related:
    strengthens:
    - P11
    - P78
  evidence: moderate
  evidence_note: null
  source_domain: metallurgical engineering (mill test certificates)
  notes: null
  sources:
  - slsa-v1-0-provenance
  - wikipedia-mill-test-report
  management:
    name: Provenance
    form_name: Supplier due diligence
    form: know each supplier and the risks in its own supply chain, and act on what you find
    example: a SaaS vendor's sub-processors and their data locations are known before signing
    sources:
    - oecd-due-diligence-guidance-responsible
    source_titles:
      oecd-due-diligence-guidance-responsible: OECD Due Diligence Guidance (2018)
    evidence: strong
    evidence_note: OECD guidance; national supply-chain laws exist
- id: P15
  name: Precaution
  class: risk-scaled
  class_note: only for serious or irreversible harm with incomplete evidence
  strength: SHOULD
  category: B
  if: a possible harm is serious or irreversible, and the evidence is incomplete
  then: take proportionate, cost-effective protective measures without waiting for full proof
  because: irreversible harm cannot be undone once the proof arrives
  example: take a snapshot and stop writes when data corruption is suspected, before the root cause is proven
  check: for each serious or irreversible risk with incomplete evidence, a record states which protective measure was taken, or why none was
  violation: writes continue while the team waits for proof of data corruption
  related:
    strengthens:
    - P37
    - P82
    strengthened_by:
    - P18
  evidence: moderate
  evidence_note: 'contested: critics call it vague and say strong versions block beneficial technology; this rule uses the weak, proportionate version'
  source_domain: environmental engineering (precautionary principle)
  notes: null
  sources:
  - un-rio-declaration-environment-development
  - wikipedia-precautionary-principle
  management:
    name: Precaution
    form_name: Precautionary management action
    form: when serious or irreversible harm is credible but unproven, take a proportionate protective step now
    example: payments to a supplier are paused while a fraud warning is checked
    sources: []
    sources_text: cross-reference only
    evidence: moderate
    evidence_note: null
- id: P16
  name: Set-based design
  class: risk-scaled
  class_note: only where uncertainty is high early; for a repeat design, one option is enough
  strength: SHOULD
  category: B
  if: uncertainty is high early in a design
  then: 'develop several alternatives in parallel, eliminate weak ones as evidence arrives, and commit only after feasibility is shown (set-based design; opposite: point-based design)'
  because: committing early to one option risks expensive rework when it fails
  example: prototype two ingress controllers until load tests decide
  check: early design records list the alternatives kept and the evidence that eliminated each rejected one
  violation: choosing one design at the start and discovering at the end that it cannot meet a requirement
  related:
    depends_on:
    - P58
    strengthens:
    - P10
    - P17
    strengthened_by:
    - P20
  evidence: moderate
  evidence_note: null
  source_domain: design engineering (Toyota set-based concurrent engineering)
  notes: null
  sources:
  - sobek-ward-liker-toyotas-principles
  management:
    name: Set-based design
    form_name: Keep strategic options open
    form: evaluate several strategies or options in parallel and drop weak ones as evidence arrives
    example: two vendors run a paid pilot before one contract is signed
    sources:
    - coso-erm-integrating-strategy-performance
    source_titles:
      coso-erm-integrating-strategy-performance: COSO ERM principle 8
    evidence: moderate
    evidence_note: null
- id: P17
  name: Technology maturity
  class: conditional
  class_note: 'counterexample: a system built only from proven technology'
  strength: SHOULD
  category: B
  if: the design depends on a technology that is new to the team or the industry
  then: assess how mature the technology is, and keep immature technology out of critical paths
  because: immature technology carries unknown failures
  example: CNCF sandbox project vs. graduated project for a core platform component
  check: each technology in a critical path has a recorded maturity assessment
  violation: adopting an untested tool for the production control plane without an assessment
  related:
    depends_on:
    - P10
    strengthens:
    - P22
    strengthened_by:
    - P16
    - P20
  evidence: strong
  evidence_note: standardized as ISO 16290:2013; NASA defines TRL 1 to 9
  source_domain: aerospace (NASA TRL), EU, DoD
  counterexample: a system built only from proven technology
  notes: null
  sources:
  - nasa-technology-readiness-levels
  - wikipedia-technology-readiness-level
  management:
    name: Technology maturity
    form_name: Maturity of new tools, vendors and methods
    form: assess the maturity of a new tool, vendor or management method before it carries a critical process
    example: a start-up vendor is not chosen for the payroll process without an exit plan
    sources:
    - iso-56001-2024-innovation-management
    source_titles:
      iso-56001-2024-innovation-management: ISO 56001:2024
    sources_text: '[@iso-56001-2024-innovation-management] (supports)'
    evidence: moderate
    evidence_note: null
- id: P18
  name: Decision speed by reversibility
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: B
  if: you make a decision
  then: classify it as reversible (two-way door) or irreversible (one-way door); make reversible decisions quickly at the lowest competent level, and irreversible decisions slowly, with consultation and review
  because: heavy process on reversible decisions causes slowness and too little experimentation; light process on irreversible decisions causes lasting harm
  example: 'a new linter rule: the team decides today; deleting a production database or changing the cloud provider: P42, red team, ADR'
  check: each decision record (P10) states the class (reversible or irreversible) and the matching process
  violation: a three-week approval for a reversible tool trial; a lock-in contract signed in one meeting
  related:
    strengthens:
    - P10
    - P15
    - P42
    conflicts_with:
    - P56
    - P64
  related_text: strengthens P10, P15, P42; conflicts with P56, P64 (see K5)
  evidence: moderate
  evidence_note: "practitioner source: a CEO's shareholder letter; consistent with P15 and P42"
  source_domain: management (decision making)
  notes: null
  sources:
  - amazon-2015-letter-shareholders
  management: null
- id: P19
  name: Indicators are not targets
  class: universal
  class_note: every system and every team whose performance is measured (P70, P58)
  strength: SHOULD
  category: B
  if: a measure is used to reward, rank or punish people
  then: 'expect it to be gamed: pair it with a counter-measure, compare it with direct observation, and change it when it drifts from the real objective'
  because: the more a quantitative indicator is used for decisions, the more it is corrupted and the more it distorts the process it measures (Campbell's law)
  example: deployment frequency is paired with change failure rate; MTTR is not a bonus target
  check: each rewarded indicator has a counter-indicator and a yearly review of whether it still tracks the objective
  violation: ticket count as the only measure of on-call quality
  related:
    strengthens:
    - P58
    - P70
    - P82
    conflicts_with:
    - P21
  evidence: strong
  evidence_note: Campbell; the same pattern is known as Goodhart's law
  source_domain: management (performance measurement)
  notes: null
  sources:
  - campbell-assessing-impact-planned-social
  - wikipedia-campbells-law
  management: null
- id: P20
  name: Stop criteria set in advance
  class: universal
  class_note: trigger that occurs in the life cycle of every system (every system starts as a project)
  strength: SHOULD
  category: B
  if: you start a project or prototype with an uncertain outcome
  then: write down, before starting, the evidence and the decision points (gates) at which it stops, and let someone who did not start it make the continue-or-stop decision
  because: people who are responsible for an earlier decision commit the most resources to it after negative results (escalation of commitment)
  example: a service-mesh pilot stops if p99 latency rises by more than 5 ms after 4 weeks; the architecture board, not the sponsor, decides
  check: each project and prototype has written stop criteria and gate dates, and gate decisions are made by someone other than the sponsor
  violation: '"we have invested too much to stop now"'
  related:
    strengthens:
    - P10
    - P16
    - P17
    - P65
  evidence: strong
  evidence_note: experimental research, Staw 1976; PRINCE2 "continued business justification"
  source_domain: management (project management, organizational psychology)
  notes: null
  sources:
  - staw-knee-deep-big-muddy
  - purple-griffon-prince2-7th-edition
  management: null
- id: P21
  name: Specific, challenging goals with feedback
  class: universal
  class_note: every engineering organization sets goals
  strength: SHOULD
  category: B
  if: you set goals for people or teams
  then: set few, specific and challenging goals, give regular feedback on progress toward them, and for new or complex tasks set learning goals first
  because: specific, difficult goals lead to higher performance than "do your best", and goals plus feedback work better than goals alone
  example: '"cut median build time from 12 to 6 minutes this quarter", with a weekly chart; for a new technology: "run three spikes and document what we learned"'
  check: each goal has a measure, a deadline and a progress chart; new or complex work has learning goals
  violation: '"do your best" as the only goal; goals without progress feedback'
  related:
    strengthens:
