- id: P58
  name: Comparable measurement
  class: universal
  class_note: every engineering decision uses measurements
  strength: SHOULD
  category: F
  if: measurements are used to compare or decide
  then: measure under stated, controlled reference conditions, report the uncertainty with every result, and calibrate instruments regularly against traceable references
  because: uncontrolled conditions change results, and a result without its uncertainty is incomplete
  example: benchmarks on the same instance type with fixed load and warm-up; report the spread over several runs
  check: each benchmark or test report states its reference conditions and the spread or uncertainty of the result
  violation: comparing two single benchmark runs from different machines
  related:
    strengthens:
    - P12
    - P57
    strengthened_by:
    - P19
  evidence: strong
  evidence_note: standardized in ISO 139 and the GUM; standard text is paid; only the official summary was read
  source_domain: textile testing (ISO 139), metrology (GUM, traceability)
  notes: null
  sources:
  - iso-139-2005-textiles-standard
  - chiuvention-why-fabric-test-results
  - wikipedia-measurement-uncertainty
  - wikipedia-metrological-traceability
  management:
    name: Comparable measurement
    form_name: Comparable indicators
    form: define each indicator once (formula, period, population, data source), and show its normal variation before comparing teams or periods
    example: lead time is measured the same way for all teams before teams are compared
    sources:
    - iso-tc-260-people-power
    source_titles:
      iso-tc-260-people-power: 'ISO/TS 30433: "comparable measures" (via ISO TC 260)'
    evidence: moderate
    evidence_note: null
- id: P59
  name: Traceability
  class: risk-scaled
  class_note: required by safety standards for safety-critical or regulated systems; costly elsewhere
  strength: MUST
  category: F
  if: the system is safety-critical or regulated
  then: link every requirement in both directions to design and test
  because: standards require proof of complete coverage
  example: requirement ↔ code ↔ test ID in the ticket system
  check: a traceability report shows no requirement without a test and no test without a requirement
  violation: tests that link to no requirement
  related:
    depends_on:
    - P9
    strengthened_by:
    - P9
    - P11
  evidence: strong
  evidence_note: null
  source_domain: aerospace, automotive, medical (DO-178C, ISO 26262, IEC 62304)
  notes: null
