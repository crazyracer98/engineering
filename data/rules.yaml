- id: P57
  name: Test as you operate
  class: universal
  class_note: trigger that occurs in the life cycle of every system
  strength: SHOULD
  category: F
  if: a test must show that the system is ready
  then: run the test in the same configuration and conditions as real operation, and test again after every repair
  because: systems that passed every test have failed in operation because operation differed from the test
  example: staging uses the same image digest and Helm values as production
  check: the differences between the test setup and real operation are listed, and each one is justified
  violation: testing a different build than the one that is deployed
  related:
