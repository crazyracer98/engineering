  - iso-10993-1-biological-evaluation
  - wikipedia-galvanic-corrosion
  - wikipedia-biocompatibility
  management:
    name: Compatibility
    form_name: Compatibility of teams, processes and cultures
    form: before merging teams, organizations or processes, check that they are compatible, and plan the integration of the differences
    example: before two platform teams merge, their on-call rules and release processes are compared
    sources: []
    sources_text: cross-reference only
    evidence: moderate
    evidence_note: null
- id: P30
  name: Exact constraint
  class: universal
  class_note: over-constraint can occur in any system with more than one control mechanism
  strength: SHOULD
  category: C
  if: several mechanisms can set the same property
  then: constrain each property exactly once, with one owner (exact constraint)
  because: over-constraint makes parts fight each other and deform the system
  example: either the HPA or the GitOps manifest owns the replica count, not both; one source of truth per configuration value
  check: each managed field has exactly one owner
  violation: Argo CD and the HPA both set the replica count and keep reverting each other
  related:
    strengthens:
    - P23
    - P64
    strengthened_by:
