  - who-ilo-long-working-hours
  - pencavel-productivity-working-hours
  - wikipedia-fatigue
  - wermac-corrosion-allowance
  management:
    name: Accumulated degradation
    form_name: Sustainable pace
    form: limit sustained overtime and track debt that builds up slowly (overtime, deferred maintenance, technical debt)
    example: on-call load and overtime are reviewed monthly; no one works above 48 h per week as a pattern
    sources:
    - who-ilo-long-working-hours
    - pencavel-productivity-working-hours
    - principles-behind-agile-manifesto
    source_titles:
