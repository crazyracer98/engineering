  - wikipedia-multi-barrier-approach
  management:
    name: Defense in depth
    form_name: Three lines
    form: 'use independent lines: first line (management owns risk), second line (risk, compliance, security functions), third line (independent internal audit)'
    example: the platform team owns access risk, security monitors it, internal audit tests both
