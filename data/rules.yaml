  management:
    name: Lifecycle and decommissioning
    form_name: Plan the exit at the start
    form: 'when starting a contract, project, product, data collection or role, plan how it ends: exit clause, closure, sunset, deletion, handover'
    example: every vendor contract has an exit and data-return clause; personal data has a deletion date
