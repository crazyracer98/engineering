- id: P26
  name: Design for testability
  class: universal
  class_note: true for every system
  strength: SHOULD
  category: C
  if: always
  then: build ways to set and observe the internal state of each part into the design, so that it can be tested
  because: a state you cannot set or observe cannot be tested
  example: health and readiness endpoints, dry-run modes, feature flags for testing, debug endpoints
  check: each component has documented test access to set and observe its key states
  violation: a component that can only be tested in production
  related:
