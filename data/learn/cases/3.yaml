- id: case-columbia-2003-organizational-causes
  title: Space Shuttle Columbia (2003)
  year: 2003
  summary: >-
    Foam struck the orbiter Columbia during launch, and the Shuttle was lost. The
    Columbia Accident Investigation Board did not stop at the part that broke or
    the people closest to it. It looked for causes in the organization. It found
    that the causes behind the Challenger accident in 1986 had not been fixed.
  rules: [P80, P81]
  lessons:
  - rule: P80
    text: >-
      The board warns that many investigations stop at the part that broke and
      the person closest to it, and that such corrections lead to a misguided
      belief that the underlying problem has been solved. Its own cause model
      took in NASA as an organizational whole.
  - rule: P81
    text: >-
      Seventeen years after Challenger, the board found that the causes of the
      institutional failure behind it had not been fixed, and that NASA had
      failed to identify a similar trend. P81's check closes that loop:
      actions from earlier cycles are tracked until they are completed.
  quotes:
  - source: case-caib-report-vol1-ch7
    text: Even after it was clear from the launch videos that foam had struck the Orbiter in a manner never before seen
  - source: case-caib-report-vol1-ch7
    text: were largely silent during the events leading up to the loss of Columbia.
  - source: case-caib-report-vol1-ch7
    text: Many accident investigations make the same mistake in defining causes. They identify the widget that broke or malfunctioned, then locate the person most closely connected with the technical failure
  - source: case-caib-report-vol1-ch7
    text: Such corrections lead to a misguided and potentially disastrous belief that the underlying problem has been solved.
  - source: case-caib-report-vol1-ch7
    text: A central piece of our expanded cause model involves NASA as an organizational whole.
  - source: case-caib-report-vol1-ch7
    text: That silence was not merely a failure of safety, but a failure of the entire organization.
  - source: case-caib-report-vol1-ch8
    text: the causes of the institutional failure responsible for Challenger have not been fixed.
  - source: case-caib-report-vol1-ch8
    text: Seventeen years separated the two accidents.
  - source: case-caib-report-vol1-ch8
    text: problems cannot be solved simply by retirements, resignations, or transferring personnel.
  - source: case-caib-report-vol1-ch8
    text: The Board had a hard time understanding how, after the bitter lessons of Challenger, NASA could have failed to identify a similar trend.
- id: case-challenger-1986-o-ring-anomalies
  title: Space Shuttle Challenger (1986)
  year: 1986
  summary: >-
    Challenger was lost when a joint of its right solid rocket motor failed. The
    joint's O-rings had shown erosion and blow-by on earlier flights. NASA and
    its contractor Thiokol did not solve the problem. Instead they came to accept
    it as an acceptable flight risk, and raised the amount of damage they
    considered acceptable.
  rules: [P82]
  lessons:
  - rule: P82
    text: >-
      As O-ring damage recurred, NASA and Thiokol accepted escalating risk,
      apparently because they "got away with it last time." Tracking only the anomalies outside
      prior flight experience let major problems drop out of the reporting
      system. A recurring anomaly needs an
      investigation and a decision, not quiet acceptance.
  quotes:
  - source: case-rogers-commission-ch6
    text: The genesis of the Challenger accident-the failure of the joint of the right Solid Rocket Motor-began with decisions made in the design of the joint
  - source: case-rogers-commission-ch6
    text: Morton Thiokol, Inc., the contractor
  - source: case-rogers-commission-ch6
    text: as tests and then flights confirmed damage to the sealing rings, the reaction by both NASA and Thiokol was to increase the amount of damage considered “acceptable.”
  - source: case-rogers-commission-ch6
    text: Neither organization developed a solution to the unexpected occurrences of O-ring erosion and blow-by even though this problem was experienced frequently during the Shuttle flight history. Instead, Thiokol and NASA management came to accept erosion and blow-by as unavoidable and an acceptable flight risk.
  - source: case-rogers-commission-ch6
    text: NASA and Thiokol accepted escalating risk apparently because they “got away with it last time.”
  - source: case-rogers-commission-ch6
    text: Tracking and continuing only anomalies that are “outside the data base” of prior flight allowed major problems to be removed from, and lost by, the reporting system.
