# Run with prek (https://prek.j178.dev/, a Rust, drop-in-compatible
# reimplementation of pre-commit — see CLAUDE.md for why) or with the
# classic `pre-commit` CLI; both read this exact file.
#
# Fast, basic checks run on every commit. Every hook also carries the
# "manual" stage, so `prek run --hook-stage manual --all-files` runs
# everything at once regardless of which git hook would normally trigger
# it. An instance layers its own language-specific hooks (ruff/mypy/
# pytest, cargo fmt/clippy, golangci-lint, eslint/tsc, tflint, ...) onto
# this file's `repos:` list — see docs/TEMPLATE.md's "Checks" section.
default_install_hook_types:
  - pre-commit
  - pre-push
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit, manual]
      - id: end-of-file-fixer
        stages: [pre-commit, manual]
      - id: check-yaml
        stages: [pre-commit, manual]
      - id: check-toml
        stages: [pre-commit, manual]
      - id: check-json
        stages: [pre-commit, manual]
      - id: check-added-large-files
        stages: [pre-commit, manual]
      - id: check-merge-conflict
        stages: [pre-commit, manual]
      - id: mixed-line-ending
        stages: [pre-commit, manual]
      - id: debug-statements
        stages: [pre-commit, manual]
      - id: detect-private-key
        stages: [pre-commit, manual]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      # No "manual" stage here, unlike every other hook in this file: this
      # one needs the actual commit-message file git passes at the
      # commit-msg stage, which "prek run --all-files --hook-stage manual"
      # has no equivalent for.
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: template-sync-manifest
        name: template-sync-manifest (every tracked path classified)
        entry: python3 .github/scripts/template_sync_manifest.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: scripts-tests
        name: scripts-tests (.github/scripts unit tests, executable bits)
        entry: env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s .github/scripts -p "test_*.py"
        language: system
        files: ^(\.github/(scripts|workflows)/|\.claude/hooks/|Makefile$)
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: devcontainer-lock
        name: devcontainer-lock (lockfile matches devcontainer.json features)
        entry: python3 .github/scripts/check_devcontainer_lock.py
        language: system
        files: ^\.devcontainer/devcontainer(-lock)?\.json$
        pass_filenames: false
        stages: [pre-commit, manual]

      # Instance hooks: run through uv so they use the locked tool versions.
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        files: ^(src|tests)/.*\.py$
        require_serial: true
        stages: [pre-commit, manual]

      - id: ruff-format
        name: ruff format --check
        entry: uv run --locked ruff format --check
        language: system
        files: ^(src|tests)/.*\.py$
        require_serial: true
        stages: [pre-commit, manual]

      - id: mypy
        name: mypy (strict)
        entry: uv run --locked mypy
        language: system
        files: ^(src|tests)/.*\.py$
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: js-deps
        name: js deps (tests/js lockfile, jsdom)
        entry: npm ci --prefix tests/js --ignore-scripts --no-audit --no-fund
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: js-tests
        name: js tests (quiz core, NFR-0002)
        entry: node --test "tests/js/**/*.test.js"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, manual]

      - id: taxonomy-check
        name: taxonomy check (dataset integrity, NFR-0001)
        entry: uv run --locked taxonomy check
        language: system
        files: ^(data|schema|src|paper|docs|publication|sources)/|^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages: [pre-commit, manual]

      - id: taxonomy-generated
        name: taxonomy build --check (publication/ is current)
        entry: uv run --locked taxonomy build --check
        language: system
        files: ^(data|schema|src|paper|docs|publication|sources)/|^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
        stages: [pre-commit, manual]

      # Manual stage only: they build the full site and PDF, which is too
      # slow for every commit. CI runs them via `--hook-stage manual`.
      - id: site-build
        name: site build (taxonomy site)
        entry: env NO_MKDOCS_2_WARNING=1 uv run --locked taxonomy site --out build/site
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: paper-build
        name: paper build (taxonomy paper)
        entry: uv run --locked taxonomy paper --out build/paper.pdf
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
